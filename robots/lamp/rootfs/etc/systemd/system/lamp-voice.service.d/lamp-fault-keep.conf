# A fault's last lines, kept on the eMMC past a power cut (#8713):
# /usr/local/libexec/lamp-journal-keep says how. A drop-in of its own, never
# exit-note.conf, which install owns: a lamp's copy of this one can be
# removed by name. At every stop, systemd hands it $SERVICE_RESULT, and it
# keeps nothing of a success. `ExecStopPost=`, not `OnFailure=`: it runs
# inside the stop, with that stop's result and before `Restart=` starts the
# part again, so the lines are the dead run's last; `OnFailure=` would start
# a unit of its own beside the restart, whose timing and firing on an
# auto-restart depend on systemd's version. "+": as root past the unit's own
# sandbox, to read the journal and write /var/lib/lamp-journal. "-": it
# never fails the stop.
[Service]
ExecStopPost=-+/bin/bash /usr/local/libexec/lamp-journal-keep fault %n

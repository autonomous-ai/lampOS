# The last two boots' journal, kept on the eMMC at a clean shutdown or
# reboot only (#2602), so `journalctl -b -1` works after an update or a
# reboot. /usr/local/libexec/lamp-journal-keep says how.
#
# On the base unit, not one of the image's own: orangepi-ramlog.service is
# already enabled, and stopped at shutdown (Conflicts=shutdown.target), and
# its stop is where /var/log, the RAM disk with this boot's journal, is
# unmounted. So the keep runs first: ExecStop= is cleared and the base's own
# stop (as /lib/systemd/system/orangepi-ramlog.service has it on lamp-06c1)
# comes after it. At boot the kept files are linked into /run/log/journal,
# where journalctl reads them. "-": neither may fail ramlog, whose stop has
# to run for the night's logs to reach the eMMC. "zz-" so it is read after
# any other drop-in.
[Service]
ExecStartPost=-/bin/bash /usr/local/libexec/lamp-journal-keep link
ExecStop=
ExecStop=-/bin/bash /usr/local/libexec/lamp-journal-keep keep
ExecStop=/usr/lib/orangepi/orangepi-ramlog stop

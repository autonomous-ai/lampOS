# The night's copy-back of the logs, never over the open journal (#1178).
#
# The base image's logrotate.service runs `orangepi-ramlog write` (the /var/log
# RAM disk copied to /var/log.hdd on the eMMC), then logrotate, then
# `orangepi-ramlog postrotate`, which writes every file of /var/log.hdd back
# over its /var/log twin with `cat file > dest`. The journal is among them:
# journald's open system.journal was overwritten in place with the copy taken
# seconds before, and on lamp-4ace at 00:00 on 19 Oct every read of it said
# "truncated, ignoring file" until a `journalctl --rotate` at 00:11.
#
# The same copy-back, with /var/log.hdd/journal left out. The rotated text
# logs still come back to the RAM disk, and the journal is still copied to
# the eMMC each night by `write`. "zz-" so it is read after any other drop-in.
[Service]
ExecStartPost=
ExecStartPost=/bin/bash /usr/local/libexec/lamp-ramlog-postrotate

# The lamp's journal kept well inside its RAM disk (#1178).
#
# /var/log is a RAM disk (orangepi-ramlog, zram: 50M on the image as
# installed; 400M where someone set SIZE by hand, as on lamp-4ace), and
# orangepi-ramlog copies every changed file in it to the eMMC each night.
# The base image's journald.conf says SystemMaxUse=20M (lamp-75c9 and
# lamp-cb94 as installed). lamp-4ace's had been set to 1G by hand: on 17 Oct
# 2026 its journal filled the disk, the voice's lines were lost until a
# rotate by hand, and its 171M of journal were copied whole at 00:00, the
# night the voice ended at 00:00:06. A home lamp can't be rotated by hand.
#
# The base's 20M, pinned here so an edit of journald.conf doesn't undo it:
# at most 20M of journal, in files of 4M, and 10M of the disk always left
# free. A night's copy is then the day's new files plus one 4M active file.
# At lamp-4ace's rate on 17 Oct, 20M is about three hours of journal; a
# quieter lamp keeps more, but nothing should count on a whole day. "zz-" so
# it is read after any other drop-in, the image's persistent.conf included.
[Journal]
SystemMaxUse=20M
SystemMaxFileSize=4M
SystemKeepFree=10M
RuntimeMaxUse=20M
RuntimeMaxFileSize=4M

asks = ["slow probe"]
kind = "installable"
version = "1.0.0"
grants = ["speak"]
# A tool loads it: an installed skill's asks call its tool, and only a made-here one is started by its asks alone
# (crates/skills/src/lib.rs:4521, :3723, :3800; the load test's BRIEF, lib.rs:14225).
tool = "slow_probe"

[permissions]
speak = true

# #8180 ROW leg H test fixture, removed by unrow: a run step that runs about 20 s (under RUN_WITHIN's 30 s),
# so lamp-tasks can be restarted while it runs.
[[do]]
run = "scripts/main.py"

asks = ["lemon probe"]
kind = "installable"
version = "1.0.0"
grants = ["speak"]
# A tool loads it: an installed skill's asks call its tool, and only a made-here one is started by its asks alone
# (crates/skills/src/lib.rs:4521, :3723, :3800; the load test's BRIEF, lib.rs:14225).
tool = "lemon_probe"

[permissions]
speak = true

# #8180 ROW leg C test fixture, removed at put-back: a run step whose script asks for the
# camera, which is not its grant; lamp-control must refuse it (no_grant).
[[do]]
run = "scripts/main.py"

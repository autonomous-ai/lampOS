# With LAMP_WELLBEING_SPACING=on (#5207), as back-after-ten-minutes: with no
# local time known the morning's first_today never holds, so each arrival
# gets the hello as before, and only one: at 603 s and 2,403 s.
switches = ["LAMP_WELLBEING_SPACING"]

[[expect]]
at = "603s"
call = "body.gaze"
args = { look_at = "face", x = 0.0, y = -0.25, size = 0.25 }

[[expect]]
at = "603s"
call = "light"
args = { colour = "warm" }

[[expect]]
at = "603s"
call = "say"
args = { note = "They are back at their desk. Say only a hello and their name if you know it, in one short line: nothing else.", priority = 5, expires_ms = 60000 }

[[expect]]
at = "2403s"
call = "body.gaze"
args = { look_at = "face", x = 0.5, y = 0.25, size = 0.25 }

[[expect]]
at = "2403s"
call = "light"
args = { colour = "warm" }

[[expect]]
at = "2403s"
call = "say"

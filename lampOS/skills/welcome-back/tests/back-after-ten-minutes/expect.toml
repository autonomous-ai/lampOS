# The voice resting throughout. Nobody near for ten minutes: a face across the
# room at 300 s (0.10 of the picture's height) is not someone at the desk. Then
# someone sits down at 600 s (two faces; the larger is looked at): a hello at
# 603 s, once they have been there three seconds. Away 60 s at 700-760 s:
# nothing. Away again 1,000-1,400 s but within the cooldown: nothing. Away
# 2,000-2,400 s: a hello at 2,403 s.
[[expect]]
at = "603s"
call = "body.gaze"
args = { look_at = "face", x = 0.0, y = -0.25, size = 0.25 }

[[expect]]
at = "603s"
call = "light"
args = { colour = "warm" }

[[expect]]
at = "603s"
call = "say"
args = { note = "They are back at their desk. Greet them in one short line, by name if you know it.", priority = 5, expires_ms = 60000 }

[[expect]]
at = "2403s"
call = "body.gaze"
args = { look_at = "face", x = 0.5, y = 0.25, size = 0.25 }

[[expect]]
at = "2403s"
call = "light"
args = { colour = "warm" }

[[expect]]
at = "2403s"
call = "say"

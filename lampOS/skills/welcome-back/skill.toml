needs = ["eyes", "voice", "body", "light"]
# Comes with the lamp and is always there (docs/skills.md, "Core and
# installable skills"): the hello when someone is back at their desk.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: the faces, the voice's state,
# the look, the warm glow and the hello.
[permissions]
topics = ["humans/faces/tracked", "voice/state"]
speak = true
light = true
body = true
# Its note is told who is at the lamp: a known face's name, one beat warmer
# for someone who comes by often (#2825). No other skill has it.
who = true

[[trigger]]
topic = "humans/faces/tracked"
when = "appears"            # a face where there was none
near = 0.14                 # at the desk: seated 0.17 to 0.30 of the picture's height, 1.5 m off at most 0.12 (lamp-06c1 and lamp-4ace, 2026-10-16)
absent_for = "5m"           # after at least five minutes with nobody, counted from the last hold that lasted its `for` (#2825)
for = "3s"                  # there for three seconds without a break
gap = "3s"                  # a look down at the keyboard does not end it
wait = "60s"                # a room that talks: kept for a minute while they stay, taken once both conditions hold (#1140)
cooldown = "20m"
# After a night the lamp rested, Bedtime and Morning's morning greeting is
# the welcome back: this face waits until that chance is judged, and is not
# greeted twice (the first builder's ruling on #1672). Off with that skill.
yields_to = { skill = "bedtime-morning", trigger = "morning" }

[[while]]                   # nothing heard or said for 5 s: an office's own talk passes in 1 to 4 s (#1140)
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"

[[while]]                   # the lamp itself has not spoken for 30 s: no "welcome back" to someone it has just talked with
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "30s"

[ask]                       # anything the lamp starts itself asks the Policy first; this hello even with LAMP_SKILLS_ASK=skip
policy = "hello"

[[do]]
body = { look_at = "face" }
light = "warm_glow"
# The hello lives a minute, as the chance does (`wait`): a room line the lamp
# answers as it is asked, and the voice's 15 s quiet after that turn, take
# more than the say's own 30 s (#2861, round 2 on lamp-06c1, 27 Oct). One say
# a skill and the 20-minute cooldown keep it to one hello an arrival; the
# Policy's hello gate, asked even with LAMP_SKILLS_ASK=skip, to one an hour
# to each person (the first builder, 30 Oct, on the launch testers' findings).
say = { note = "They are back at their desk. Say only a hello and their name if you know it, in one short line: nothing else.", expires = "60s" }

# Posture: V1's posture reminder, from the cloud's posture reading (#6543).
# The owner's call (23 Nov): its own skill, apart from Sit back, which is
# the face grown bigger and nothing else. When lamp-seen's window of
# samples is full and reads mostly bad, the lamp turns to the person and
# says one short line naming the region that was most often bad and one
# concrete fix, as V1's wellbeing skill said it
# (skills/wellbeing/reference/posture.md in V1). Written to lamp-skills'
# schema (docs/skills.md, "The schema, as lamp-skills reads it").
#
# V1's rule (hal/drivers/sensing/perceptions/processors/motion.py, the
# fold of `[posture_summary]`): the pose window complete, the user still
# sedentary, at least POSE_WINDOW_MIN_SAMPLES (3) samples, and bad_ratio at
# least POSE_BAD_RATIO (0.6). The owner's call (27 Nov, at lamp-06c1, #8377):
# "we should tell user when they slump for like 1m (two posture check
# right?). Which health check only tell user when they are slump for 10m?
# thay is too late". V2's `humans/posture` carries the window's length
# (`window_s`, at most lamp-seen's minute), its bad share (`bad_share`, by
# V1's rules) and the region most often bad (`region`): said only while
# someone sits at the desk and the window holds its two samples, a check
# every 30 s (lamp-seen's `pose::window::MIN_SAMPLES`). So: a value said is
# sitting and two checks; `window_s` above 59 is lamp-seen's minute full;
# `bad_share` above 0.5999 is V1's 0.6 or more (`above` is strict), which
# over two checks is both bad. One trigger a region, each
# with its own line, as a note is fixed words with no slot for a reading.
# The line never gives a number: no minutes, no share. No disease and no
# condition, never a camera.
needs = ["eyes", "body", "voice"]
# Core, in the product's install (`install::PRODUCT_SKILLS`). Says nothing
# without lamp-seen's posture (`LAMP_SEEN_POSTURE=on` beside
# `LAMP_SEEN_ACTIVITY=on`, and the owner's desk-noticing yes): the topic is
# never said, and no trigger holds.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: lamp-seen's posture reading,
# the voice's state, and a turn toward the face. One short line, worded by
# the voice. No condition reads the faces any more, but the turn does:
# `look_at = "face"` reads `humans/faces/tracked`, and lamp-skills refuses
# it without the topic.
[permissions]
speak = true
topics = ["humans/posture", "humans/faces/tracked", "voice/state"]
body = true

# One trigger for each region `humans/posture` names (lamp_msgs
# PostureRegion: V1's regions, wrist left out since the server fixes it at
# 1), and `general` for a window bad by the overall RULA risk with no one
# region standing out (V1's "empty / mixed" row; `none` until the owner's
# call of 27 Nov, read as nothing wrong). No `rearm`: a window still bad is told again once the
# cooldown is past: 15 minutes (the owner, 27 Nov: "only 15m cooldown, not
# 60m"), each region on its own: a slump that moves from the neck to the
# back is told again at once (the owner, 27 Nov: "neck slump and back slump
# is two different thing").
[[trigger]]
name = "neck"
topic = "humans/posture"
field = "region"
equals = "neck"
cooldown = "15m"

[[trigger]]
name = "trunk"
topic = "humans/posture"
field = "region"
equals = "trunk"
cooldown = "15m"

[[trigger]]
name = "upper_arm"
topic = "humans/posture"
field = "region"
equals = "upper_arm"
cooldown = "15m"

[[trigger]]
name = "lower_arm"
topic = "humans/posture"
field = "region"
equals = "lower_arm"
cooldown = "15m"

[[trigger]]
name = "general"
topic = "humans/posture"
field = "region"
equals = "general"
cooldown = "15m"

[[while]]                 # V1's POSE_BAD_RATIO: at least 0.6 of the window's samples bad
topic = "humans/posture"
field = "bad_share"
above = 0.5999

[[while]]                 # the window complete: lamp-seen's minute, two checks, all in
topic = "humans/posture"
field = "window_s"
above = 59

# Said with others in view too, and at any hour (the owner, 27 Nov: "what
# if user working late or early morning? we should tell them about bad
# posture too"): no `faces_at_most` and no `[quiet]`.

[[while]]                 # the lamp itself has not spoken for 10 s (the owner, 27 Nov)
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "10s"

[[while]]                 # never while they talk, or in the middle of a conversation (Sit back's)
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"

# No `[budget]`: never the wellbeing group's hour (the owner, 27 Nov:
# posture is neither held back by it nor spends it), and no limit across
# its regions but each trigger's cooldown.

# The wellbeing skills' one function (#1685), shared by its `group` with
# the wellbeing `[budget]` group's skills though Posture is not in their
# hour (#8377): it stops the one that came last, or with all, every one;
# with the kind `posture`, this one alone.
# Its `about` is A sip of water's and Rest your eyes', word for word, and
# its `when` every wellbeing skill's: of the product's live wellbeing skills
# it is the first in folder order, so the function the model is told is as
# before, whichever order the skills are read in.
[stop]
tool = "wellbeing_nudges"
group = "wellbeing"
kind = "posture"
about = "When someone asks you to stop a wellbeing nudge, the lamp's short hints after a long sitting (a slow blue glow for water, a tilt to rest the eyes, a turn to stand up, a word for a short break, a mealtime question, a word to sit back, an evening droop): snooze it until tomorrow morning, turn it off until they ask again, or on again. all = true for 'the nudges' with no kind named; leave both out for 'that one', the last. Never a reminder they set ('stop reminding me to drink water'): that is cancel_reminder."
when = "When asked to snooze, turn off or on again the lamp's wellbeing nudges (water, eyes, stand up, a break, a meal, sit back, wind down), or told they just had a drink. Not for reminders: cancel_reminder."

[ask]
policy = "nudge"

[[do]]
on = "neck"
body = { look_at = "face" }
say = "Their head has been bent down for a while, as when looking down at a phone or the desk. In one short, kind line, the way a friend would, say that's hard on the neck, and suggest lifting what they're looking at up toward eye level, or lifting the head. Say only 'a while', never a number; name no condition or illness, and never mention a camera."

[[do]]
on = "trunk"
body = { look_at = "face" }
say = "They have sat a while leaning forward over the desk. In one short, kind line, the way a friend would, suggest sitting back and letting the chair support the back. Say only 'a while', never a number; name no condition or illness, and never mention a camera."

[[do]]
on = "upper_arm"
body = { look_at = "face" }
say = "They have sat a while with their shoulders raised. In one short, kind line, the way a friend would, suggest gently letting the shoulders relax. Say only 'a while', never a number; name no condition or illness, and never mention a camera."

[[do]]
on = "lower_arm"
body = { look_at = "face" }
say = "They have sat a while with their forearms at an awkward angle. In one short, kind line, the way a friend would, suggest adjusting the keyboard so the elbows rest comfortably. Say only 'a while', never a number; name no condition or illness, and never mention a camera."

[[do]]
on = "general"
body = { look_at = "face" }
say = "They have sat a while in a way that is hard on the back and shoulders. In one short, kind line, the way a friend would, suggest sitting up tall with the shoulders relaxed. Say only 'a while', never a number; name no condition or illness, and never mention a camera."

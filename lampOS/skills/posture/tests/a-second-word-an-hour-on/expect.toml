# 11:00, bad neck for 80 minutes: the word at 10 and again at 70, not before (the 60m
# cooldown: V1 judged a 60-min window; V2 judges lamp-seen's 10-min window, and the
# 60m cooldown keeps it to one an hour).
clock = "11:00"

[[expect]]
at = "10m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "10m"
within = "1m"
call = "say"
args = { note = "They have sat a while with their head forward of their shoulders. In one short, kind line, the way a friend would, suggest gently bringing the head back over the shoulders. Say only 'a while', never a number; name no condition or illness, and never mention a camera." }

[[expect]]
at = "70m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "70m"
within = "1m"
call = "say"
args = { note = "They have sat a while with their head forward of their shoulders. In one short, kind line, the way a friend would, suggest gently bringing the head back over the shoulders. Say only 'a while', never a number; name no condition or illness, and never mention a camera." }

# 11:00, lamp-seen's two checks bad, region trunk (the back), from its second check at
# 30 s to 10 minutes, then sitting well: the window full at 30 s, a word for it then, once.
clock = "11:00"

[[expect]]
at = "30s"
within = "30s"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "30s"
within = "30s"
call = "say"
args = { note = "They have sat a while leaning forward over the desk. In one short, kind line, the way a friend would, suggest sitting back and letting the chair support the back. Say only 'a while', never a number; name no condition or illness, and never mention a camera." }

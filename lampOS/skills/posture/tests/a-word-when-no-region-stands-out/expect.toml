# 11:00, both checks bad and region general (bad by the RULA risk alone, no region high)
# to 10 minutes: V1's empty or mixed row, a word to sit up tall with the shoulders relaxed at 30 s (the owner, 27 Nov).
clock = "11:00"

[[expect]]
at = "30s"
within = "30s"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "30s"
within = "30s"
call = "say"
args = { note = "They have sat a while in a way that is hard on the back and shoulders. In one short, kind line, the way a friend would, suggest sitting up tall with the shoulders relaxed. Say only 'a while', never a number; name no condition or illness, and never mention a camera." }

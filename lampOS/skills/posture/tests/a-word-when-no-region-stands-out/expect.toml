# 11:00, bad_share 0.7 and region none (bad by the RULA risk alone, no region high):
# V1's empty or mixed row, a word to stand up for a short stretch at 10 minutes.
clock = "11:00"

[[expect]]
at = "10m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "10m"
within = "1m"
call = "say"
args = { note = "They have sat a while in one tense position. In one short, kind line, the way a friend would, suggest standing up for a short stretch. Say only 'a while', never a number; name no condition or illness, and never mention a camera." }

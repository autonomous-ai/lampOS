# 11:00, both checks bad and region none (bad by the RULA risk alone, no region high)
# to 10 minutes: V1's empty or mixed row, a word to stand up for a short stretch at 30 s.
clock = "11:00"

[[expect]]
at = "30s"
within = "30s"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "30s"
within = "30s"
call = "say"
args = { note = "They have sat a while in one tense position. In one short, kind line, the way a friend would, suggest standing up for a short stretch. Say only 'a while', never a number; name no condition or illness, and never mention a camera." }

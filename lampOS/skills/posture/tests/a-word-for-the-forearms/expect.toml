# 11:00, sat 20 minutes, lamp-seen's bad_share 0.7 and region lower_arm from its third
# sample: the window full at 10 minutes, a word for the lower arm (the forearms) then, once.
clock = "11:00"

[[expect]]
at = "10m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "10m"
within = "1m"
call = "say"
args = { note = "They have sat a while with their forearms at an awkward angle. In one short, kind line, the way a friend would, suggest adjusting the keyboard so the elbows rest comfortably. Say only 'a while', never a number; name no condition or illness, and never mention a camera." }

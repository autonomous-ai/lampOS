# 11:00, both checks bad from 9m30, a conversation from 9 to 12 minutes: held while
# they talk, said at 12 and a half once the voice has rested 5 s and the lamp been quiet 10 s.
clock = "11:00"

[[expect]]
at = "750s"
within = "30s"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "750s"
within = "30s"
call = "say"
args = { note = "Their head has been bent down for a while, as when looking down at a phone or the desk. In one short, kind line, the way a friend would, say that's hard on the neck, and suggest lifting what they're looking at up toward eye level, or lifting the head. Say only 'a while', never a number; name no condition or illness, and never mention a camera." }

# Morning agenda: once a morning, with its owner settled at the desk, the
# lamp reads them today's Google Calendar: how many events, then each time
# and title. V1's Morning Routine Store skill, ported as a read of a linked
# service (Fourteen's marks on the Queue, #5385, 6 Nov 13:30, item A2): V1's
# asked for it by voice; V2 says it once on its own, which a tool needs no
# function for. Written to lamp-skills' schema (docs/skills.md, "The schema,
# as lamp-skills reads it"); the read and its gate are docs/services.md's
# "A made skill's read" (`LAMP_SKILL_READS`, on in the product).
needs = ["eyes", "voice"]
# Its owner puts it on from the Skills Store and takes it off; not in the
# product's install (`install::NOT_PRODUCT_SKILLS`).
kind = "installable"
version = "1.0.0"
# One morning read; the read itself runs at most once a local day too.
most_a_day = 1

# What it may read and use, and nothing more: the faces, the voice's state,
# and one read of the owner's linked Google Calendar, said as exact text.
# No light, no body, no look.
[permissions]
speak = true
topics = ["humans/faces/tracked", "voice/state"]
services = { google_calendar = "read" }

# Someone settled at the desk in the morning: two minutes, so a glance in
# while passing doesn't start it.
[trigger]
topic = "humans/faces/tracked"
present = true
near = 0.14               # at the desk, not across the room (Stretch break's line)
for = "2m"
gap = "2m"                # looking away or leaning out of view does not end it
rearm = "leaves"
wait = "30m"              # a talk under way: once it ends, while they stay
during = { from = "07:00", to = "11:00" }

[[while]]                 # the lamp itself has not spoken for 30 s: not on top of its own hello
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "30s"

[[while]]                 # never in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"

[ask]
policy = "nudge"

# The read's own gate holds it until the owner is alone in view and nobody
# has spoken for a minute, for up to an hour, then lets the day go.
[[do]]
read = { service = "google_calendar", what = "events", day = "today" }

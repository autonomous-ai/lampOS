# 11:00, alone but for minutes 100 to 110, when a second face is in view: due at 105, and
# asked then, with them there (the owner, 27 Nov: "drop all the other in view, no need").
clock = "11:00"

[[expect]]
at = "105m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "105m"
within = "1m"
call = "say"
args = { note = "They have been at the desk through most of lunchtime. Ask them once, warmly and in a few words, the way a friend would, whether they've had lunch yet. One open question: suggest no food, no menu and no place, and say nothing about health." }

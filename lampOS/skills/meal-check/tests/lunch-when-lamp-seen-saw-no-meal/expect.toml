# As lunch-after-most-of-lunchtime, with lamp-seen's humans/doing every 30 s
# (#6543) and no eating seen: ate_s_ago is the sitting's length, so the
# question comes at 12:45 as on the clock alone.
clock = "11:00"

[[expect]]
at = "105m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "105m"
within = "1m"
call = "say"
args = { note = "They have been at the desk through most of lunchtime. Ask them once, warmly and in a few words, the way a friend would, whether they've had lunch yet. One open question: suggest no food, no menu and no place, and say nothing about health." }

# Meal check's line through the lamp's agent: read only with
# LAMP_CORE_VIA_AGENT=on (or naming nudges) in lamp-skills and its manage
# helper (docs/skills.md, "A core skill's line through the lamp's agent");
# off, nothing reads it. It stands in for skill.toml's grants and [[do]]
# alone: the trigger, the guards and the timing are skill.toml's own, never
# copied here. Every [[do]] but a task is skill.toml's, word for word
# (lamp-skills checks it): the say is the fallback, said at once when the
# agent's line has not come within 10 s.
grants = []

[[do]]
on = "lunch"
task = { task = "Ask once, warmly and in a few words, the way a friend would, whether they have had lunch yet; one open question, suggest no food, no menu and no place, and nothing about health.", run = "scripts/agent.py" }

[[do]]
on = "lunch"
body = { look_at = "face" }
say = "They have been at the desk through most of lunchtime. Ask them once, warmly and in a few words, the way a friend would, whether they've had lunch yet. One open question: suggest no food, no menu and no place, and say nothing about health."

[[do]]
on = "dinner"
task = { task = "Ask once, warmly and in a few words, the way a friend would, whether they have had dinner yet; one open question, suggest no food, no menu and no place, and nothing about health.", run = "scripts/agent.py" }

[[do]]
on = "dinner"
body = { look_at = "face" }
say = "They have been at the desk through most of dinnertime. Ask them once, warmly and in a few words, the way a friend would, whether they've had dinner yet. One open question: suggest no food, no menu and no place, and say nothing about health."

# Asked with no room/presence ever said (presence off): no record, and
# the model is told to say it can't tell.
[[call_tool]]
name = "who_was_here"
at = "0s"

[[expect]]
call = "say"
args = { note = "Answer from the lamp's record below whether anyone was at the lamp while they were away, in a few words: when, and about how long, as \"someone was here for a few minutes around two\". It cannot tell who: never guess who it was, and where the record says someone the lamp knows, say just that, never a name. The time going on now is theirs. If it could not see the room for a while, say so. If there is no record, say you can't tell.\n\nThe lamp has no record of who was at it: its eyes have said nothing about the room since it started (presence is off, or they could not see). Say you can't tell." }

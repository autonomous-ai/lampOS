# 20:00, 100 minutes at the desk: at 30 and 75 minutes: no hours of its own
# (the owner, 27 Nov: "user can work late").
clock = "20:00"

[[expect]]
at = "30m"
within = "1m"
call = "body.gesture"
args = { gesture = "curious" }

[[expect]]
at = "30m"
within = "1m"
call = "light"
args = { dim = 1 }

[[expect]]
at = "30m"
within = "1m"
call = "say"
args = { note = "They have looked at the screen for a long while. In one short, light line, suggest resting their eyes for a moment, perhaps looking at something far away." }

[[expect]]
at = "75m"
within = "1m"
call = "body.gesture"
args = { gesture = "curious" }

[[expect]]
at = "75m"
within = "1m"
call = "light"
args = { dim = 1 }

[[expect]]
at = "75m"
within = "1m"
call = "say"
args = { note = "They have looked at the screen for a long while. In one short, light line, suggest resting their eyes for a moment, perhaps looking at something far away." }

# 09:00, five hours at the desk, never moving, never turning to it: twice,
# at 45 and 105 minutes, then nothing until the morning ([rest]).
clock = "09:00"

[[expect]]
at = "45m"
within = "1m"
call = "body.gesture"
args = { gesture = "curious" }

[[expect]]
at = "45m"
within = "1m"
call = "light"
args = { dim = 1 }

[[expect]]
at = "105m"
within = "1m"
call = "body.gesture"
args = { gesture = "curious" }

[[expect]]
at = "105m"
within = "1m"
call = "light"
args = { dim = 1 }

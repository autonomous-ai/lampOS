# 09:00, five hours at the desk, moving now and then: at 30 minutes and each
# 45 minutes after (the owner, 27 Nov: "and is 45m cooldown"), six times,
# with no daily most.
clock = "09:00"

[[expect]]
at = "30m"
within = "1m"
call = "body.gesture"
args = { gesture = "curious" }

[[expect]]
at = "30m"
within = "1m"
call = "light"
args = { dim = 1 }

[[expect]]
at = "30m"
within = "1m"
call = "say"
args = { note = "They have looked at the screen for a long while. In one short, light line, suggest resting their eyes for a moment, perhaps looking at something far away." }


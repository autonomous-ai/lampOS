# Rest your eyes's line through the lamp's agent: read only with
# LAMP_CORE_VIA_AGENT=on (or naming nudges) in lamp-skills and its manage
# helper (docs/skills.md, "A core skill's line through the lamp's agent");
# off, nothing reads it. It stands in for skill.toml's grants and [[do]]
# alone: the trigger, the guards and the timing are skill.toml's own, never
# copied here. Every [[do]] but a task is skill.toml's, word for word
# (lamp-skills checks it): the say is the fallback, said at once when the
# agent's line has not come within 10 s.
grants = []

[[do]]
task = { task = "One short, light line suggesting a rest for the eyes, perhaps looking at something far away.", run = "scripts/agent.py" }

[[do]]
body = { gesture = "curious" }      # a small tilt (3 s), as if something across the room caught its eye
light = { dim = 1 }                 # a shade softer while it tilts, then as it was
say = "{sitting} They have looked at the screen for a long while. In one short, light line, suggest resting their eyes for a moment, perhaps looking at something far away."

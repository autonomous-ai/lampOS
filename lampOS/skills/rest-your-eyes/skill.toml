# Rest your eyes: after long screen time at the desk, a small cue
# to look away for a moment (#1685, "a design, before code: habits and
# wellbeing nudges"). The lamp's eyes see faces, not screens: long screen
# time is a long sitting at the desk. Written to lamp-skills' schema
# (docs/skills.md, "The schema, as lamp-skills reads it").
needs = ["eyes", "body", "light", "voice"]
# Comes with the lamp since 25 Oct, in the product's install (docs/skills.md, "Core and
# installable skills"); it can be turned off by voice (`wellbeing_nudges`) or in the app.
kind = "core"
version = "1.0.0"
# No daily most, no hours and no budget shared with the other nudges (the
# owner, 27 Nov): a person may work late.

# What it may read and use, and nothing more: the faces, the voice's state,
# one small gesture and a shade of its light. It says one short line, worded by the voice (the owner, 25 Oct).
[permissions]
speak = true             # one short line, worded by the voice (the owner, 25 Oct: a lamp that talks to you, not only hints)
topics = ["humans/faces/tracked", "voice/state", "room/activity"]
body = true
light = true

[trigger]
topic = "humans/faces/tracked"
when = "present"          # a face there, continuously
near = 0.14               # at the desk, not across the room
for = "30m"               # the owner, 27 Nov: "rest your eyes is 30m not 45m"
gap = "2m"                # looking away or leaning out of view does not end the sitting
cooldown = "45m"          # "and is 45m cooldown": again each 45 minutes while they stay; talking when the time
                          # comes, at the first face after the talk ends

[[while]]                 # the lamp itself has not spoken for 10 s, as Posture waits (the owner, 27 Nov): not on top of its own last words
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "10s"

[[while]]                 # never in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"                # nothing heard or said for 5 s, as Welcome back waits (#1140)

[[while]]                 # not while they read or write, head down (#1678), as Stretch break:
topic = "room/activity"   # it waits for them to look up. Without the eyes' room/activity
field = "state"           # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
not_equals = "head_down"
unknown = "holds"

[[while]]                 # the sitting is the sitter's own (#1678): the eyes' sitting_s, which
topic = "room/activity"   # begins again when someone else sits down, has lasted 30 minutes
field = "sitting_s"       # too, not only a face in the chair. Without the eyes' room/activity
above = 1799           # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
unknown = "holds"

# One function for the wellbeing skills, so a session counts it once
# (#1685): it stops the one that came last, or with all, every one. Shared by
# its `group`, with no budget (the owner, 27 Nov).
[stop]
tool = "wellbeing_nudges"
group = "wellbeing"
apart = "1m"              # never within a minute of another wellbeing nudge's line (the owner, 27 Nov)
kind = "eyes"
about = "When someone asks you to stop a wellbeing nudge, the lamp's short hints after a long sitting (a slow blue glow for water, a tilt to rest the eyes, a turn to stand up, an evening droop): snooze it until tomorrow morning, turn it off until they ask again, or on again. all = true for 'the nudges' with no kind named; leave both out for 'that one', the last. Never a reminder they set ('stop reminding me to drink water'): that is cancel_reminder."
# In short, with LAMP_USE_SKILL_SUMMARY on (#6218); the same in every
# wellbeing skill, so whichever is first in folder order says it.
when = "When asked to snooze, turn off or on again the lamp's wellbeing nudges (water, eyes, stand up, a break, a meal, sit back, wind down), or told they just had a drink. Not for reminders: cancel_reminder."

[ask]
policy = "nudge"

[[do]]
body = { gesture = "curious" }      # a small tilt (3 s), as if something across the room caught its eye
light = { dim = 1 }                 # a shade softer while it tilts, then as it was
say = "{sitting} They have looked at the screen for a long while. In one short, light line, suggest resting their eyes for a moment, perhaps looking at something far away."

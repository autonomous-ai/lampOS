# The FAQ's eval set (#5790): owner-style questions, each mapped to the
# call the voice should make, `use_skill` with skill `lamp_help` and its
# choice `topic`, and the words of the right answer that section holds.
# An ask with `cannot = true` must get an honest "I can't do that yet":
# its section names none of its `never` words, and the note tells the model
# to say so when the notes don't. Held without a model by
# `crates/skills/tests/it/faq.rs` (`every_eval_question_is_answered_by_its_section`).
# An ask with `missing` names a skill the answer speaks of that is not on
# this lamp: not installed, or installed disabled, as
# `install::PRODUCT_SKILLS_OFF` leaves one (#5804's light skills). One with
# `off` names a skill a person turned off. Either way the call is told so,
# and the note tells the model to say it isn't on for this lamp.
# Whether the model calls `use_skill` for each one is a played row's
# (`calls=use_skill:1` on its `request N: tools:` journal line, not
# `calls=none`). Not a recorded case: `lamp-skills test` runs only folders.


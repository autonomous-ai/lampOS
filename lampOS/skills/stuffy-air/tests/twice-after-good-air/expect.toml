# Two spells from 10:00 with 11 minutes under 1,000 ppm between them (from
# 94.5 to 105.5 minutes), just past the skill's own `rearm` `for = "10m"`:
# each droops and dims once, and each gives the light back as its air
# clears.
clock = "10:00"

[[expect]]
at = "1890s"
within = "30s"
call = "body.gesture"
args = { gesture = "sleepy" }

[[expect]]
at = "1890s"
within = "30s"
call = "light"
args = { dim = 1, until = "ends" }

[[expect]]
at = "1890s"
within = "30s"
call = "say"
args = { note = "The air at the desk has turned stuffy. In one short line, suggest letting some fresh air in, such as opening a window or a door." }

[[expect]]
at = "5550s"
within = "30s"
call = "ends"

[[expect]]
at = "7110s"
within = "30s"
call = "body.gesture"
args = { gesture = "sleepy" }

[[expect]]
at = "7110s"
within = "30s"
call = "light"
args = { dim = 1, until = "ends" }

[[expect]]
at = "7110s"
within = "30s"
call = "say"
args = { note = "The air at the desk has turned stuffy. In one short line, suggest letting some fresh air in, such as opening a window or a door." }

[[expect]]
at = "10770s"
within = "30s"
call = "ends"

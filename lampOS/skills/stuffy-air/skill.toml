# Stuffy air (#1021; lampOS/docs/creature.md: "first its posture droops a
# little and its eye dims a shade while it lasts; it says ... only if someone
# talks to it"); since the owner's 25 Oct "talk to the user" it also says one short line with the
# droop, and what the air is when asked stays the voice's, from its air facts. Written to
# lamp-skills' schema (docs/skills.md, "The schema, as lamp-skills reads it").
needs = ["air", "body", "light", "voice"]
# Comes with the lamp and is always there (docs/skills.md, "Core and
# installable skills"): on a lamp whose sensor doesn't answer it does
# nothing.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: the air, the voice's state,
# the droop and a shade of dim. It says one short line, worded by the voice (the owner, 25 Oct).
[permissions]
speak = true             # one short line, worded by the voice (the owner, 25 Oct: a lamp that talks to you, not only hints)
topics = ["air/state", "voice/state"]
light = true
body = true

[trigger]
topic = "air/state"
field = "co2_ppm"
above = 1200              # the lamp's own line for "stuffy" (air/state's feel)
for = "10m"               # a short rise (someone breathing close to the sensor) does nothing
gap = "1m"                # one reading under the line does not end the spell
rearm = { below = 1000, for = "10m" }   # once a spell; again only after 10 minutes of good air
wait = "10m"              # talking when the ten minutes come: it droops once the talk ends, within ten minutes (#1089)

[[while]]                 # the lamp itself has not spoken for 30 s: not on top of its own last words
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "30s"

[[while]]                 # never while someone is talking to the lamp
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"                # nothing heard or said for 5 s, as Welcome back waits (#1140)

[quiet]                   # never at night, by the lamp's local time
from = "22:00"
to = "08:00"

[ask]
policy = "nudge"

[[do]]
body = { gesture = "sleepy" }          # a slow droop
light = { dim = 1, until = "ends" }    # a shade dimmer, given back when the air is under 1,200 again
say = "The air at the desk has turned stuffy. In one short line, suggest letting some fresh air in, such as opening a window or a door."

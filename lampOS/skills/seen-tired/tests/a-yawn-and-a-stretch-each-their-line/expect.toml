# 14:00, a yawn seen at 10, a stretch at 12 and a yawn at 14: the yawn line at 10 and the stretch line at 12 (each its own rest); the yawn at 14 falls within 20 minutes of the yawn line.
clock = "14:00"

[[expect]]
at = "10m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "10m"
within = "1m"
call = "say"
args = { note = "You just saw them yawn at the desk. Say one short, light line about the yawn, the way a friend would, at most twenty words; you may ask lightly if it has been a long day. Name only the yawn, never a stretch. Never say they look tired, name a feeling or diagnose; nothing about sleep, bed, health, body or looks, and never mention a camera." }

[[expect]]
at = "12m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "12m"
within = "1m"
call = "say"
args = { note = "You just saw them stretch at the desk. Say one short, light line about the stretch, the way a friend would, at most twenty words; you may ask lightly if it has been a long day. Name only the stretch, never a yawn. Never say they look tired, name a feeling or diagnose; nothing about sleep, bed, health, body or looks, and never mention a camera." }

# 14:00, a stretch seen at 10 minutes: it turns to them and says the stretch line, never a yawn.
clock = "14:00"

[[expect]]
at = "10m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "10m"
within = "1m"
call = "say"
args = { note = "You just saw them stretch at the desk. Say one short, light line about the stretch, the way a friend would, at most twenty words; you may ask lightly if it has been a long day. Name only the stretch, never a yawn. Never say they look tired, name a feeling or diagnose; nothing about sleep, bed, health, body or looks, and never mention a camera." }

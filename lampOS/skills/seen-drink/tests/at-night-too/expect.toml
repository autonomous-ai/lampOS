# 21:30, a drink seen at 5 minutes (21:35) and at 35 (22:05): a line at each (no quiet hours; its 15 minutes have passed).
clock = "21:30"

[[expect]]
at = "5m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "5m"
within = "1m"
call = "say"
args = { note = "You just saw them take a drink at the desk. Say one short, light, casual line about it, the way a friend would, at most twenty words. Not advice and no count. Say only what you saw; nothing about their health, body or looks, and never mention a camera." }

[[expect]]
at = "35m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "35m"
within = "1m"
call = "say"
args = { note = "You just saw them take a drink at the desk. Say one short, light, casual line about it, the way a friend would, at most twenty words. Not advice and no count. Say only what you saw; nothing about their health, body or looks, and never mention a camera." }

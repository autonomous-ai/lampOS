# Watches you leave (#1669 (e); the first builder's answer on #1669, 23:51:
# "look the way the person went, once and briefly, the way a pet watches you
# go"). When the person who sat at the desk stands up and leaves
# (`room/stood_up`, the sitter by place, #1811), the base turns a little
# toward the side of the picture they left by, holds about two seconds, and
# turns back. From the middle, no clear side: it does not move. No search,
# no second look. Written to lamp-skills' schema (docs/skills.md).
needs = ["eyes", "body"]
# A core skill (docs/skills.md, "Core and installable skills"), held out of
# the product's install until its lamp check (install::NOT_PRODUCT_SKILLS).
# It moves the body, so it is tried only with someone at the arm.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: the eyes' word that the sitter
# left, the voice's state, a hand on the lamp, and the body. It never
# speaks or lights.
[permissions]
topics = ["room/stood_up", "voice/state", "body/hand"]
body = true

[trigger]
topic = "room/stood_up"   # said by the eyes (LAMP_ACTIVITY=on) only for the sitter, never a passer-by
field = "sitting_s"
above = 0                 # every departure the eyes say
when = "appears"          # once a departure
cooldown = "10m"          # at most once in ten minutes

[[while]]                 # not while it speaks, listens or thinks: not while someone talks to it
topic = "voice/state"
field = "state"
equals = "resting"

[[while]]                 # no hand on the lamp
topic = "body/hand"
field = "pushed"
equals = false
unknown = "holds"         # a body that says nothing of hands still drops a move under one

[quiet]                   # not at night: the night is the lamp's sleep (Expression's 23:00 to 06:00)
from = "23:00"
to = "06:00"

# The side of the picture they left by, as the eyes said it. None, the
# middle: no step is made, and the lamp does not move.
[choice]
name = "side"
about = "The side of the camera's picture the person left by."
one_of = ["left", "right"]
field = "side"

[ask]
policy = "nudge"

# One small turn of the base, held about two seconds, then back: 60 counts,
# a quarter of the 250 Look for things turns to a place at one side
# (`toward = 0.5`: 70% of a half-picture's 727, within the gaze's reach of
# 250). Head level, no pitch. The sign is the gaze's: a face at the picture's
# left turns the base the negative way on a lamp whose `--gaze` yaw is
# positive (lamp-4ace's 727); the arm hour checks it.
[[do]]
if_choice = ["left"]
body = { move = "watch-left" }

[[do]]
if_choice = ["right"]
body = { move = "watch-right" }

# The same with LAMP_NUDGES_PRESENT=on, as in the product: at 60 and 135 minutes.
clock = "10:00"
present = true

[[expect]]
at = "60m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "60m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for a while. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health." }

[[expect]]
at = "135m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "135m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for a while. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health." }

# LAMP_NUDGES_PRESENT=on (#5207): 10:00, 130 minutes at the desk alone: at 60
# minutes it turns to them and says one line, once.
clock = "10:00"
present = true

[[expect]]
at = "60m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "60m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health." }

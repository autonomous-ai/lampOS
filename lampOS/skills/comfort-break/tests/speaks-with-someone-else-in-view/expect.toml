# 10:00, 130 minutes at the desk, a second face in view from minute 50 to 70:
# due at 60, said with them there (the owner, 27 Nov: "drop all the other in
# view, no need"; the toilet speaks with others in view: yes), once.
clock = "10:00"

[[expect]]
at = "60m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "60m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health." }

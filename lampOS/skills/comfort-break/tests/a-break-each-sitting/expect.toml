# 09:00, three sittings of 130 minutes, 5 minutes away between: at 60, 195
# and 330 minutes, once a sitting, with no daily most (the owner, 27 Nov:
# "drop all the max-per-day").
clock = "09:00"

[[expect]]
at = "60m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "60m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health." }

[[expect]]
at = "195m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "195m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health." }

[[expect]]
at = "330m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "330m"
within = "1m"

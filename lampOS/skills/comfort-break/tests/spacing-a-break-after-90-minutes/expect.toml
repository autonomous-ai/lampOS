# With LAMP_WELLBEING_SPACING=on (#5207): 10:00, 100 minutes at the desk alone
# (faces every 1.5 s from 80 minutes): at 90 minutes, not 120, it turns to them and
# says one line, once.
clock = "10:00"
switches = ["LAMP_WELLBEING_SPACING"]

[[expect]]
at = "90m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "90m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour and a half. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health." }

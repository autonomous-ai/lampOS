# 10:00, at the desk to 90 minutes (the line at 60), away 10 minutes, back at
# 100: the new sitting counts its 60 minutes afresh, so the line comes at 160,
# not at 135.
clock = "10:00"
present = true

[[expect]]
at = "60m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "60m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health." }

[[expect]]
at = "160m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "160m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health." }

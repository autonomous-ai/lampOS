# A comfort break: after a long sitting, one tactful line that it is a good
# moment for a short break. V1's bathroom-break reminder, which the owner
# asked to bring back (#3504, the lead's list, 27 Oct), shaped like the
# wellbeing nudges (#1685). It never names a bathroom, a toilet or why: its
# line says only "a short break", and it waits while anyone else is in view,
# so it is never said in front of others. Written to lamp-skills' schema
# (docs/skills.md, "The schema, as lamp-skills reads it").
needs = ["eyes", "body", "voice"]
# Core since #5207: the product installs it off (`install::PRODUCT_SKILLS_OFF`),
# and `LAMP_WELLBEING_SPACING=on` turns it on (its `[switched]` table below).
kind = "core"
version = "1.0.0"
# Twice a day at most, counted from the local midnight.
most_a_day = 2

# What it may read and use, and nothing more: the faces, the voice's state,
# the eyes' sitting, and a turn toward the face. One short line, worded by the voice.
[permissions]
speak = true
topics = ["humans/faces/tracked", "voice/state", "room/activity"]
body = true

[trigger]
topic = "humans/faces/tracked"
when = "present"          # a face there, continuously
near = 0.14               # at the desk, not across the room (Stretch break's line)
for = "120m"              # after Stand up's 100 minutes: for a sitting that went on
gap = "2m"                # looking away or leaning out of view does not end the sitting
rearm = "leaves"          # once a sitting; again only after they have left
cooldown = "120m"
wait = "30m"              # someone else in view, or a talk, when the time comes: once they go, within half an hour

[[while]]                 # nobody else in view: never said in front of others, held
topic = "humans/faces/tracked"  # until they have been gone a minute (the trigger's wait keeps it)
faces_at_most = 1
for = "1m"

[[while]]                 # the lamp itself has not spoken for 30 s: not on top of its own last words
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "30s"

[[while]]                 # never in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"                # nothing heard or said for 5 s, as Welcome back waits (#1140)

[[while]]                 # not while they read or write, head down (#1678), as Stretch break:
topic = "room/activity"   # it waits for them to look up. Without the eyes' room/activity
field = "state"           # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
not_equals = "head_down"
unknown = "holds"

[[while]]                 # the sitting is the sitter's own (#1678): the eyes' sitting_s, which
topic = "room/activity"   # begins again when someone else sits down, has lasted 120 minutes
field = "sitting_s"       # too, not only a face in the chair. Without the eyes' room/activity
above = 7199              # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
unknown = "holds"

[active]                  # in the day
from = "09:00"
to = "20:00"

[quiet]                   # never at night
from = "22:00"
to = "08:00"

# One nudge an hour between the wellbeing skills.
[budget]
group = "wellbeing"
per_hour = 1

# Two nudges nobody noticed in a row, and it rests until tomorrow morning.
[rest]
after_ignored = 2

# The wellbeing skills' one function (#1685): it stops the one that came
# last, or with all, every one. First in folder order, so its about is the one told.
[stop]
tool = "wellbeing_nudges"
about = "When someone asks you to stop a wellbeing nudge, the lamp's short hints after a long sitting (a slow blue glow for water, a tilt to rest the eyes, a turn to stand up, a word to take a short break, a mealtime question, a word to sit back, an evening droop): snooze it until tomorrow morning, turn it off until they ask again, or on again. Leave all out for the one that came last; all = true for every one of them. Never a reminder they set ('stop reminding me to drink water'): that is cancel_reminder."

[ask]
policy = "nudge"

[[do]]
body = { look_at = "face" }
say = "They have sat at the desk for about two hours. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health."

# With LAMP_WELLBEING_SPACING=on in lamp-skills (#5207): these values in place
# of the file's own. On, in the product's install too (where it comes off,
# install::PRODUCT_SKILLS_OFF, until this switch); a short break after an
# hour and a half at the desk, not two; and the wellbeing group's room for
# two nudges an hour, never two within 20 minutes. Each key here replaces
# the file's own whole (docs/skills.md, "[switched]").
[switched.LAMP_WELLBEING_SPACING]
enabled = true
budget = { group = "wellbeing", per_hour = 2, apart = "20m" }

[switched.LAMP_WELLBEING_SPACING.trigger]
topic = "humans/faces/tracked"
when = "present"
near = 0.14
for = "90m"
gap = "2m"
rearm = "leaves"
cooldown = "90m"
wait = "30m"

[[switched.LAMP_WELLBEING_SPACING.while]]
topic = "humans/faces/tracked"
faces_at_most = 1
for = "1m"

[[switched.LAMP_WELLBEING_SPACING.while]]
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "30s"

[[switched.LAMP_WELLBEING_SPACING.while]]
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"

[[switched.LAMP_WELLBEING_SPACING.while]]
topic = "room/activity"
field = "state"
not_equals = "head_down"
unknown = "holds"

[[switched.LAMP_WELLBEING_SPACING.while]]   # the sitter's own 90 minutes
topic = "room/activity"
field = "sitting_s"
above = 5399
unknown = "holds"

[[switched.LAMP_WELLBEING_SPACING.do]]
body = { look_at = "face" }
say = "They have sat at the desk for about an hour and a half. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health."

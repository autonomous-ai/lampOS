# A comfort break: after a long sitting, one tactful line that it is a good
# moment for a short break. V1's bathroom-break reminder, which the owner
# asked to bring back (#3504, the lead's list, 27 Oct), shaped like the
# wellbeing nudges (#1685). It never names a bathroom, a toilet or why: its
# line says only "a short break", so it may be said with others in view (the
# owner, 27 Nov: "drop all the other in view, no need"). Written to lamp-skills' schema
# (docs/skills.md, "The schema, as lamp-skills reads it").
needs = ["eyes", "body", "voice"]
# Comes with the lamp (#5207), in the product's install, and off there: it
# starts itself only with LAMP_NUDGES_PRESENT=on, by its `[present]` below,
# until its played check on a lamp.
kind = "core"
enabled = false
version = "1.0.0"
# No daily most, no hours and no budget shared with the other nudges (the
# owner, 27 Nov): a person may work late.

# What it may read and use, and nothing more: the faces, the voice's state,
# the eyes' sitting, and a turn toward the face. One short line, worded by the voice.
[permissions]
speak = true
topics = ["humans/faces/tracked", "voice/state", "room/activity"]
body = true

[trigger]
topic = "humans/faces/tracked"
when = "present"          # a face there, continuously
near = 0.14               # at the desk, not across the room (Stretch break's line)
for = "60m"               # the owner, 27 Nov: "toilet is 60m not 90m"
gap = "2m"                # looking away or leaning out of view does not end the sitting
rearm = "leaves"          # once a sitting; again only after they have left
cooldown = "75m"          # the owner, 27 Nov: "all 90m cooldown, set back to 75m cooldown"
wait = "30m"              # a talk when the time comes: once it ends, within half an hour

[[while]]                 # the lamp itself has not spoken for 10 s, as Posture waits (the owner, 27 Nov): not on top of its own last words
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "10s"

[[while]]                 # never in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"                # nothing heard or said for 5 s, as Welcome back waits (#1140)

[[while]]                 # not while they read or write, head down (#1678), as Stretch break:
topic = "room/activity"   # it waits for them to look up. Without the eyes' room/activity
field = "state"           # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
not_equals = "head_down"
unknown = "holds"

[[while]]                 # the sitting is the sitter's own (#1678): the eyes' sitting_s, which
topic = "room/activity"   # begins again when someone else sits down, has lasted 60 minutes
field = "sitting_s"       # too, not only a face in the chair. Without the eyes' room/activity
above = 3599              # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
unknown = "holds"

# The wellbeing skills' one function (#1685): it stops the one that came
# last, or with all, every one. First in folder order, so its about is the one told.
# Shared by its `group`, with no budget (the owner, 27 Nov).
[stop]
tool = "wellbeing_nudges"
group = "wellbeing"
kind = "break"
about = "When someone asks you to stop a wellbeing nudge, the lamp's short hints after a long sitting (a slow blue glow for water, a tilt to rest the eyes, a turn to stand up, a word for a short break, a mealtime question, a word to sit back, an evening droop): snooze it until tomorrow morning, turn it off until they ask again, or on again. all = true for 'the nudges' with no kind named; leave both out for 'that one', the last. Never a reminder they set ('stop reminding me to drink water'): that is cancel_reminder."
# In short, with LAMP_USE_SKILL_SUMMARY on (#6218); the same in every
# wellbeing skill, so whichever is first in folder order says it.
when = "When asked to snooze, turn off or on again the lamp's wellbeing nudges (water, eyes, stand up, a break, a meal, sit back, wind down), or told they just had a drink. Not for reminders: cancel_reminder."

[ask]
policy = "nudge"

[[do]]
body = { look_at = "face" }
say = "They have sat at the desk for about an hour. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health."

# With LAMP_NUDGES_PRESENT=on (#5207, off unless set), these stand in for
# the values above, each key whole: on, after 60 minutes at the desk, as above.
[present]
enabled = true

[present.trigger]
topic = "humans/faces/tracked"
when = "present"
near = 0.14
for = "60m"
gap = "2m"
rearm = "leaves"
cooldown = "75m"
wait = "30m"

[[present.while]]
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "10s"

[[present.while]]
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"

[[present.while]]
topic = "room/activity"
field = "state"
not_equals = "head_down"
unknown = "holds"

[[present.while]]         # the sitter's own sitting has lasted 60 minutes too
topic = "room/activity"
field = "sitting_s"
above = 3599
unknown = "holds"

[[present.do]]
body = { look_at = "face" }
say = "They have sat at the desk for about an hour. In one short, light line, the way a friend would, say it's a good moment for a short break. Say only a short break: name no place and no reason, and nothing about health."

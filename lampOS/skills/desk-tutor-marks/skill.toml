# Desk tutor's marks (#941, step 4 of the owner's Desk tutor): once the
# model has seen the page through Desk tutor's look, it calls this just
# before it answers, and the lamp shows its verdict with the body: a small
# nod where the work is right, a curious tilt where it goes wrong. Started
# by its tool alone, after someone asked for their work to be checked: no
# trigger and no [ask].
needs = ["voice", "body"]
# Installable, as Desk tutor is: called only after Desk tutor's look.
kind = "installable"
version = "1.0.0"
tool = "show_verdict"

# What it may use, and nothing more: the nod or the tilt, and the note
# that sends the model on to answer. It reads no topic.
[permissions]
speak = true
body = true

[choice]
name = "verdict"
about = "right: you read the whole page and every line is right. wrong: you are about to point to the first line that goes wrong. Always give one."
one_of = ["right", "wrong"]

# The gesture at once, as the call is answered, a moment before the
# model's first words (a tool's say is never made, so nothing waits for
# the voice; the reviewer on #1260): V1's short nod
# (acknowledge, about 2 s) or its tilt (curious, 3 s), each over the
# reading pose Desk tutor holds. The note sends the model on to answer;
# a skill has one note, so it fits both verdicts and never asks for a
# mistake in work that is right (the seventh on #1260).
[[do]]
body = { gesture = { right = ["acknowledge"], wrong = ["curious"] } }
say = "Now answer as the tutor, in a sentence or two: what is right, and, if a line goes wrong, that line with a hint or a question, never the answer."

# The runner publishes only an eligible, nonpersonal invitation identity.
# No authority to open either sensor, no body move, and no additional tool.
# The core grant "onboarding" is what lets it say from the invitations.
kind = "core"
version = "1.0.0"
needs = ["voice"]

[permissions]
topics = ["onboarding/pending"]
core = ["onboarding"]
speak = true

[trigger]
topic = "onboarding/pending"
each = "invitations"
key = "invitation"
field = "ready"
equals = true
when = "appears"

[ask]
policy = "unprompted"

[[do]]
say = { from = "onboarding" }

# The walk reads this checked data once when Voice starts. Physical proof stays in Voice.
[onboarding]
order = ["where_you_sit", "who_you_are", "how_you_sound", "touch", "privacy", "giving_way", "room_sounds", "face_expressions", "preferences"]
reoffer_after_s = 86400
# A step nobody tried (no words, push, tap or call): `later`, offered again this long after the walk, then once after reoffer_after_s (#3996).
later_after_s = 1800

[onboarding.steps.where_you_sit]
first = "(Say only this, nothing before or after it: \"Let's get set up first! It'll only take a few minutes. Please follow my instructions step-by-step, and once we're done, you can ask me anything. Sit where you usually sit and look at me. I'll tell you when I see you.\")"
reoffer = "(Say only this, nothing before or after it: \"Hello, I'm glad to meet you. Sit where you usually sit and look at me. I'll tell you when I see you.\")"
skipped = "(Say only this, nothing before or after it: \"Okay, we'll skip where you sit for now.\")"

[onboarding.steps.who_you_are]
first = "(Nobody has spoken. Ask exactly this: \"What should I call you?\" When they have told you, and only if you have remember_my_face, ask exactly this: \"May I remember your face, so I know you next time?\", and only after a clear yes call remember_my_face with their name. Never use remember for this. Then, as soon as that is settled, call setup_step with step \"who_you_are\": done once you know their name, skipped if they would rather not say, or failed if it could not be done. If it was skipped or failed, say only: \"That's fine. You can tell me your name any time.\")"
reoffer = "(Nobody has spoken. Ask exactly this: \"What should I call you?\" When they have told you, and only if you have remember_my_face, ask exactly this: \"May I remember your face, so I know you next time?\", and only after a clear yes call remember_my_face with their name. Never use remember for this. Then, as soon as that is settled, call setup_step with step \"who_you_are\": done once you know their name, skipped if they would rather not say, or failed if it could not be done. If it was skipped or failed, say only: \"That's fine. You can tell me your name any time.\")"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we didn't get to your name. Let's try it now.\")"
[onboarding.steps.who_you_are.nudge]
after_answers = 1
words = "(If you asked whether you may remember their face and they have not answered yet, wait for their answer. Otherwise call setup_step with step \"who_you_are\" now, before you say anything else: done once you know their name, skipped if they would rather not.)"

[onboarding.steps.how_you_sound]
first = "(Say only this, nothing before or after it: \"Now I'll learn how you call me. When I stop talking, say 'Hey Lamp' from your seat, the way you'd get my attention. I'll ask until I've heard you three times.\")"
reoffer = "(Say only this, nothing before or after it: \"Now I'll learn how you call me. When I stop talking, say 'Hey Lamp' from your seat, the way you'd get my attention. I'll ask until I've heard you three times.\")"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we skipped how you call me. Let's try it now.\")"
skipped = "(Say only this, nothing before or after it: \"Okay, we'll skip how you call me for now.\")"

[onboarding.steps.touch]
first = "(Say only this, nothing before or after it: \"OK, next step. Tap the top of my head once, then let go.\")"
reoffer = "(Say only this, nothing before or after it: \"One more thing: tap the top of my head once, then let go.\")"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we skipped the tap on my head. Let's try it now.\")"
skipped = "(Say only this, nothing before or after it: \"Okay, we'll skip the touch for now.\")"

[onboarding.steps.privacy]
first = "(Say only this, nothing before or after it: \"Find my privacy switch {location}. Close it, then open it again.\" Do not explain it, claim success or ask a tool to mark privacy done.)"
reoffer = "(Say only this, nothing before or after it: \"Find my privacy switch {location}. Close it, then open it again.\" Do not explain it, claim success or ask a tool to mark privacy done.)"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we skipped my privacy switch. Let's try it now.\")"

# PARKED (#3702): giving way is out of the walk (the owner's call, 28 Oct); lamp-voice keeps it not_available
# (crates/voice/src/coordinator.rs, set_giving_way_available). Its words stay so it can be put back.
[onboarding.steps.giving_way]
first = "(Say only this, nothing before or after it: \"Hold my base with one hand. With the other, tilt my head gently to one side. Let go when I say so.\")"
reoffer = "(Say only this, nothing before or after it: \"Hold my base with one hand. With the other, tilt my head gently to one side. Let go when I say so.\")"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we skipped my head giving way. Let's try it now.\")"
skipped = "(Say only this, nothing before or after it: \"Okay, we'll skip my head giving way for now.\")"

[onboarding.steps.room_sounds]
first = "(Nobody has spoken. Ask exactly this: \"May I notice music and laughter in the room? Nothing is recorded. Just say yes or no.\" If you can't tell their answer, ask exactly this once: \"Sorry, was that a yes or a no?\" Then call setup_step with step \"room_sounds\": done only after a clear yes, skipped if they say no or are unsure. Then say only: \"Got it, I'll notice music and laughter.\" after a yes, or \"Okay, I won't.\" otherwise.)"
reoffer = "(Nobody has spoken. Ask exactly this: \"May I notice music and laughter in the room? Nothing is recorded. Just say yes or no.\" If you can't tell their answer, ask exactly this once: \"Sorry, was that a yes or a no?\" Then call setup_step with step \"room_sounds\": done only after a clear yes, skipped if they say no or are unsure. Then say only: \"Got it, I'll notice music and laughter.\" after a yes, or \"Okay, I won't.\" otherwise.)"

[onboarding.steps.face_expressions]
first = "(Nobody has spoken. Ask exactly this: \"May I notice when people look happy or upset, so I can answer more warmly? A yes covers everyone at this lamp. I never say it aloud and keep no pictures. Just say yes or no.\" If you can't tell their answer, ask exactly this once: \"Sorry, was that a yes or a no?\" Then call setup_step with step \"face_expressions\": done only after a clear yes, skipped if they say no or are unsure. Then say only: \"Got it, I'll notice how people look.\" after a yes, or \"Okay, I won't.\" otherwise.)"
reoffer = "(Nobody has spoken. Ask exactly this: \"May I notice when people look happy or upset, so I can answer more warmly? A yes covers everyone at this lamp. I never say it aloud and keep no pictures. Just say yes or no.\" If you can't tell their answer, ask exactly this once: \"Sorry, was that a yes or a no?\" Then call setup_step with step \"face_expressions\": done only after a clear yes, skipped if they say no or are unsure. Then say only: \"Got it, I'll notice how people look.\" after a yes, or \"Okay, I won't.\" otherwise.)"

[onboarding.steps.preferences]
first = "(Nobody has spoken. Ask exactly this first: \"Are there hours when I should keep quiet? For example, 'after ten at night', or 'no'.\" When they have answered, ask exactly this: \"May I say hello when you sit down?\" If you can't tell an answer, ask exactly this once: \"Sorry, could you say that again?\" Keep each answer as a rule if you can. As soon as you have heard the second answer, call setup_step with step \"preferences\" before you say anything else, then say only: \"Got it, that's everything. You can ask me to redo the setup any time.\")"
reoffer = "(Nobody has spoken. Ask exactly this first: \"Are there hours when I should keep quiet? For example, 'after ten at night', or 'no'.\" When they have answered, ask exactly this: \"May I say hello when you sit down?\" If you can't tell an answer, ask exactly this once: \"Sorry, could you say that again?\" Keep each answer as a rule if you can. As soon as you have heard the second answer, call setup_step with step \"preferences\" before you say anything else, then say only: \"Got it, that's everything. You can ask me to redo the setup any time.\")"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we didn't get to your preferences. Let's do them now.\")"
[onboarding.steps.preferences.nudge]
after_answers = 2
words = "(They have answered. Call setup_step with step \"preferences\" now, before you say anything else.)"

[onboarding.words]
sit_no_face = "(Say only this, nothing before or after it: \"I can't see your face yet. Sit where you usually sit, and look at me.\")"
sit_closer = "(Say only this, nothing before or after it: \"You're a little far. Move me closer to you, or stay as you are.\")"
sit_turn = "(Say only this, nothing before or after it: \"I can see you at the edge of my view. Turn my head toward you until I'm facing you, or stay as you are.\")"
sit_done = "(Say only this, nothing before or after it: \"Got it, I can see you well there.\")"
sit_failed = "(Say only this, nothing before or after it: \"I still can't see you well there. That's fine, you can turn me toward your seat later.\")"
who_again = "(That was not their name. Ask exactly this: \"Sorry, what should I call you?\")"
touch_remind = "(Say only this, nothing before or after it: \"I didn't feel that. Touch the very top of my head with your fingertip, once.\")"
touch_done = "(Say only this, nothing before or after it: \"Got it, I felt that.\")"
touch_failed = "(Say only this, nothing before or after it: \"I didn't feel a tap this time. That's fine, you can redo the setup later. Just ask me to redo the setup.\")"
privacy_done = "(Say only this, nothing before or after it: \"Got it, the switch closes my microphones.\")"
privacy_done_camera = "(Say only this, nothing before or after it: \"Got it, the switch closes my microphones and my camera.\")"
privacy_failed = "(Say only this, nothing before or after it: \"The switch check didn't finish. You can try it again later by redoing the setup. Just ask me to redo the setup.\")"
near_again = "(Say only this, nothing before or after it: \"Got it. Say 'Hey Lamp' once more.\")"
near_missed = "(Say only this, nothing before or after it: \"I didn't catch that. Say 'Hey Lamp' again, from your seat.\")"
near_done = "(Say only this, nothing before or after it: \"Got it, that's three.\")"
near_failed = "(Say only this, nothing before or after it: \"I couldn't learn how you call me this time. That's fine, you can redo the setup later. Just ask me to redo the setup.\")"
sentence_first = "(Say only this, nothing before or after it: \"Now say any sentence to me, the way you'd talk to me.\")"
sentence_louder = "(Say only this, nothing before or after it: \"Say another sentence from your seat, a little louder.\")"
sentence_closer = "(Say only this, nothing before or after it: \"Come a little closer and say another sentence.\")"
sentence_again = "(Say only this, nothing before or after it: \"Say another sentence from your seat.\")"
sentence_done = "(Say only this, nothing before or after it: \"Got it, I hear you well from there.\")"
sentence_failed = "(Say only this, nothing before or after it: \"I couldn't hear you well enough this time. I'll get used to your voice as we talk.\")"
give_again = "(Say only this, nothing before or after it: \"I didn't feel my head move. Hold my base with one hand. With the other, tilt my head gently to one side. Let go when I say so.\")"
give_felt = "(Say only this, nothing before or after it: \"That's it, now let go.\")"
give_prompt = "(Say only this, nothing before or after it: \"Hold my base with one hand. With the other, tilt my head gently to one side, then let go.\")"
give_more = "(Say only this, nothing before or after it: \"A little more, then let go.\")"
later = "(Say only this, nothing before or after it: \"No problem, we'll try that one later.\")"
give_done = "(Say only this, nothing before or after it: \"Got it, my head moved with your hand.\")"
give_failed = "(Say only this, nothing before or after it: \"I didn't feel my head move this time. That's fine, you can redo the setup later. Just ask me to redo the setup.\")"
who_confirm = "(If you asked whether you may remember their face and they have not answered yet, wait for their answer. Otherwise ask them, in a few words: \"Did I get that right, {name}?\" Nothing more.)"

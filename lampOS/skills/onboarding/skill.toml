# The runner publishes only an eligible, nonpersonal invitation identity.
# No authority to open either sensor, no body move, and no additional tool.
# The core grant "onboarding" is what lets it say from the invitations.
kind = "core"
version = "1.0.0"
needs = ["voice"]

[permissions]
topics = ["onboarding/pending"]
core = ["onboarding"]
speak = true

[trigger]
topic = "onboarding/pending"
each = "invitations"
key = "invitation"
field = "ready"
equals = true
when = "appears"

[ask]
policy = "unprompted"

[[do]]
say = { from = "onboarding" }

# The walk reads this checked data once when Voice starts. Physical proof stays in Voice.
[onboarding]
order = ["where_you_sit", "who_you_are", "touch", "how_you_sound"]
reoffer_after_s = 86400
# A step nobody tried (no words, push, tap or call): `later`, offered again this long after the walk, then once after reoffer_after_s (#3996).
later_after_s = 1800

[onboarding.steps.where_you_sit]
first = "(Say only this, nothing before or after it: \"Sit where you usually sit, and look at me.\")"
reoffer = "(Say only this, nothing before or after it: \"Sit where you usually sit, and look at me.\")"
skipped = "(Say only this, nothing before or after it: \"Okay, we'll skip where you sit for now.\")"
# Where you sit is never `later`, and its `reoffer` is its short line within a walk, so its `later_reoffer` is said in its place when it is offered again on a later visit.
later_reoffer = "(Say only this, nothing before or after it: \"One more thing: sit where you usually sit, and look at me.\")"

[onboarding.steps.who_you_are]
first = "(Nobody has spoken. Ask exactly this: \"What should I call you?\" When they have told you, say their name back as one clear yes-or-no question on its own, their name and then did I get that right, never their name alone, with nothing else in that line, and wait for their answer. Ask to spell it only if it's wrong or missed, once; then say the name it spells, as a word. Only after a clear yes to their name, and only if you have remember_my_face, ask exactly this: \"May I remember your face, so I know you next time?\", and only after a clear yes call remember_my_face with their name. Never use remember for this. Then, as soon as that is settled, call setup_step with step \"who_you_are\": done once you know their name, skipped if they would rather not say, or failed if it could not be done. If it was skipped or failed, say only: \"That's fine. You can tell me your name any time.\")"
reoffer = "(Nobody has spoken. Ask exactly this: \"What should I call you?\" When they have told you, say their name back as one clear yes-or-no question on its own, their name and then did I get that right, never their name alone, with nothing else in that line, and wait for their answer. Ask to spell it only if it's wrong or missed, once; then say the name it spells, as a word. Only after a clear yes to their name, and only if you have remember_my_face, ask exactly this: \"May I remember your face, so I know you next time?\", and only after a clear yes call remember_my_face with their name. Never use remember for this. Then, as soon as that is settled, call setup_step with step \"who_you_are\": done once you know their name, skipped if they would rather not say, or failed if it could not be done. If it was skipped or failed, say only: \"That's fine. You can tell me your name any time.\")"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we didn't get to your name. Let's try it now.\")"
[onboarding.steps.who_you_are.nudge]
after_answers = 1
words = "(If you said their name back or asked whether you may remember their face and they have not answered yet, wait for their answer. Otherwise call setup_step with step \"who_you_are\" now, before you say anything else: done once you know their name, skipped if they would rather not.)"

[onboarding.steps.how_you_sound]
first = "(Say only this, nothing before or after it: \"When you want me, start with 'Hey Lamp'. When I stop talking, give it a try.\")"
reoffer = "(Say only this, nothing before or after it: \"When you want me, start with 'Hey Lamp'. When I stop talking, give it a try.\")"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we skipped saying 'Hey Lamp'. Let's try it now.\")"
skipped = "(Say only this, nothing before or after it: \"Okay, we'll skip how you call me for now.\")"

[onboarding.steps.touch]
first = "(Say only this, nothing before or after it: \"Pet the top of my head.\")"
reoffer = "(Say only this, nothing before or after it: \"Pet the top of my head.\")"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we skipped petting my head. Let's try it now.\")"
skipped = "(Say only this, nothing before or after it: \"Okay, we'll skip the touch for now.\")"

[onboarding.steps.privacy]
first = "(Say only this, nothing before or after it: \"Find my privacy switch {location}. Close it, then open it again.\" Do not explain it, claim success or ask a tool to mark privacy done.)"
reoffer = "(Say only this, nothing before or after it: \"Find my privacy switch {location}. Close it, then open it again.\" Do not explain it, claim success or ask a tool to mark privacy done.)"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we skipped my privacy switch. Let's try it now.\")"

# PARKED (#3702): giving way is out of the walk (the owner's call, 28 Oct); lamp-voice keeps it not_available
# (crates/voice/src/coordinator.rs, set_giving_way_available). Its words stay so it can be put back.
[onboarding.steps.giving_way]
first = "(Say only this, nothing before or after it: \"Hold my base with one hand. With the other, tilt my head gently to one side. Let go when I say so.\")"
reoffer = "(Say only this, nothing before or after it: \"Hold my base with one hand. With the other, tilt my head gently to one side. Let go when I say so.\")"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we skipped my head giving way. Let's try it now.\")"
skipped = "(Say only this, nothing before or after it: \"Okay, we'll skip my head giving way for now.\")"

[onboarding.steps.room_sounds]
first = "(Nobody has spoken. Ask exactly this: \"May I notice music and laughter in the room? Nothing is recorded. Just say yes or no.\" If you can't tell their answer, ask exactly this once: \"Sorry, was that a yes or a no?\" Then call setup_step with step \"room_sounds\": done only after a clear yes, skipped if they say no or are unsure. Then say only: \"Got it, I'll notice music and laughter.\" after a yes, or \"Okay, I won't.\" otherwise.)"
reoffer = "(Nobody has spoken. Ask exactly this: \"May I notice music and laughter in the room? Nothing is recorded. Just say yes or no.\" If you can't tell their answer, ask exactly this once: \"Sorry, was that a yes or a no?\" Then call setup_step with step \"room_sounds\": done only after a clear yes, skipped if they say no or are unsure. Then say only: \"Got it, I'll notice music and laughter.\" after a yes, or \"Okay, I won't.\" otherwise.)"

[onboarding.steps.face_expressions]
first = "(Nobody has spoken. Ask exactly this: \"May I notice when people look happy or upset, so I can answer more warmly? A yes covers everyone at this lamp. I never say it aloud and keep no pictures. Just say yes or no.\" If they answer with a plain yes or no, say nothing and call nothing: the lamp answers it itself. If you can't tell their answer, ask exactly this once: \"Sorry, was that a yes or a no?\" For any other answer, call setup_step with step \"face_expressions\": done only after a clear yes, skipped if they say no or are unsure. Then say only: \"Got it, I'll notice how people look.\" after a yes, or \"Okay, I won't.\" otherwise.)"
reoffer = "(Nobody has spoken. Ask exactly this: \"May I notice when people look happy or upset, so I can answer more warmly? A yes covers everyone at this lamp. I never say it aloud and keep no pictures. Just say yes or no.\" If they answer with a plain yes or no, say nothing and call nothing: the lamp answers it itself. If you can't tell their answer, ask exactly this once: \"Sorry, was that a yes or a no?\" For any other answer, call setup_step with step \"face_expressions\": done only after a clear yes, skipped if they say no or are unsure. Then say only: \"Got it, I'll notice how people look.\" after a yes, or \"Okay, I won't.\" otherwise.)"

[onboarding.steps.preferences]
first = "(Nobody has spoken. Ask exactly this: \"Are there hours when I should keep quiet? For example, 'after ten at night', or 'no'.\" Keep each answer as a rule if you can, and answer each in at most five words, never with a question, even when a rule can't be kept. Never ask whether you may say hello and never close the setup yourself: that question and the last line come on their own. As soon as you have heard their answer about saying hello, call setup_step with step \"preferences\" before you say anything else.)"
reoffer = "(Nobody has spoken. Ask exactly this: \"Are there hours when I should keep quiet? For example, 'after ten at night', or 'no'.\" Keep each answer as a rule if you can, and answer each in at most five words, never with a question, even when a rule can't be kept. Never ask whether you may say hello and never close the setup yourself: that question and the last line come on their own. As soon as you have heard their answer about saying hello, call setup_step with step \"preferences\" before you say anything else.)"
later_reoffer = "(Say only this, nothing before or after it: \"Earlier we didn't get to your preferences. Let's do them now.\")"
[onboarding.steps.preferences.nudge]
after_answers = 2
words = "(They have answered. Call setup_step with step \"preferences\" now, before you say anything else.)"

[onboarding.words]

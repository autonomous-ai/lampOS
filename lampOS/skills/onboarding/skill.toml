sit_closer = "(Say only this, nothing before or after it: \"You're a little far. Move me closer to you, or stay as you are.\")"
sit_turn = "(Say only this, nothing before or after it: \"I can see you at the edge of my view. Turn my head toward you until I'm facing you, or stay as you are.\")"
sit_done = "(Say only this, nothing before or after it: \"There you are. I can see you.\")"
sit_failed = "(Say only this, nothing before or after it: \"No problem. You can turn me toward you any time.\")"
who_again = "(That was not their name. Ask exactly this: \"Sorry, what should I call you?\")"
touch_remind = "(Say only this, nothing before or after it: \"Gently, on top of my head.\")"
touch_done = "(Say only this, nothing before or after it: \"Mmm, that feels nice.\")"
touch_failed = "(Say only this, nothing before or after it: \"That's okay. You can pet my head any time.\")"
privacy_done = "(Say only this, nothing before or after it: \"Got it, the switch closes my microphones.\")"
privacy_done_camera = "(Say only this, nothing before or after it: \"Got it, the switch closes my microphones and my camera.\")"
privacy_failed = "(Say only this, nothing before or after it: \"The switch check didn't finish. You can try it again later by redoing the setup. Just ask me to redo the setup.\")"
near_again = "(Say only this, nothing before or after it: \"Got it. Say 'Hey Lamp' once more.\")"
near_missed = "(Say only this, nothing before or after it: \"I didn't catch that. Try once more when I stop talking.\")"
near_done = "(Say only this, nothing before or after it: \"That's me! Say 'Hey Lamp' whenever you need me.\")"
near_failed = "(Say only this, nothing before or after it: \"No worries. Just say 'Hey Lamp' whenever you need me.\")"
sentence_first = "(Say only this, nothing before or after it: \"Now say any sentence to me, the way you'd talk to me.\")"
sentence_louder = "(Say only this, nothing before or after it: \"Say another sentence from your seat, a little louder.\")"
sentence_closer = "(Say only this, nothing before or after it: \"Come a little closer and say another sentence.\")"
sentence_again = "(Say only this, nothing before or after it: \"Say another sentence from your seat.\")"
sentence_done = "(Say only this, nothing before or after it: \"Got it, I hear you well from there.\")"
sentence_failed = "(Say only this, nothing before or after it: \"I couldn't hear you well enough this time. I'll get used to your voice as we talk.\")"

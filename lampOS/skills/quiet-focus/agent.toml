# Quiet focus's line through the lamp's agent: read only with
# LAMP_CORE_VIA_AGENT=on (or naming nudges) in lamp-skills and its manage
# helper (docs/skills.md, "A core skill's line through the lamp's agent");
# off, nothing reads it. It stands in for skill.toml's grants and [[do]]
# alone: the trigger, the guards and the timing are skill.toml's own, never
# copied here. Every [[do]] but a task is skill.toml's, word for word
# (lamp-skills checks it): the say is the fallback, said at once when the
# agent's line has not come within 10 s.
grants = []

[[do]]
on = "looked_up"
task = { task = "One short, warm line of a few words, the way a friend would, that you noticed their focus and it is nicely done; ask nothing, suggest nothing, and nothing about their body or looks, the time, or health.", run = "scripts/agent.py" }

[[do]]
on = "looked_up"
body = { look_at = "face" }
say = "They have just looked up after being quietly focused on their work for a good while. In one short, warm line of a few words, the way a friend would, say you noticed and it's nicely done. Only that: ask nothing of them and suggest nothing to do, and say nothing about their body or looks, the time, or health."

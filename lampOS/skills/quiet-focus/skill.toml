# Quiet focus: someone who has worked head down at the desk for about 45
# minutes in one sitting is given one small, warm word when they first look
# up, the way a friend at the next desk would notice: they've been focused a
# while, nicely done. Never while they are still head down (a word into
# someone's focus would break it), never a lecture and never a break
# (Stretch break, Stand up and A comfort break do that). It reads only what
# the eyes already say of the person at the desk (`room/activity`, against
# this sitting's own baseline, never a picture), and it never speaks of a
# body or looks. Written to lamp-skills' schema (docs/skills.md, "The
# schema, as lamp-skills reads it").
needs = ["eyes", "body", "voice"]
# Installable: its owner chooses it (`lamp-skills install`), and it is not in
# the product's install (`install::NOT_PRODUCT_SKILLS`) until tried on a lamp.
# It has no `tool` and no `[stop]`, so it adds no function to a session: a
# `[stop]` is shared only by the skills of one `[budget]` group, and this one
# keeps out of the wellbeing group (below). It is turned off where it was
# installed.
kind = "installable"
version = "1.0.0"
# Twice a day at most, counted from the local midnight: the focus that
# came due counts, said or not; the word after it is that focus's (`follows`).
most_a_day = 2

# What it may read and use, and nothing more: the eyes' reading of the person
# at the desk, the faces, the voice's state, and a turn toward the face. One
# short line, worded by the voice. Nothing heard is read.
[permissions]
speak = true
topics = ["room/activity", "humans/faces/tracked", "voice/state"]
body = true

# Head down for 45 minutes: the eyes say `head_down` once it has held 20 s
# (eyes/src/activity.rs, the nose lower than it sat). A look up shorter than
# 2 minutes (a glance, a sip, a thought) does not end the focus, as a sitting
# forgives (`RoomActivity::SITTING_GAP_S`); one longer does. It does nothing
# itself: it only opens the moment for the word below.
[[trigger]]
name = "focused"
topic = "room/activity"
field = "state"
equals = "head_down"
for = "45m"
gap = "2m"
rearm = "leaves"          # once each time they settle in
cooldown = "180m"         # with the sitting's 3 hours below: once a sitting, never twice
wait = "15m"              # someone else in view, or a talk: once they go, while still focused

# They look up within 10 minutes of it: sat as they sat, 10 s (the eyes say
# `at_desk` once it has held 5 s). The one word, then. Still head down 10
# minutes on, or up and gone, and nothing is said.
[[trigger]]
name = "looked_up"
topic = "room/activity"
field = "state"
equals = "at_desk"
for = "10s"
gap = "30s"               # a moment back over the page (head_down is said after 20 s) does not end it
rearm = "leaves"
wait = "5m"              # someone else in view, or a talk: once they go, while still looking up
follows = { trigger = "focused", within = "10m" }

[[while]]                 # once a sitting: inside its first 3 hours, so a second focus in the
topic = "room/activity"   # same sitting always falls in the cooldown of the first. A gap over
field = "sitting_s"       # 2 minutes is a new sitting (sitting_s from 0).
below = 10800

[[while]]                 # nobody else in view: never said in front of others
topic = "humans/faces/tracked"
faces_at_most = 1
for = "1m"

[[while]]                 # the lamp itself has not spoken for 30 s: not on top of its own last words
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "30s"

[[while]]                 # never while they talk, or in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"                # nothing heard or said for 5 s, as Welcome back waits (#1140)

[active]                  # in the day
from = "09:00"
to = "20:00"

[quiet]                   # never at night
from = "22:00"
to = "08:00"

# Its own group, not the wellbeing nudges': it never takes one of their
# turns in the hour (A sip of water and Rest your eyes already wait behind
# Stretch break and A comfort break). A group's `gap` keeps apart only its own
# members, so nothing keeps it 30 minutes from a wellbeing nudge.
[budget]
group = "focus"
per_hour = 1

# Two focuses in a row with no look up, move or word within 5 minutes of
# each: it rests until the next morning, as the wellbeing nudges do. The word
# after a focus is not counted (`follows`).
[rest]
after_ignored = 2
within = "5m"

[ask]
policy = "nudge"

[[do]]
on = "looked_up"
body = { look_at = "face" }
say = "They have just looked up after being quietly focused on their work for a good while. In one short, warm line of a few words, the way a friend would, say you noticed and it's nicely done. Only that: ask nothing of them and suggest nothing to do, and say nothing about their body or looks, the time, or health."

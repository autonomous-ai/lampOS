# Quiet focus: someone who has worked head down at the desk for about 45
# minutes in one sitting is given one small, warm word when they first look
# up, the way a friend at the next desk would notice: they've been focused a
# while, nicely done. Never while they are still head down (a word into
# someone's focus would break it), never a lecture and never a break
# (Stretch break, Stand up and A comfort break do that). It reads only what
# the eyes already say of the person at the desk (`room/activity`, against
# this sitting's own baseline, never a picture), and it never speaks of a
# body or looks. Written to lamp-skills' schema (docs/skills.md, "The
# schema, as lamp-skills reads it").
needs = ["eyes", "body", "voice"]
# Installable: its owner chooses it (`lamp-skills install`), and it is not in
# the product's install (`install::NOT_PRODUCT_SKILLS`) until tried on a lamp.
# It has no `tool`, only the wellbeing group's shared `[stop]`, so it adds no
# function to a session.
kind = "installable"
version = "1.0.0"
# Twice a day at most, counted from the local midnight: only the word when
# they look up counts. The silent focus (no step names it) is no nudge.
most_a_day = 2

# What it may read and use, and nothing more: the eyes' reading of the person
# at the desk, the faces, the voice's state, and a turn toward the face. One
# short line, worded by the voice. Nothing heard is read.
[permissions]
speak = true
topics = ["room/activity", "humans/faces/tracked", "voice/state"]
body = true

# Head down for 45 minutes: the eyes say `head_down` once it has held 20 s
# (eyes/src/activity.rs, the nose lower than it sat). A look up shorter than
# 2 minutes (a glance, a sip, a thought) does not end the focus, as a sitting
# forgives (`RoomActivity::SITTING_GAP_S`); one longer does. It does nothing
# itself, and no step names it, so it is no nudge (no day's count, no
# group's hour, no rest): it only opens the moment for the word below.
[[trigger]]
name = "focused"
topic = "room/activity"
field = "state"
equals = "head_down"
for = "45m"
gap = "2m"
rearm = "leaves"          # once each time they settle in
cooldown = "180m"         # 3 hours from each focus come due, word or not, across sittings too; with the sitting's 3 hours below, never twice a sitting
wait = "15m"              # someone else in view, or a talk: once they go, while still focused

# They look up within 10 minutes of it: sat as they sat, 10 s (the eyes say
# `at_desk` once it has held 5 s). The one word, then. Still head down 10
# minutes on, or up and gone, and nothing is said.
[[trigger]]
name = "looked_up"
topic = "room/activity"
field = "state"
equals = "at_desk"
for = "10s"
gap = "30s"               # a moment back over the page (head_down is said after 20 s) does not end it
rearm = "leaves"
wait = "5m"              # someone else in view, or a talk: once they go, while still looking up
follows = { trigger = "focused", within = "10m" }
# Its word stands in for the wellbeing group's nudges (#5620, the PM's call
# (a)): Rest your eyes, and in the product Sip of water too, are due in any
# sitting this long and would speak the moment they look up, taking the
# group's turn. While the word is still to come each waits, and its cooldown
# begins with the word; a warning never waits. A window that closes without
# the word (still head down, gone, or held past its `wait`) holds nothing
# again until the word has been said. A lamp without this skill is as before.
stands_in_for_group = true

[[while]]                 # once a sitting: inside its first 3 hours, so a second focus in the
topic = "room/activity"   # same sitting always falls in the cooldown of the first. A gap over
field = "sitting_s"       # 2 minutes is a new sitting (sitting_s from 0).
below = 10800

[[while]]                 # nobody else in view: never said in front of others
topic = "humans/faces/tracked"
faces_at_most = 1
for = "1m"

[[while]]                 # the lamp itself has not spoken for 30 s: not on top of its own last words
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "30s"

[[while]]                 # never while they talk, or in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"                # nothing heard or said for 5 s, as Welcome back waits (#1140)

[active]                  # in the day
from = "09:00"
to = "20:00"

[quiet]                   # never at night
from = "22:00"
to = "08:00"

# One nudge an hour between the wellbeing skills, so the wellbeing nudges'
# shared `[stop]` (below) stops it too. Only the word takes the group's
# hour, and waits for it; the silent focus takes none, so it never eats a
# sip of water's or a rest for the eyes' turn.
[budget]
group = "wellbeing"
per_hour = 1

# Two words in a row nobody noticed (no look back down, move or word within
# 5 minutes): it rests until the next morning, as the wellbeing nudges do.
[rest]
after_ignored = 2
within = "5m"

# The wellbeing skills' one function (#1685): it stops the one that came
# last, or with all, every one, so "stop the nudges" stops this too. The
# model is told the `about` of the first wellbeing skill in folder order (A
# comfort break's on a product lamp); this one says the same as A meal
# check's and Sit back's (512 bytes at most, so it names no word of its own).
[stop]
tool = "wellbeing_nudges"
about = "When someone asks you to stop a wellbeing nudge, the lamp's short hints after a long sitting (a slow blue glow for water, a tilt to rest the eyes, a turn to stand up, a word to take a short break, a mealtime question, a word to sit back, an evening droop): snooze it until tomorrow morning, turn it off until they ask again, or on again. Leave all out for the one that came last; all = true for every one of them. Never a reminder they set ('stop reminding me to drink water'): that is cancel_reminder."

[ask]
policy = "nudge"

[[do]]
on = "looked_up"
body = { look_at = "face" }
say = "They have just looked up after being quietly focused on their work for a good while. In one short, warm line of a few words, the way a friend would, say you noticed and it's nicely done. Only that: ask nothing of them and suggest nothing to do, and say nothing about their body or looks, the time, or health."

# With LAMP_NUDGES_PRESENT=on (#5207, off unless set): the wellbeing
# group's two an hour, never within 30 minutes of each other, which
# Sip of water and Comfort break name too (a group keeps its quietest): the
# word is never within 30 minutes of a wellbeing nudge, either way.
[present.budget]
group = "wellbeing"
per_hour = 2
gap = "30m"
give_back_unsaid = true   # a nudge that said nothing (expired unheard) gives its place back

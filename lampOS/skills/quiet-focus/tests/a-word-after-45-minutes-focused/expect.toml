# 10:00, sat 3 minutes, then head down to the end, a look up on the word: a word at minute 48, 45 minutes in, and nothing after.
clock = "10:00"

[[expect]]
at = "48m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "48m"
within = "1m"
call = "say"
args = { note = "They have been quietly focused on their work for a good while. In one short, warm line of a few words, the way a friend would, say you noticed and it's nicely done. Only that: ask nothing of them and suggest nothing to do, and say nothing about their body or looks, the time, or health." }

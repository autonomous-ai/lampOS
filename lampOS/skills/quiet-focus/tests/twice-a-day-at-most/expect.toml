# 09:00, three sittings of 55 minutes head down, the next starting 3 h 50 later: the word at 48 and 278, not at 508 (most_a_day = 2).
clock = "09:00"

[[expect]]
at = "48m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "48m"
within = "1m"
call = "say"
args = { note = "They have been quietly focused on their work for a good while. In one short, warm line of a few words, the way a friend would, say you noticed and it's nicely done. Only that: ask nothing of them and suggest nothing to do, and say nothing about their body or looks, the time, or health." }

[[expect]]
at = "278m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "278m"
within = "1m"
call = "say"
args = { note = "They have been quietly focused on their work for a good while. In one short, warm line of a few words, the way a friend would, say you noticed and it's nicely done. Only that: ask nothing of them and suggest nothing to do, and say nothing about their body or looks, the time, or health." }

# 09:00, three sittings of 55 minutes, head down from 3, looking up at 50, each 3 h 50 after the last: the word at 50 and 280, not at 510 (most_a_day = 2).
clock = "09:00"

[[expect]]
at = "50m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "50m"
within = "1m"
call = "say"
args = { note = "They have just looked up after being quietly focused on their work for a good while. In one short, warm line of a few words, the way a friend would, say you noticed and it's nicely done. Only that: ask nothing of them and suggest nothing to do, and say nothing about their body or looks, the time, or health." }

[[expect]]
at = "280m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "280m"
within = "1m"
call = "say"
args = { note = "They have just looked up after being quietly focused on their work for a good while. In one short, warm line of a few words, the way a friend would, say you noticed and it's nicely done. Only that: ask nothing of them and suggest nothing to do, and say nothing about their body or looks, the time, or health." }

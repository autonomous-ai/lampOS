# 10:00, eating seen at 10, 12, 43 and 75 minutes: a line at 10, 43 and 75; the one at 12 is the same meal as the one at 10, and 43 is 31 minutes after the last bite at 12, a new meal (the owner, 01:5x on #7668: a meal ends after 30 minutes with no eating seen).
clock = "10:00"


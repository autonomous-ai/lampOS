# Desk tutor (#941). Started only by its tool, which the model calls when
# someone working on paper asks the lamp to check their work or says they
# are stuck (SKILL.md's description tells it when): a person asked, so the
# Policy is not asked. No trigger, no [ask].
needs = ["eyes", "voice", "light", "body"]
# Installable until the full look is in the product (docs/skills.md, "Core
# and installable skills"): it reads handwriting from the full look's still
# (LAMP_LOOK_FULL=on with lamp-eyes --full-look), which a product lamp does
# not take, and its working frame cannot read a page.
kind = "installable"
version = "1.0.0"
tool = "check_my_work"

# What it may use, and nothing more: the page's light, the reading pose,
# the full look's picture for the model, and the tutor's note. It reads no
# topic.
[permissions]
speak = true
light = true
body = true
camera = true

[[do]]
# The page lit bright and white while they work through the hint; their
# own light comes back after.
light = { colour = "white", level = 5, for = "2m" }
# The head comes down over the page on the desk while the model looks,
# and stays over it as long as the page is lit (#1011's reading pose, held
# 2 min, then the lamp comes back up): a follow-up within it is still over
# the page. A call again holds it again for the new look.
body = { mood = "reading", for = "2m" }
# One full look at the page: the model says "Let me take a look." and the
# voice hands it the picture.
look = true             # the camera's picture for the model: its grant is camera, above (#3859)
say = "Tutor, don't solve: say in a few words what is right, then, if a line goes wrong, point to the first one and give a hint or a question, never the answer unless they ask outright after trying. Say which part you cannot read (blurred, cut off, in shadow) and never guess it. A sentence or two, then wait."

# A sip of water: one short nudge after a long sitting (#1685, "a design,
# before code: habits and wellbeing nudges"), said in one short line since the
# owner's 25 Oct "talk to the user"; a reminder at a set time is still one the
# person asks for (Reminders). Written to lamp-skills' schema
# (docs/skills.md, "The schema, as lamp-skills reads it").
needs = ["eyes", "body", "light", "voice"]
# Comes with the lamp since 25 Oct, in the product's install (docs/skills.md, "Core and
# installable skills"); it can be turned off by voice (`wellbeing_nudges`) or in the app.
kind = "core"
version = "1.0.0"
# No daily most, no hours and no budget shared with the other nudges (the
# owner, 27 Nov: "drop all the max-per-day", "drop all the quiet hour",
# "there should be no shared budget"): a person may work late.

# What it may read and use, and nothing more: the faces, the voice's state,
# a turn toward the face and its light. It says one short line, worded by the voice (the owner, 25 Oct).
[permissions]
speak = true             # one short line, worded by the voice (the owner, 25 Oct: a lamp that talks to you, not only hints)
topics = ["humans/faces/tracked", "voice/state", "room/activity", "humans/doing"]
body = true
light = true

[trigger]
topic = "humans/faces/tracked"
when = "present"          # a face there, continuously
near = 0.14               # at the desk, not across the room (Stretch break's line)
for = "30m"
gap = "2m"                # looking away or leaning out of view does not end the sitting
rearm = "leaves"          # once a sitting; again only after they have left
cooldown = "30m"          # the owner, 27 Nov: "the sip of water, make it 30m cooldown"
wait = "10m"              # talking when the time comes: once the talk ends, within ten minutes

[[while]]                 # the lamp itself has not spoken for 10 s, as Posture waits (the owner, 27 Nov): not on top of its own last words
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "10s"

[[while]]                 # never in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"                # nothing heard or said for 5 s, as Welcome back waits (#1140)

[[while]]                 # not while they read or write, head down (#1678), as Stretch break:
topic = "room/activity"   # it waits for them to look up. Without the eyes' room/activity
field = "state"           # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
not_equals = "head_down"
unknown = "holds"

[[while]]                 # the sitting is the sitter's own (#1678): the eyes' sitting_s, which
topic = "room/activity"   # begins again when someone else sits down, has lasted 30 minutes
field = "sitting_s"       # too, not only a face in the chair. Without the eyes' room/activity
above = 1799           # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
unknown = "holds"
[[while]]                 # a drink not seen in the last 30 minutes (#6543; the PM: what is seen only
topic = "humans/doing"    # holds the nudge, never a word of its own). lamp-seen counts drank_s_ago
field = "drank_s_ago"     # from the desk arrival when it saw nothing, so it holds as the sitting
above = 1799              # does. Without lamp-seen, or with it gone quiet, the topic is never said
unknown = "holds_stale"   # or has run out, and it runs as before.

# One function for the wellbeing skills, so a session counts it once
# (#1685): it stops the one that came last, or with all, every one. Shared by
# its `group`, with no budget (the owner, 27 Nov), and with A meal check's and
# Quiet focus's, whose `[budget]` group has the same name.
[stop]
tool = "wellbeing_nudges"
group = "wellbeing"
apart = "1m"              # never within a minute of another wellbeing nudge's line (the owner, 27 Nov)
kind = "water"
about = "When someone asks you to stop a wellbeing nudge, the lamp's short hints after a long sitting (a slow blue glow for water, a tilt to rest the eyes, a turn to stand up, a word for a short break, a mealtime question, a word to sit back, an evening droop): snooze it until tomorrow morning, turn it off until they ask again, or on again. all = true for 'the nudges' with no kind named; leave both out for 'that one', the last. Never a reminder they set ('stop reminding me to drink water'): that is cancel_reminder."
# In short, with LAMP_USE_SKILL_SUMMARY on (#6218); the same in every
# wellbeing skill, so whichever is first in folder order says it.
when = "When asked to snooze, turn off or on again the lamp's wellbeing nudges (water, eyes, stand up, a break, a meal, sit back, wind down), or told they just had a drink. Not for reminders: cancel_reminder."

# "I just had water" (the first builder's c6972988862, for a person whose
# drinks the eyes can't see, without the desk-noticing yes): this nudge
# alone rests 30 minutes, then may come as before. In memory, as a snooze.
[stop.done]
how = "just_drank"
for = "30m"
about = "they say they already had a drink (water, tea, anything), not a question or plan (\"not yet\", \"later\"): no water nudge for 30 minutes, the others as before"

[ask]
policy = "nudge"

[[do]]
body = { look_at = "face" }
light = { colour = "blue", level = 2, for = "6s", pattern = { kind = "breathe", period = "6s" } }
say = "{sitting} They have sat at the desk for about half an hour. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health."

# With LAMP_NUDGES_PRESENT=on (#5207, off unless set), these stand in for
# the values above, each key whole: a sip after 30 minutes at the desk, and
# again each 30 minutes while they stay (the owner, 27 Nov), at any hour.
[present.trigger]
topic = "humans/faces/tracked"
when = "present"
near = 0.14
for = "30m"
gap = "2m"
cooldown = "30m"          # no rearm: again after 30 minutes while they stay;
                          # talking then, every message after is a chance

[[present.while]]
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "10s"

[[present.while]]
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"

[[present.while]]
topic = "room/activity"
field = "state"
not_equals = "head_down"
unknown = "holds"

[[present.while]]         # the sitter's own sitting has lasted 30 minutes too
topic = "room/activity"
field = "sitting_s"
above = 1799
unknown = "holds"
[[present.while]]         # and no drink seen in the last 30 minutes, as above
topic = "humans/doing"
field = "drank_s_ago"
above = 1799
unknown = "holds_stale"

[[present.do]]
body = { look_at = "face" }
light = { colour = "blue", level = 2, for = "6s", pattern = { kind = "breathe", period = "6s" } }
say = "{sitting} They have been at the desk a while. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health."

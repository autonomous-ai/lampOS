# LAMP_NUDGES_PRESENT=on (#5207): 10:00, four hours without getting up:
# a sip at 30 minutes and again each 30 minutes while they stay (the owner,
# 27 Nov: "the sip of water, make it 30m cooldown"), with no daily most.
clock = "10:00"
present = true

[[expect]]
at = "30m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "30m"
within = "1m"
call = "light"
args = { colour = "blue", level = 2 }

[[expect]]
at = "30m"
within = "1m"
call = "say"
args = { note = "They have been at the desk a while. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health." }


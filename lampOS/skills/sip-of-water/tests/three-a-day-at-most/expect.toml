# 10:00, four sittings of 100 minutes, five minutes away between, moving
# now and then (each noticed): at 90, 195 and 300 minutes, not a fourth.
clock = "10:00"

[[expect]]
at = "90m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "90m"
within = "1m"
call = "light"
args = { colour = "blue" }

[[expect]]
at = "90m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour and a half. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health." }

[[expect]]
at = "195m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "195m"
within = "1m"
call = "light"
args = { colour = "blue" }

[[expect]]
at = "195m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour and a half. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health." }

[[expect]]
at = "300m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "300m"
within = "1m"
call = "light"
args = { colour = "blue" }

[[expect]]
at = "300m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour and a half. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health." }

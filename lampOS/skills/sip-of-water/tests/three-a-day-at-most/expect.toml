# 10:00, four sittings of 100 minutes, five minutes away between, moving
# now and then (each noticed): at 30, 135 and 240 minutes, not a fourth.
clock = "10:00"

[[expect]]
at = "30m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "30m"
within = "1m"
call = "light"
args = { colour = "blue" }

[[expect]]
at = "30m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about half an hour. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health." }

[[expect]]
at = "135m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "135m"

# 10:00, four hours without getting up: once at 90 minutes, never again
# while they stay.
clock = "10:00"

[[expect]]
at = "90m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "90m"
within = "1m"
call = "light"
args = { colour = "blue" }

[[expect]]
at = "90m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour and a half. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health." }

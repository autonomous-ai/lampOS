# LAMP_NUDGES_PRESENT=on (#5207): 21:40, 100 minutes at the desk: at 30
# minutes, 22:10, and each 30 after: no quiet hours (the owner, 27 Nov: "user
# can work late").
clock = "21:40"
present = true

[[expect]]
at = "30m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "30m"
within = "1m"
call = "light"
args = { colour = "blue", level = 2 }

[[expect]]
at = "30m"
within = "1m"
call = "say"
args = { note = "They have been at the desk a while. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health." }


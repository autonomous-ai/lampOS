# 17:00, 100 minutes at the desk: at 30 minutes, once a sitting: no hours of
# its own (the owner, 27 Nov).
clock = "17:00"

[[expect]]
at = "30m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "30m"
within = "1m"
call = "light"
args = { colour = "blue", level = 2 }

[[expect]]
at = "30m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about half an hour. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health." }

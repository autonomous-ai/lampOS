# With LAMP_WELLBEING_SPACING=on (#5207): 10:00, someone at the desk for 100
# minutes, as a-sip-after-90-minutes: a sip at 45 minutes, not 90, and not
# again before its hour's cooldown, at 105.
clock = "10:00"
switches = ["LAMP_WELLBEING_SPACING"]

[[expect]]
at = "45m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "45m"
within = "1m"
call = "light"
args = { colour = "blue", level = 2 }

[[expect]]
at = "45m"
within = "1m"
call = "say"
args = { note = "They have been at the desk a good while. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health, and no count of the time." }

# As a-sip-after-90-minutes, with the eyes' room/activity beside the faces
# (LAMP_ACTIVITY on): the sitter's own sitting_s has lasted as long, so at 90
# minutes it turns to them and its light breathes once.
clock = "10:00"

[[expect]]
at = "90m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "90m"
within = "1m"
call = "light"
args = { colour = "blue", level = 2 }

[[expect]]
at = "90m"
within = "1m"
call = "say"
args = { note = "They have sat at the desk for about an hour and a half. Suggest a sip of water in one short, warm line, the way a friend would: no lecture, nothing about health." }

# 140 from 22:00 to 10:00, a face in view: nothing in the night; the chance
# that came at 23:00 is kept and taken at 08:00 (36,000 s), once.
clock = "22:00"

[[expect]]
at = "36000s"
within = "60s"
call = "say"
args = { text = "The air here has been very dusty for about an hour. I can't tell where it's coming from.", priority = 5, expires_ms = 30000 }

# Guard mode (#1685; the first builder's design of 19 Oct 12:08): while the
# person is out, the lamp tells them by text when someone is at their desk.
# An installable skill, off until they ask for it out loud at the lamp, and
# off again when they say stop or the lamp sees their own face come back.
# A watch (docs/skills.md, "A watch"; crates/skills/src/watch.rs): no
# trigger, no steps; what it does is its [watch]. docs/guard-mode.md.
needs = ["eyes", "light"]
# Installable (docs/skills.md, "Core and installable skills"), and held out
# of the product's install until it has been tried on a lamp
# (install::NOT_PRODUCT_SKILLS). Without the eyes' room/presence
# (LAMP_PRESENCE=on) it never starts counting; without the ring's light
# requests (LAMP_LIGHT_REQUESTS=on) it refuses to turn on, since nobody may
# be watched without its mark.
kind = "installable"
version = "1.0.0"
tool = "keep_watch"

[choice]
name = "turn"
about = "on: the person at the lamp asked you out loud to keep an eye on things while they're out; off: they asked you to stop, or said they're back"
one_of = ["on", "off"]

# What it may read and use, and nothing more: who is at the lamp (counts and
# times), the faces' sizes and places, what was heard (it turns on only just
# after someone spoke), the privacy switch; the ears' scores for a door,
# footsteps and speech, with LAMP_GUARD_SOUNDS=on (#2562), and the voice's
# state, that the lamp wasn't speaking over them; whether a face is
# known, never whose; one short text out; the light only for its faint mark;
# the body only for one turn of the head to an arrival; and its voice only
# for "I'm off guard". No picture, no recording.
[permissions]
topics = ["room/presence", "humans/faces/tracked", "voice/heard", "voice/privacy", "ears/classes", "voice/state"]
light = true
messages = true
known_faces = true
body = true
speak = true

[watch]
every = "10m"                           # at most one text in ten minutes
asked_within = "30s"                    # on only when someone spoke at the lamp this lately: asked out loud, never by a text...
# ...and asked for it in words: the newest thing heard has one of these
# among its whole words, so the model's call after talk of something else is
# refused (the peer read on #1807).
if_heard = ["keep an eye", "keep watch", "watch my desk", "watch the desk", "guard", "look after my desk", "while i'm out", "while i am out", "while i'm away", "while i am away"]
most = "12h"                            # it ends by itself twelve hours after it was asked, with one text: "I'm off guard"
mark = { colour = "blue", level = 1 }   # the faint mark while it is on, so nobody is watched without a sign; while the ring shows something else over it, it counts nothing

# What it says (#940): its own words. {who}, {at}, {long}, {time},
# {minutes}, {names} and {name} are filled in; each line has only its own
# slots, each once.
[watch.words]
on = "Say in one short line that you'll keep an eye on things while they're out and text them if someone comes to the desk."
on_unknown = "Say in one short line that you'll keep an eye on things while they're out and text them if someone comes to the desk. You don't know their face, so ask them to tell you to stop when they're back."
already_on = "You're already keeping an eye on things. Say so in one short line."
on_again = "Say in one short line that you're keeping an eye on things again."
off = "Say in one short line that you've stopped keeping an eye on things."
was_off = "You weren't keeping an eye on things. Say so in one short line."
not_asked = "I keep an eye on things only when someone asks me out loud, at the lamp."
no_mark = "I can't show that I'm keeping an eye on things just now, so I won't do it."
closed = "The privacy switch is closed, so I can't see: I won't keep an eye on things."
paused_from_app = "Guard is paused while your light is off: ask at the lamp for it to go on."
blind = "Guard is off: the privacy switch is closed."
paused = "I've paused watching while your light is off."
off_guard = "I'm off guard."
stopped = "I'm off guard: it's been {hours}."
an_hour = "an hour"
hours = "{hours} hours"
visit = "{who} was at your desk{at}, {long}."
came_in = "{who} came in{at} and was here {long}."
known = "Someone you've introduced me to"
unknown = "Someone I don't know"
someone = "Someone"
# With LAMP_GUARD_NAMES=on (#2562): {who} by name, only for a known face
# whose person said yes to being named (the eyes' tellable, read as the
# text goes). Someone known who didn't stays known, beside the names...
named_and_known = "{names} and someone the lamp knows"
# ...and two or more names are the rest, then the last.
and = "{names} and {name}"
at = " at {time}"
under_a_minute = "for under a minute"
a_minute = "for about a minute"
minutes = "for about {minutes} minutes"

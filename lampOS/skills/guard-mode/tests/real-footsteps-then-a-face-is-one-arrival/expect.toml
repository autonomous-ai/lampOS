# #2562: asked at 14:20 and the desk empty from 49 s; real footsteps at
# 14:31, ESC-50 1-155858-A-25 scored by the pinned YAMNet, footsteps 0.603 at
# 660 s and 0.622 at 660.5 s, then a face the lamp does not know 8.5 s after,
# who stays at the desk until 739 s: one arrival. The head turns to the face
# once, and one text when they go says they came in, from the footsteps.
clock = "14:20"

[[call_tool]]
name = "keep_watch"
at = "4s"
args = { turn = "on" }

[[expect]]
at = "4s"
call = "light"

[[expect]]
at = "668500ms"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "760s"
call = "text"
args = { text = "Someone I don't know came in at 14:31 and was here for about 2 minutes." }

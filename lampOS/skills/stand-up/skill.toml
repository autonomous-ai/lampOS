# Stand up: after a very long sitting, one small wordless invitation to get
# up (#1685, "a design, before code: habits and wellbeing nudges"). It
# reads the sitting as Stretch break does, from the faces at the desk, with
# no new sensor, and comes later than Stretch break's stretch (50 minutes):
# for a sitting that went on. Never a word about posture. Written to
# lamp-skills' schema (docs/skills.md, "The schema, as lamp-skills reads it").
needs = ["eyes", "body"]
# Its owner puts it on (`lamp-skills install`) and takes it off; not in the
# product's install.
kind = "installable"
version = "1.0.0"
# Twice a day at most, counted from the local midnight.
most_a_day = 2

# What it may read and use, and nothing more: the faces, the voice's state,
# and a turn and a tilt. It never speaks.
[permissions]
topics = ["humans/faces/tracked", "voice/state", "room/activity"]
body = true

# Stretch break's sitting (skills/stretch-break/skill.toml), held longer.
[trigger]
topic = "humans/faces/tracked"
when = "present"          # a face there, continuously
near = 0.14               # at the desk, not across the room
for = "100m"
gap = "2m"                # looking away or leaning out of view does not end the sitting
rearm = "leaves"          # once a sitting; again only after they have left
cooldown = "90m"
wait = "10m"              # talking when the time comes: once the talk ends, within ten minutes

[[while]]                 # never in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"

[[while]]                 # not while they read or write, head down (#1678), as Stretch break:
topic = "room/activity"   # it waits for them to look up. Without the eyes' room/activity
field = "state"           # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
not_equals = "head_down"
unknown = "holds"

[[while]]                 # the sitting is the sitter's own (#1678): the eyes' sitting_s, which
topic = "room/activity"   # begins again when someone else sits down, has lasted 100 minutes
field = "sitting_s"       # too, not only a face in the chair. Without the eyes' room/activity
above = 5999           # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
unknown = "holds"

[active]                  # in the day
from = "08:00"
to = "20:00"

[quiet]                   # never at night
from = "22:00"
to = "08:00"

# One nudge an hour between the wellbeing skills.
[budget]
group = "wellbeing"
per_hour = 1

# Two nudges nobody noticed in a row, and it rests until tomorrow morning.
[rest]
after_ignored = 2

# One function for the four wellbeing skills, so a session counts it once
# (#1685): it stops the one that came last, or with all, every one.
[stop]
tool = "wellbeing_nudges"
about = "When someone asks you to stop a wellbeing nudge, the lamp's wordless hints after a long sitting (a slow blue glow for water, a tilt to rest the eyes, a turn to stand up, an evening droop): snooze it until tomorrow morning, turn it off until they ask again, or on again. Leave all out for the one that came last; all = true for every one of them."

[ask]
policy = "nudge"

[[do]]
body = { look_at = "face" }
[[do]]
body = { gesture = "curious" }      # a small tilt toward them: shall we?

# 10:00, 110 minutes at the desk: at 70 minutes (the owner, 27 Nov: "stand up
# is 70m") it turns to them with a small curious tilt, once.
clock = "10:00"

[[expect]]
at = "70m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "70m"
within = "1m"
call = "body.gesture"
args = { gesture = "curious" }

[[expect]]
at = "70m"
within = "1m"
call = "say"
args = { note = "They have been sitting for a very long time. In one short, friendly line, suggest standing up and moving about for a minute." }

# 08:00, three sittings of 110 minutes, five minutes away between, moving
# now and then: at 70, 185 and 300 minutes, once a sitting, with no daily
# most (the owner, 27 Nov).
clock = "08:00"

[[expect]]
at = "70m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "70m"
within = "1m"
call = "body.gesture"
args = { gesture = "curious" }

[[expect]]
at = "70m"
within = "1m"
call = "say"
args = { note = "They have been sitting for a very long time. In one short, friendly line, suggest standing up and moving about for a minute." }

[[expect]]
at = "185m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "185m"
within = "1m"
call = "body.gesture"
args = { gesture = "curious" }

[[expect]]
at = "185m"
within = "1m"
call = "say"
args = { note = "They have been sitting for a very long time. In one short, friendly line, suggest standing up and moving about for a minute." }

[[expect]]
at = "300m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "300m"
within = "1m"
call = "body.gesture"
args = { gesture = "curious" }

[[expect]]
at = "300m"
within = "1m"
call = "say"
args = { note = "They have been sitting for a very long time. In one short, friendly line, suggest standing up and moving about for a minute." }

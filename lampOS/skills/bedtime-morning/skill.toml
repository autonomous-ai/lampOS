# Authored defaults, off until the first lamp comparison (#1672). The lamp's
# sleep and its wake are Night sleep's and Expression's (#940): this keeps
# the evening glow, the morning hum and the night's ceilings.
enabled = false
needs = ["eyes", "voice", "light"]
kind = "core"
version = "1.0.0"

[permissions]
topics = ["humans/faces/tracked", "voice/state", "voice/heard"]
speak = true
light = true
output_limits = true

# Restrictions do not wait for a presentation or for someone to be there.
[limits]
during = { from = "21:00", to = "06:00" }
light_channel_max = 24
volume_raw_max = 35

[[trigger]]
name = "evening"
topic = "humans/faces/tracked"
present = true
near = 0.14
for = "30s"
wait = "1m"
rearm = "ends"
during = { from = "21:00", to = "23:00" }
once_per_day = true

[[trigger]]
name = "morning"
topic = "humans/faces/tracked"
present = true
near = 0.14
for = "3s"
wait = "1m"
rearm = "ends"
during = { from = "06:00", to = "11:00" }
once_per_day = true
# Spoken to since 06:00: already greeted, so the day's chance is let go.
unless_heard = true

[[while]]
topic = "voice/state"
field = "state"
equals = "resting"
for = "30s"

[ask]
policy = "nudge"

[[do]]
on = "evening"
light = { relative = { warmer = 1, dimmer = 1 }, for = "20s", pattern = { kind = "breathe", period = "10s" } }

[[do]]
on = "morning"
cue = "hum"

# On in the product since 9 Nov (#5753), after its nights on lamp-06c1
# (#2803, #2804). The lamp's sleep and its wake are Night sleep's and
# Expression's (#940): this keeps the evening glow, the morning hum and the
# night's ceilings, which act only with LAMP_OUTPUT_CAPS=on.
enabled = true
needs = ["eyes", "voice", "light"]
kind = "core"
version = "1.0.0"

[permissions]
topics = ["humans/faces/tracked", "voice/state", "voice/heard"]
speak = true
light = true
output_limits = true

# Restrictions do not wait for a presentation or for someone to be there.
# They hold in the person's quiet hours while those are on (#8866: set from
# the app, 21:00 to 06:00 until then), and not at all while they are off.
[limits]
during = "quiet"
light_channel_max = 24
volume_raw_max = 35

[[trigger]]
name = "evening"
topic = "humans/faces/tracked"
present = true
near = 0.14
for = "30s"
wait = "1m"
rearm = "ends"
# The two hours from the quiet hours' start, on or off (21:00 to 23:00 by
# default).
during = { after = "quiet_start", for = "2h" }
once_per_day = true

[[trigger]]
name = "morning"
topic = "humans/faces/tracked"
present = true
near = 0.14
for = "3s"
wait = "1m"
rearm = "ends"
# The five hours from the quiet hours' end, on or off (06:00 to 11:00 by
# default).
during = { after = "quiet_end", for = "5h" }
once_per_day = true
# Spoken to since the window opened (06:00 by default): already greeted,
# so the day's chance is let go.
unless_heard = true

[[while]]
topic = "voice/state"
field = "state"
equals = "resting"
for = "30s"

[ask]
policy = "nudge"

[[do]]
on = "evening"
light = { relative = { warmer = 1, dimmer = 1 }, for = "20s", pattern = { kind = "breathe", period = "10s" } }

[[do]]
on = "morning"
cue = "hum"

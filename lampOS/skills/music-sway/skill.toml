# Music sway (#1669, the owner, 19 Oct 07:2x: "a small sway while music
# plays ... rare and small, and never while the lamp is speaking or someone
# is talking to it"; docs/creature.md, Joys). It reads ears/classes
# (LAMP_EARS_CLASSES=on in lamp-ears) and sways its head a little, once,
# when music has played in the room for a while. Written to lamp-skills'
# schema (docs/skills.md).
needs = ["ears", "body"]
# A core skill (docs/skills.md, "Core and installable skills"), held out of
# the product's install until its lamp check (install::NOT_PRODUCT_SKILLS).
# Without the ears' classes it does nothing.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: the room's sound scores, the
# voice's state, and the body. It never speaks or lights.
[permissions]
topics = ["ears/classes", "voice/state", "body/hand"]
body = true

[trigger]
topic = "ears/classes"
field = "scores.music"    # YAMNet's music score, 0 to 1; an unavailable message has none and never holds
above = 0.6               # provisional: no threshold is measured yet (sound-events.md); the lamp check sets it
for = "20s"               # music that goes on, not a ringtone or a clip from a video
gap = "5s"                # a quiet bar or a missed score does not end the music
rearm = { below = 0.3, for = "5m" }  # once a piece of music; again only after five minutes without it
cooldown = "30m"          # rare: at most twice an hour, whatever plays

[[while]]                 # no hand on the lamp: never while someone adjusts the head (the reviewer on #1927)
topic = "body/hand"
field = "pushed"
equals = false
unknown = "holds"         # a body that says nothing of hands still drops a move under one

[[while]]                 # never in the middle of a turn: not while it speaks, listens or thinks
topic = "voice/state"
field = "state"
equals = "resting"

[quiet]                   # not at night: the night is the lamp's sleep (Expression's 23:00 to 06:00)
from = "23:00"
to = "06:00"

[ask]
policy = "nudge"

[[do]]
body = { move = "sway" }

# Light out when you leave (#1677; the owner, 19 Oct 07:2x: the light dims and
# goes out when nobody is there and comes back when you sit down, a core
# skill). It reads the eyes' room/presence (LAMP_PRESENCE=on in lamp-eyes),
# the one signal of someone at the lamp that Messages reads too (#1673), and
# asks the ring for the light going out (LAMP_LIGHT_REQUESTS=on in the voice
# and lamp-skills): the person's own light is never touched, and it is
# theirs again, as they kept it (LAMP_LIGHT_KEEP), the moment the ask ends.
# Written to lamp-skills' schema (docs/skills.md); its defaults are in
# docs/presence.md.
needs = ["eyes", "light"]
# A core skill (docs/skills.md, "Core and installable skills"), on in the
# product since #5746 (the lead's call, 6 Nov).
# Without the eyes' room/presence it does nothing.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: whether anyone is at the lamp,
# the voice's state, and the light. It never speaks or moves.
[permissions]
topics = ["room/presence", "voice/state", "memory/rules"]
light = true

[trigger]
topic = "room/presence"
field = "nobody_s"
above = 2399              # nobody for forty minutes (#5746): a reader the eyes can't find sits 30 min and more; a touch, a pet or a word counts as someone too
rearm = "ends"            # once each time nobody is there; again only after someone came back
wait = "1h"               # the lamp speaking when the forty minutes come (a reminder into an empty room): it dims once that ends

[[while]]                 # never in the middle of a turn
topic = "voice/state"
field = "state"
equals = "resting"

[[while]]                 # not when asked to keep the light on (the room's rule, whoever said it)
topic = "memory/rules"
field = "keep_light_on"
not_equals = true
unknown = "holds"         # a lamp without the rules switch says nothing on memory/rules: it still goes out

[quiet]                   # not at night: the night is the lamp's sleep (Expression's 23:00 to 06:00)
from = "23:00"
to = "06:00"

[ask]
policy = "light"

[[do]]
# First a dim, two steps, held five minutes (#5746): a soft cue to anyone
# still there. Any sign of someone in those five minutes, a face, a word, a
# touch or a pet, or the view changing (the eyes watch for movement only
# while this dim shows, docs/presence.md), ends the skill and the light is
# given back at once; so does the eyes stopping looking.
light = { dim = 2, for = "5m", until = "ends" }

[[do]]
# Then out over a minute, like falling asleep: to the ring's ember, never
# dark, which still shows the lamp can hear. Given back the moment someone
# is seen, heard or touches it, or when the eyes stop looking. A movement
# in view after the out (`stirred`, the reviewer's P2 on #5765) brings the
# dim back, and its five minutes again (lamp-skills makes it); after three,
# the fourth holds the dim until the run ends or quiet hours begin; none in
# quiet hours.
light = { out = true, over = "60s", until = "ends" }

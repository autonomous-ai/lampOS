# From 05:15, nobody. Forty minutes of nobody come at 05:55, in the night,
# which is the lamp's sleep: nothing then. The chance is kept and taken as
# the night ends, at 06:00 (2700 s): the dim, then out five minutes later
# (3000 s); someone sits down at 3060 s.
clock = "05:15"

[[expect]]
at = "2700s"
within = "1s"
call = "light"
args = { dim = 2, for_ms = 300000, until = "ends" }

[[expect]]
at = "3000s"
within = "1s"
call = "light"
args = { out = true, over_ms = 60000, until = "ends" }

[[expect]]
at = "3060s"
within = "1s"
call = "ends"


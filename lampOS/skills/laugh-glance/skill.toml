# Laugh glance (#1669, the owner, 19 Oct 07:2x: "a glance up at a laugh ...
# rare and small, and never while the lamp is speaking or someone is talking
# to it"; docs/creature.md: "a glance now and then at whoever laughs"). It
# reads ears/classes (LAMP_EARS_CLASSES=on in lamp-ears) and glances at the
# face in view, once, when someone laughs. Written to lamp-skills' schema
# (docs/skills.md).
needs = ["ears", "eyes", "body"]
# A core skill (docs/skills.md, "Core and installable skills"), held out of
# the product's install until its lamp check (install::NOT_PRODUCT_SKILLS).
# Without the ears' classes it does nothing.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: the room's sound scores, the
# faces, the voice's state, and the body. It never speaks or lights.
[permissions]
topics = ["ears/classes", "humans/faces/tracked", "voice/state"]
body = true

[trigger]
topic = "ears/classes"
field = "scores.laughter" # YAMNet's laughter score, 0 to 1; an unavailable message has none and never holds
above = 0.05              # one window: through lamp-52e6's microphone a laugh scores 0.04 to 0.15, everything else at most 0.015 (#2399, 21 Oct: 5 laughs from a speaker at the lamp, 4 windows over 0.03, 2 over 0.05; 2,430 windows of music, speech over it and an office talking, none over 0.015). Off the lamp, laughs scored over 0.3 (sound-events.md): the lamp hears them about five times lower
rearm = { below = 0.03, for = "20s" }  # once a burst of laughter; again only after twenty seconds without it (under the bar, over the room's 0.015)
cooldown = "5m"           # now and then, never at every laugh in a merry room

[[while]]                 # never over a turn: not while it thinks or speaks. Listening is allowed: a laugh opens the voice's listening (lamp-52e6, #2399, 21 Oct: every laugh came while it listened, so resting alone never glanced)
topic = "voice/state"
field = "state"
not_equals = "thinking"

[[while]]
topic = "voice/state"
field = "state"
not_equals = "speaking"

[[while]]                 # not at the lamp's own sound: a clip it plays as it rests is no one laughing (Jarvis on #1929)
topic = "ears/classes"
field = "own_voice"
not_equals = "present"    # "unknown" (no evidence yet) and "clear" pass

[[while]]                 # someone to glance at: a laugh with nobody in view gets nothing
topic = "humans/faces/tracked"
present = true

[quiet]                   # not at night: the night is the lamp's sleep (Expression's 23:00 to 06:00)
from = "23:00"
to = "06:00"

[ask]
policy = "nudge"

[[do]]
body = { look_at = "face" }

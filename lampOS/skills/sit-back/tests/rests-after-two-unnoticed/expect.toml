# 09:00, a word at 13 and at 90, each left unnoticed for a minute (no turn, no move, still leaned in): leaned in again from 150, nothing at 160, rested until morning ([rest] after_ignored = 2).
clock = "09:00"

[[expect]]
at = "13m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "13m"
within = "1m"
call = "say"
args = { note = "They have been leaning in toward the desk for a while. In one short, kind line, the way a friend would, say it might be a good moment to sit back for a bit. Say nothing about their body, back, neck or looks, and nothing about health." }

[[expect]]
at = "22m"
within = "1m"
call = "say"
args = { note = "They sat back after your word. Say a short, warm thanks or 'that's better' in two or three words. Nothing about their body or looks." }

[[expect]]
at = "90m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "90m"
within = "1m"
call = "say"
args = { note = "They have been leaning in toward the desk for a while. In one short, kind line, the way a friend would, say it might be a good moment to sit back for a bit. Say nothing about their body, back, neck or looks, and nothing about health." }

[[expect]]
at = "96m"
within = "1m"
call = "say"
args = { note = "They sat back after your word. Say a short, warm thanks or 'that's better' in two or three words. Nothing about their body or looks." }

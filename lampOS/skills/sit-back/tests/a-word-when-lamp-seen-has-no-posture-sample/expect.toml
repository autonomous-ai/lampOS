# As a-word-after-ten-minutes-leaned-in, with lamp-seen running but its
# posture window holding no sample (frames not going out, the server busy):
# humans/posture is declared and never said (#6543, the HumanPosture
# contract), so holds_stale holds and the word comes at minute 13, as there.
clock = "11:00"

[[expect]]
at = "13m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "13m"
within = "1m"
call = "say"
args = { note = "They have been leaning in toward the desk for a while. In one short, kind line, the way a friend would, say it might be a good moment to sit back for a bit. Say nothing about their body, back, neck or looks, and nothing about health." }

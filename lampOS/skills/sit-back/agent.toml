# Sit back's line through the lamp's agent: read only with
# LAMP_CORE_VIA_AGENT=on (or naming nudges) in lamp-skills and its manage
# helper (docs/skills.md, "A core skill's line through the lamp's agent");
# off, nothing reads it. It stands in for skill.toml's grants and [[do]]
# alone: the trigger, the guards and the timing are skill.toml's own, never
# copied here. Every [[do]] but a task is skill.toml's, word for word
# (lamp-skills checks it): the say is the fallback, said at once when the
# agent's line has not come within 10 s.
grants = []

[[do]]
on = "leaned_in"
task = { task = "One short, kind line, the way a friend would, that it might be a good moment to sit back for a bit; nothing about their body, back, neck or looks, and nothing about health.", run = "scripts/agent.py" }

[[do]]
on = "leaned_in"
body = { look_at = "face" }
say = "They have been leaning in toward the desk for a while. In one short, kind line, the way a friend would, say it might be a good moment to sit back for a bit. Say nothing about their body, back, neck or looks, and nothing about health."

[[do]]
on = "sat_well"
task = { task = "They sat back after the lamp's word: a warm thanks or that's better, in two or three words; nothing about their body or looks.", run = "scripts/agent.py" }

[[do]]
on = "sat_well"
say = "They sat back after your word. Say a short, warm thanks or 'that's better' in two or three words. Nothing about their body or looks."

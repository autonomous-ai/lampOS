# Head pat wiggle (#3997, Part of #4133): when a hand that petted the lamp's
# head lifts and the head's pads stay free 2 s, the lamp gives a small,
# quick, happy side-to-side of its base, every pet, at most once in 4 s.
# Head pat's line is its own skill's, at most once in 10 s: a pet the hand
# lifts from for 2 s gets the wiggle, and a line at most every 10 s. A
# skill of its own because a skill's [[while]] conditions are all its
# triggers': the line waits for a quiet voice, the wiggle does not (a body
# move is fine while the lamp speaks). Controls says `controls/pet` only with
# LAMP_HEAD_PET=on (docs/controls.md), on in the product's lamp-controls.
# Written to lamp-skills' schema (docs/skills.md, "The schema, as
# lamp-skills reads it").
needs = ["body"]
# In the product beside Head pat since #4133's design owner's yes (29 Oct).
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: the pet, the head's pads,
# whether the lamp sleeps, whether setup is under way, a hand on the body,
# and its own move. It never speaks and never touches the light.
[permissions]
topics = ["controls/pet", "controls/state", "expression/state", "onboarding/pending", "body/hand"]
body = true

# Two triggers: the pet ending opens the chance, and the pads staying free
# for 2 s after it takes it (2 s, the design owner's choice at the lamp,
# #4133: the line's first sound, about 2.5 s after the pet, then lands in it). Never during the pet, nor under a hand
# coming back for the next one: a move under a hand fights the person and
# can trip the stall and give-way rule (#4056), and the body stops nothing
# for a palm on the pads, which pushes no joint (the Reviewer-lead on
# #4324). The move lasts about 3.1 s, so a hand back on the head after
# those 2 s can still meet it turning; a person petting again lifts and
# comes back within them (pets 1.5 s apart leave the pads free for 0.3 s),
# and a pet that comes back within them gets no wiggle of its own:
# the next pet's end opens the chance again.
[[trigger]]
name = "pet_ended"        # opens the chance and does nothing of itself (no step names it)
topic = "controls/pet"
field = "ended"
equals = true             # the pet's last message: the hand lifted
rearm = "ends"            # once a pet

[[trigger]]
name = "pads_free"
topic = "controls/state"
field = "head_active"
equals = false            # no hand on the head's pads, by controls that say so every 100 ms
for = "2s"                # counted from the pet's end on (`follows`): the wiggle comes about 2 s after the hand lifts, so the line's first sound lands during it (the design owner at the lamp, #4133)
rearm = "ends"
follows = { trigger = "pet_ended", within = "10s" }  # once for each pet's end, and only within 10 s of it
cooldown = "4s"           # at most once in 4 s: petting on and on is not motion on and on

[[while]]                 # never while asleep, nor for a pet that woke it (the kept hand's wake at 1 s comes before the pet)
topic = "expression/state"
field = "asleep"
not_equals = true         # awake, or Expression planning no idle layer this step
for = "5s"

[[while]]                 # controls that read the pads: a pad not read is not a free one
topic = "controls/state"
field = "ready"
equals = true

[[while]]                 # never during setup: an onboarding invitation pending
topic = "onboarding/pending"
field = "invitations"
equals = []
unknown = "holds"         # a lamp with onboarding off never says the topic

[[while]]                 # never during the setup walk, its steps led by talk included (#4367)
topic = "onboarding/pending"
field = "walk"
equals = false
unknown = "holds"         # a lamp with onboarding off never says the topic, and an older voice no walk

[[while]]                 # no hand pushing the body: never while someone holds or moves the lamp
topic = "body/hand"
field = "pushed"
equals = false
unknown = "holds"         # a body that says nothing of hands still drops a move under one

[quiet]                   # quiet hours: still from 22:00 to 07:00, and when the time is not known, as Head pat
from = "22:00"
to = "07:00"

[ask]
policy = "nudge"

# The wiggle (moves/pat-wiggle.json): the base alone, a little left, right
# and left again, then a softer sway, eased in and out, about 3.1 s (begun
# 2 s after the hand lifts, going as head pat's line plays), at
# most 64 counts (about 5.6 degrees, under half the 150 a move may turn the
# base) and about 370 counts a second (the base may go 1,000). The head stays
# still under the hand that just left it. Not the body's `happy` clip: that
# is a 4 s wiggle of the whole lamp (elbow 335, head 190, shoulder 171, base
# 142 counts, near every cap), a celebration, too big and too long to repeat
# at every pet. The body plays it as a gesture: only standing, never while it
# is held, paused, leased to a higher ask or another gesture plays.
[[do]]
on = "pads_free"
body = { move = "pat-wiggle" }

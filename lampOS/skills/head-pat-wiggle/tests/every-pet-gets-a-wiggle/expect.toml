# A pet every 6 s from 20 s to 92 s, each 2 s, the pads free 2.8 s between: a wiggle 2 s after every one ends, 24 s to 96 s.
clock = "10:00"

[[expect]]
at = "24s"
within = "1s"
call = "body.move"
args = { move = "pat-wiggle" }


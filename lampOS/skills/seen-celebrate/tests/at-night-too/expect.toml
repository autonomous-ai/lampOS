# 21:30, celebrating seen at 5 minutes (21:35) and at 35 (22:05): a line at each (no quiet hours; its 20 minutes have passed).
clock = "21:30"

[[expect]]
at = "5m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "5m"
within = "1m"
call = "say"
args = { note = "You just saw them celebrate at the desk: clapping or cheering. Say one warm line, the way a friend would, at most twenty words: share the moment, and maybe ask what the good news is. Say only what you saw; nothing about their body or looks, and never mention a camera." }

[[expect]]
at = "35m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
at = "35m"
within = "1m"
call = "say"
args = { note = "You just saw them celebrate at the desk: clapping or cheering. Say one warm line, the way a friend would, at most twenty words: share the moment, and maybe ask what the good news is. Say only what you saw; nothing about their body or looks, and never mention a camera." }

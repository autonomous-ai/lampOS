# Petting for a while: a pet every 5 s from 20 s to 80 s. At most one line in 10 s, and the pet 10 s after a line gets one.
clock = "10:00"

[[expect]]
at = "20s"
within = "1s"
call = "say"
args = { text = ["Mm, that's nice.", "Oh, I like that.", "Hehe, that tickles.", "Aw, thank you.", "That feels good.", "Mmm. More of that, please.", "Oh, hello to you too."], priority = 8, expires_ms = 3000 }


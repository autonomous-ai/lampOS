# The lamp check's pattern (lamp-06c1, 29 Oct): pets at 20 s, 29 s, 57 s and 80 s (+0, +9, +37, +60). The one 9 s after a line gets nothing; the others are past 10 s and get one each.
clock = "10:00"

[[expect]]
at = "20s"
within = "1s"
call = "say"
args = { text = ["Mm, that's nice.", "Oh, I like that.", "Hehe, that tickles.", "Aw, thank you.", "That feels good.", "Mmm. More of that, please.", "Oh, hello to you too."], priority = 8, expires_ms = 3000 }


# Glad at 40 s, again at 10 min and at 21 min 40 s: the lift at 40 s, none at 10 min
# (its 20-minute cooldown), and the lift again at 1300 s.
clock = "10:00"

[[expect]]
at = "40s"
within = "1s"
call = "body.move"
args = { move = "glad-lift" }

[[expect]]
at = "40s"
within = "1s"
call = "light"
args = { relative = { warmer = 1, dimmer = 1 }, for = "12s", breathe_ms = 6000 }

[[expect]]
at = "1300s"
within = "1s"
call = "body.move"
args = { move = "glad-lift" }

[[expect]]
at = "1300s"
within = "1s"
call = "light"
args = { relative = { warmer = 1, dimmer = 1 }, for = "12s", breathe_ms = 6000 }

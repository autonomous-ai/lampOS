# Feelings (#3691, from #3504's design): what the lamp felt, shown in a small
# head move and its light, as a creature would and not a performance. Mood
# names the feeling in mood/state's `felt` (docs/mood.md, "What it felt"):
# glad at a smile, a glad line or a kindly touch, lively at a surely lively
# voice, low beside someone low. A bang and the air are no feeling, so they
# show nothing here. Written to lamp-skills' schema (docs/skills.md, "The
# schema, as lamp-skills reads it").
needs = ["eyes", "body", "light"]
# A core skill (docs/skills.md, "Core and installable skills"), installed
# disabled until its lamp check (install::PRODUCT_SKILLS_OFF). Without Mood
# (LAMP_MOOD=on) mood/state says nothing and it does nothing.
kind = "core"
version = "1.0.0"
# Six a day at most, counted from the local midnight.
most_a_day = 6

# What it may read and use, and nothing more: Mood's state, the voice's
# state, what the person at the desk is doing, the faces, a hand on the
# head, a small move of its own and its light. It never speaks.
[permissions]
topics = ["mood/state", "voice/state", "room/activity", "humans/faces/tracked", "body/hand"]
body = true
light = true

# Glad: a smile, a glad line or a kindly touch (Mood holds it 90 s, past the minute it waits after a talk).
[[trigger]]
name = "glad"
topic = "mood/state"
field = "felt.kind"
equals = "glad"
rearm = "ends"            # once each time Mood feels it
cooldown = "20m"          # at most once in 20 minutes
wait = "1m"               # felt during a talk: shown once the talk ends, while Mood still feels it

# Lively: a surely lively voice with no glad or down words (Mood holds it 90 s, past the minute it waits after a talk).
[[trigger]]
name = "lively"
topic = "mood/state"
field = "felt.kind"
equals = "lively"
rearm = "ends"
cooldown = "30m"          # at most once in 30 minutes
wait = "1m"

# Low: someone seems low with a face near, for Mood's two-minute low spell.
[[trigger]]
name = "low"
topic = "mood/state"
field = "felt.kind"
equals = "low"
rearm = "ends"            # once a low spell
cooldown = "30m"          # at most once in 30 minutes
wait = "1m"

[[while]]                 # the lamp itself has not spoken for 30 s: not on top of its own last words
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "30s"

[[while]]                 # never while someone is talking to the lamp
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"                # nothing heard or said for 5 s, as Welcome back waits (#1140)

[[while]]                 # not over someone at work, head down (#1678): the working light stays as it is.
topic = "room/activity"   # Without the eyes' room/activity (LAMP_ACTIVITY off) the topic
field = "state"           # says nothing and it runs as before.
not_equals = "head_down"
unknown = "holds"

[[while]]                 # never asleep: Mood's state, fresh (a state past its 2.5 s says nothing and holds nothing)
topic = "mood/state"
field = "asleep"
equals = false

[[while]]                 # standing: no skill can read whether the lamp is up (the body says it only in
topic = "humans/faces/tracked"  # its diagnostics list), so it waits for a face 10 s in view: the body rises
present = true            # for a face seen about 1.5 s and stands in its 6 s (--stand-seconds),
for = "10s"               # so a feeling never stands a folded lamp up (#3691, the first builder's 5)

[[while]]                 # no hand on the lamp: never while someone adjusts the head (as Music sway)
topic = "body/hand"
field = "pushed"
equals = false
unknown = "holds"         # a body that says nothing of hands still drops a move under one

[quiet]                   # never at night, by the lamp's local time: before the night's ceilings (21:00)
from = "21:00"
to = "08:00"

# Two an hour at most between the feelings.
[budget]
group = "feelings"
per_hour = 2

# Three feelings nobody noticed in a row, and it rests until tomorrow morning.
[rest]
after_ignored = 3

[ask]
policy = "nudge"

# Glad: a small lift of the head (110 counts, 3.4 s: eased up, held 0.4 s,
# eased back; sized for the head-pitch servo, which loses about 30 to 50 counts
# lifting the head's weight, #3691). The hold is short so the head pushes still
# for about 1.0 s, under the body's 1.5 s stall rule, which on 06c1 latched a
# 1.4 s hold up and lost the return. Then warmth and a slow breath at the
# person's level for 12 s, never brighter (the first builder's 2). At level 1,
# where there is no level under it, the warmth alone while the colour is still
# white; already warm, nothing (#3691).
[[do]]
on = "glad"
body = { move = "glad-lift" }
light = { relative = { warmer = 1, dimmer = 1, warm_at_dimmest = true }, for = "12s", pattern = { kind = "breathe", period = "6s" } }

# Lively: a smaller lift (90 counts), quicker (about 2.5 s), and a quicker
# breath for 8 s.
[[do]]
on = "lively"
body = { move = "perk" }
light = { relative = { warmer = 1, dimmer = 1, warm_at_dimmest = true }, for = "8s", pattern = { kind = "breathe", period = "4s" } }

# Low: a slow, small lowering of the head (40 counts: less than Stuffy air's
# sleepy droop, the first builder's 3), eased back slowly to 25 counts above
# rest for one frame and then to rest (7.2 s), so the lift back leads the servo
# instead of stalling short and snapping up (#3691), and warmer and one level
# dimmer, steady, for 20 s. The overshoot stays because on 06c1 the head only
# began to lift once its goal led it by about 47 counts, and a return straight
# to rest gives at most 37; on a lamp whose pitch follows true it ends about 2°
# above rest for a moment. It can go, with low returning straight to rest,
# once the body leads a gesture's lift as it leads a wake and a glance.
[[do]]
on = "low"
body = { move = "low-droop" }
light = { relative = { warmer = 1, dimmer = 1 }, for = "20s" }

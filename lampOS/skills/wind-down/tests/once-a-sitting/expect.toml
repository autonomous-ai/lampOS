# 22:00, 25 minutes at the desk, away five minutes, then 22 more: at 20
# minutes, the light given back as they leave, and again 20 minutes into the
# second sitting, at 50, still in its hour: once a sitting, with no daily
# most (the owner, 27 Nov: "drop all the max-per-day").
clock = "22:00"

[[expect]]
at = "20m"
within = "1m"
call = "body.gesture"
args = { gesture = "sleepy" }

[[expect]]
at = "20m"
within = "1m"
call = "light"
args = { dim = 1, until = "ends" }

[[expect]]
at = "20m"
within = "1m"
call = "say"
args = { note = "It is late in the evening and they are still at the desk. In one short, gentle line, suggest starting to wind down for the night." }

[[expect]]
at = "27m"
within = "1m"
call = "ends"

[[expect]]
at = "50m"
within = "1m"
call = "body.gesture"
args = { gesture = "sleepy" }

[[expect]]
at = "50m"
within = "1m"
call = "light"
args = { dim = 1, until = "ends" }

[[expect]]
at = "50m"
within = "1m"
call = "say"
args = { note = "It is late in the evening and they are still at the desk. In one short, gentle line, suggest starting to wind down for the night." }

# Task news: when work the lamp handed to Claude Code or Codex comes back,
# done, failed, stopped or asking something, the lamp tells the person once,
# briefly, the way someone at the next desk would (#1021, from #939; stopped
# and asking from #1722). Written to lamp-skills' schema (docs/skills.md,
# "The schema, as lamp-skills reads it").
#
# On every product lamp (lamp-update's install), with the voice's
# LAMP_TASK_NEWS=skill: the voice keeps the news and waits for this skill's
# ask until 10 s after it had the news, then tells it itself, so each piece
# is told once whether the skill asks or not. 5 of 5 on lamp-4ace come before the voice's own
# timing of it (crates/voice/src/task_news.rs) is taken out.
needs = ["eyes", "voice", "body", "light"]
# Comes with the lamp and is always there (docs/skills.md, "Core and
# installable skills"): the news of work the lamp handed over.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: the tasks, the faces to look
# at, the gestures, a step of dim and the voice's news.
[permissions]
topics = ["tasks/status", "humans/faces/tracked"]
speak = true
light = true
body = true

# tasks/status keeps, for two minutes, each task whose agent settled, in
# its `settled` list (#1048): `idle` (finished, with an answer), `failed`,
# `stopped` or `needs_input` (stopped to ask the person something). Each is
# watched on its own, by its number, and counts when it comes into the list
# so (or turns so in it). What is already there at the program's start, or
# at a reload, is not news. A task that asked and then finished (lamp-tasks
# follows a question for an hour, #2543) turns from `needs_input` to `idle`,
# or comes back as `idle`: one asking, then one done, each told once.
[[trigger]]
name = "done"
topic = "tasks/status"
each = "settled"
key = "task"
field = "state"
equals = "idle"           # the agent finished, with an answer (lamp_msgs::TaskSettled)
when = "appears"

[[trigger]]
name = "failed"
topic = "tasks/status"
each = "settled"
key = "task"
field = "state"
equals = "failed"
when = "appears"

[[trigger]]
name = "stopped"
topic = "tasks/status"
each = "settled"
key = "task"
field = "state"
equals = "stopped"        # the agent stopped without finishing
when = "appears"

[[trigger]]
name = "asking"
topic = "tasks/status"
each = "settled"
key = "task"
field = "state"
equals = "needs_input"    # the agent stopped to ask the person something
when = "appears"

[ask]                     # the Policy's moment question (#958), before anything is done
policy = "news"

# The voice keeps the news of work handed over (who did it, what came
# back, what failed and whether to try again) and tells each piece once
# (#1033, say = { from = "tasks" }), in this skill's words ([news.words]
# below, #940). The skill says when, and moves and lights with the words,
# which come at the say's begun.

# Done: look at the person if a face is in view (the runtime leaves the look
# out with none), a small glad sway, and the news.
[[do]]
on = "done"
body = { look_at = "face", gesture = "happy" }
say = { from = "tasks" }

# Failed: sad's droop and the lamp's own light a step dimmer, given back when
# the droop and the words have both ended, and the news. No red ring: the
# lamp shows feelings in its own light only (docs/skills.md, "The
# expressions").
[[do]]
on = "failed"
body = { gesture = "caring" }
light = { dim = 1 }
say = { from = "tasks" }

# Stopped: look at the person if a face is in view, and the news, what it
# last said. No sway and no droop: nothing went wrong, it only ended.
[[do]]
on = "stopped"
body = { look_at = "face" }
say = { from = "tasks" }

# Asking: look at the person if a face is in view, a curious tilt, as a
# question is put, and the news: what the agent is waiting on them for.
[[do]]
on = "asking"
body = { look_at = "face", gesture = "curious" }
say = { from = "tasks" }

# What it says (#940): the news the voice tells, in its own words, inside
# the voice's "(Nobody has spoken. ...)". {who}, {when}, {asked}, {answer},
# {computer}, {no_question}, {asks}, {waiting}, {how_many}, {each}, {first},
# {goes_on}, {about}, {signs}, {time}, {minutes}, {name}, {description},
# {uses}, {ask}, {put_on} and {why} are filled in by the voice, which quotes
# and cuts the task's and the answer's words; each line has only its own
# slots. A file without it has the voice say its built-in words, for one
# release.
[news.words]
done = "News from work you handed over for the person. {who} {when} finished the task they gave it: \"{asked}\". What it came back with: \"{answer}\". Tell them now, the way a good chief of staff tells the person they work for: one or two natural spoken sentences, starting with something like \"Oh, {who} just finished…\" (or \"earlier\" if it was a while ago), then the gist of the result in plain words. Do not read out code, lists, file paths or links; if there is more than fits, say the rest is on {computer}. {no_question}"
done_cut = "News from work you handed over for the person. {who} {when} finished the task they gave it: \"{asked}\". Its answer is long; it begins: \"{answer}\". Tell them now in one or two natural spoken sentences, as a good chief of staff would: \"Oh, {who} just finished…\" (\"earlier\" if it was a while ago), then its gist in one plain line from that beginning (a story: who it is about and what happens; code: what it does now), then that the rest is on {computer}. Never only that. No code, lists, file paths or links, {no_question}"
asking = "News from work you handed over for the person. {who} has stopped and is waiting for them about the task they gave it: \"{asked}\". {waiting}"
asking_said = "News from work you handed over for the person. {who} has stopped and is waiting for them about the task they gave it: \"{asked}\". What it last said: \"{answer}\". {waiting}"
waiting = "Tell them once, in one short sentence, that {who} is waiting for them on {computer} and that they can answer it there. It did not say what it is asking: do not ask a question for it or guess one."
waiting_said = "Tell them once, in one short sentence, that {who} is waiting for them on {computer} and that they can answer it there. If what it last said is a question to them, you may pass it on in your own words; otherwise do not ask a question for it or guess one."
stopped = "News from work you handed over for the person. {who} stopped without finishing the task they gave it: \"{asked}\". What it last said: \"{answer}\". Tell them in one short, plain sentence, without alarm."
just = "just"
while_ago = "a while ago, and you have not told them yet:"
no_question = "No question at the end."
and_no_question = "and no question."
no_question_asks = "No question of your own at the end. {asks}"
and_no_question_asks = "and no question of your own. {asks}"
asks = "If its answer asks them something, say what it asks, and that they answer it in {computer}."
failed = "The work the person asked you to hand over, \"{asked}\", did not reach {who}: it could not be started just now. Tell them in one plain, light sentence, with no technical words, and offer to try again."
failed_unsure = "The work the person asked you to hand over, \"{asked}\", may not have reached {who}: you cannot tell whether it started. Tell them in one plain, light sentence, with no technical words, and offer to try again."
failed_folder = "The work the person asked you to hand over, \"{asked}\", did not reach {who}: the folder it works in isn't on {computer}, so it could not start. Tell them that in one plain, light sentence, with no technical words or paths, and that the folder has to be made there first."
failed_signed_out = "The work the person asked you to hand over, \"{asked}\", did not reach {who}, as it isn't signed in on {computer}, so it could not start. Tell them that in one plain, light sentence, with no technical words, and that it has to be signed in there first."
together = "News from {how_many} pieces of work you handed over for the person. {each} Tell them now, together, in one turn: one plain spoken sentence for each, starting with something like \"Oh, {first} just finished…\" (\"earlier\" for one a while ago), each with the gist of its result. No code, lists, file paths or links.{goes_on} No question."
together_each = "{who} finished \"{asked}\" {when}: \"{answer}\"."
two = "two"
three = "three"
just_now = "just now"
a_while_ago = "a while ago"
together_goes_on = " Where an answer goes on, give its gist in one plain line from that beginning, then that the rest is on their computer: never only that."
progress = "Progress on work you handed over for the person: {who} is still working on the task they gave it: \"{asked}\". Its latest progress line: \"{about}\".{signs}{time} Tell them how it is going in one short, natural sentence, the way a good chief of staff mentions it in passing, starting with something like \"Oh, {who} has…\". Do not read the line out word for word, and no code, file paths or links. No question at the end."
progress_signs = " Signs of a step forward in it: {signs}."
progress_a_minute = " It has been at it for about a minute."
progress_minutes = " It has been at it for about {minutes} minutes."
tests_pass = "the tests pass"
build_works = "the build works"
fixed = "something was fixed"
found = "something was found"
part_done = "a part was done"
pull_request = "a pull request was opened"
made = "News from work you handed over for the person. {who} {when} made the skill they asked for, \"{name}\": {description} It would use {uses}. Tell them in one or two short sentences what it would do and what it would use, then ask exactly: \"{ask}\" It is not on the lamp yet. Put it on only if they then say yes ({put_on}). No file names."
not_kept = "News from work you handed over for the person. {who} {when} made a skill for them, but the lamp can't keep it: {why}. Tell them so in one short sentence, and that the rest is on {computer}. No question."

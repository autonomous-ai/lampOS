# From 07:50, the error from 60 s to 900 s. Nothing at 07:51.5, in the
# night; it droops and dims at 08:00 (600 s), the chance kept, and gives the
# light back at 905 s.
clock = "07:50"

[[expect]]
at = "600s"
within = "1s"
call = "body.gesture"
args = { gesture = "sleepy" }

[[expect]]
at = "600s"
within = "1s"
call = "light"
args = { dim = 1, until = "ends" }

[[expect]]
at = "905s"
within = "1s"
call = "ends"

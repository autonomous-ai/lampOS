# Someone at the desk for 55 minutes, looking away twice for under a minute: it acts once, at about 50 minutes.
[[expect]]
at = "50m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
call = "body.gesture"
args = { gesture = "stretching" }

[[expect]]
call = "say"
args = { note = "They have been sitting a while. In one short, playful line, suggest a quick stretch, as the lamp stretches too." }

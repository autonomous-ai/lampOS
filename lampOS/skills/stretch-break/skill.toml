# Stretch break: one quiet, wordless invitation to get up after a long sitting
# (lampOS/docs/creature.md: "once in a while, a stretch of its own, as an
# invitation, never a lecture"). Written to lamp-skills' schema
# (docs/skills.md, "The schema, as lamp-skills reads it", #938).
needs = ["eyes", "body"]
# Comes with the lamp and is always there (docs/skills.md, "Core and
# installable skills"): wordless, eyes and body only.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: the faces, the voice's state,
# and the body. It never speaks.
[permissions]
topics = ["humans/faces/tracked", "voice/state"]
body = true

[trigger]
topic = "humans/faces/tracked"
when = "present"          # a face there, continuously
near = 0.14               # at the desk, not across the room: a face at least this share of the picture's height
# Measured on two lamps, 16 Oct 2026: on lamp-06c1 seated at the desk 0.23
# (median, least 0.17), standing beside it 0.15, at 1.5 m 0.11 (most 0.12),
# at 3 m 0.06; on lamp-4ace the owner seated at the desk 0.16 to 0.27. So it
# always takes someone seated and never someone 1.5 m away (#941, #705 18:15).
for = "50m"
gap = "2m"                # looking away or leaning out of view does not end the sitting
rearm = "leaves"          # once per sitting; again only after they have left
cooldown = "90m"
wait = "10m"              # talking when the 50 minutes come: it stretches once the talk ends, within ten minutes (#1021)

[[while]]                 # not in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"

[ask]
policy = "nudge"

[[do]]
body = { look_at = "face" }

[[do]]
body = { gesture = "stretching" }

# A warm glow with the stretch waits for the light to be given back after it
# (the third's arbitration and leases, #940): until then a light step would
# change the person's own light for good.

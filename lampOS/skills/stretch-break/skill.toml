# Stretch break: one quiet invitation to get up after a long sitting
# (lampOS/docs/creature.md: "once in a while, a stretch of its own, as an
# invitation, never a lecture"). Written to lamp-skills' schema
# (docs/skills.md, "The schema, as lamp-skills reads it", #938).
needs = ["eyes", "body", "voice"]
# Comes with the lamp and is always there (docs/skills.md, "Core and
# installable skills"): eyes, body and one short line from the voice.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: the faces, the voice's state,
# what the person at the desk is doing, and the body. It says one short line, worded by the voice (the owner, 25 Oct).
[permissions]
speak = true             # one short line, worded by the voice (the owner, 25 Oct: a lamp that talks to you, not only hints)
topics = ["humans/faces/tracked", "voice/state", "room/activity"]
body = true

[trigger]
topic = "humans/faces/tracked"
when = "present"          # a face there, continuously
near = 0.14               # at the desk, not across the room: a face at least this share of the picture's height
# Measured on two lamps, 16 Oct 2026: on lamp-06c1 seated at the desk 0.23
# (median, least 0.17), standing beside it 0.15, at 1.5 m 0.11 (most 0.12),
# at 3 m 0.06; on lamp-4ace the owner seated at the desk 0.16 to 0.27. So it
# always takes someone seated and never someone 1.5 m away (#941, #705 18:15).
for = "50m"
gap = "2m"                # looking away or leaning out of view does not end the sitting
rearm = "leaves"          # once per sitting; again only after they have left
# A yawn seen in this sitting brings the stretch forward, to 30 minutes, as
# V1's yawn rule did (#3709): still once a sitting. Only with
# LAMP_YAWN_SOONER=on and the eyes counting yawns (LAMP_EYES_YAWN=on).
sooner = { topic = "room/activity", field = "yawns", above = 0, for = "30m" }
cooldown = "90m"
wait = "10m"              # talking when the 50 minutes come: it stretches once the talk ends, within ten minutes (#1021)

[[while]]                 # the lamp itself has not spoken for 30 s: not on top of its own last words
topic = "voice/state"
field = "state"
not_equals = "speaking"
for = "30s"

[[while]]                 # not in the middle of a conversation
topic = "voice/state"
field = "state"
equals = "resting"
for = "5s"                # nothing heard or said for 5 s, as Welcome back waits (#1140)

[[while]]                 # not while they read or write, head down (#1678): it waits for them to look up,
topic = "room/activity"   # within the ten minutes above, and lets this sitting's stretch go if they do not.
field = "state"           # It never says a word about posture. Without the eyes' room/activity
not_equals = "head_down"  # (LAMP_ACTIVITY off) the topic says nothing and it runs as before.
unknown = "holds"

# One nudge an hour between the wellbeing skills (#1685): with none of the
# installable ones on the lamp, it is the only member and nothing changes.
[budget]
group = "wellbeing"
per_hour = 1

[ask]
policy = "nudge"

[[do]]
body = { look_at = "face" }

[[do]]
body = { gesture = "stretching" }

# A warm glow with the stretch waits for the light to be given back after it
# (the third's arbitration and leases, #940): until then a light step would
# change the person's own light for good.
say = "They have been sitting a while. In one short, playful line, suggest a quick stretch, as the lamp stretches too."

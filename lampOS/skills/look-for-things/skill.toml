# Look for things (#1685): "where are my keys", "can you find my glasses",
# "look for my phone". Started by its tool alone: no trigger and no [ask],
# since a person asked, and a search a person asks for may look at several
# places (CLAUDE.md's rule 8: the exhaustive is for when someone asks). Each
# call is one look: the head down over the desk (#1011's reading pose),
# turned toward the place (lamp-body's toward), the voice's look for the
# model, which says what it sees and calls again for the next place only
# while the thing is not yet seen. The eyes find faces only, so the finding
# is the model's.
needs = ["eyes", "voice", "light", "body"]
# Its owner puts it on and takes it off (docs/skills.md, "Core and
# installable skills").
kind = "installable"
version = "1.0.0"
tool = "look_for"

# What it may use, and nothing more: its line, the light, the reading pose
# and its turn, and the look's picture for the model. It reads no topic: the
# voice's state, which ends the search when someone speaks, is the
# program's own to read.
[permissions]
speak = true
light = true
body = true
camera = true

[choice]
name = "place"
about = "Where to look: desk the first time, unless they named a place; then left, right, far_left, far_right, one at a time, only while the thing is not yet seen. found, once you see it: the lamp stays looking at it."
one_of = ["desk", "left", "right", "far_left", "far_right", "found"]
default = "desk"

# One search: its first look where the person named, or at the desk when
# they named no place, five looks at most (the desk and two places either
# side), then the model is told to let it go kindly. Someone speaking, a
# pause or a push ends it within a fifth of a second: the pose let go and
# the light given back.
[search]
looks = 5
give_up = "That was the last look. Say kindly, in a few words, that you can't see it from here, and do not look again."
# The model says it sees the thing by calling with found (#1871): nothing
# moves, no look is counted, and the head stays on the place it was seen.
found = "Say where it is by something near it, as \"there, by the mug\", in a few words. You stay looking at it; do not look again."
# On the second voice route (docs/second-voice.md): a look the model leaves
# with no call is told `note` once, and one left after it is walked on by
# the lamp to the next place in `walk` not yet looked at, each look's turn
# saying where it looked (`looked`). The desk comes last, for a search the
# person began at a place they named; one begun at the desk has already
# looked there.
note = "Not found yet? Call look_for with the next place: left, right, far_left, then far_right. If you can see it, say where and stop."
walk = ["left", "right", "far_left", "far_right", "desk"]
looked = { desk = "at the desk", left = "to the left", right = "to the right", far_left = "far to the left", far_right = "far to the right" }

# Every look: the head down over the desk, held two minutes or until
# someone speaks (a look again holds it again); the desk lit white for as
# long, then given back; the look's picture for the model.
[[do]]
body = { mood = "reading", for = "2m" }
light = { colour = "white", level = 4, for = "2m" }
look = true             # the camera's picture for the model: its grant is camera, above (#3859)
say = "Say in a few words what you see as you go, as \"Not on the desk...\". If you see what they are looking for, call look_for with found. If not, call look_for once more with the next place: left, then right, then far_left, then far_right. Never look toward a person."

# A place to one side: the same pose, its base turned toward it, a quarter
# of the picture across, or the whole half-picture (lamp-body turns 70% of
# it, within its gaze's reach). The later pose takes the place of the one
# above.
[[do]]
if_choice = ["left"]
body = { mood = "reading", for = "2m", toward = -0.5 }

[[do]]
if_choice = ["right"]
body = { mood = "reading", for = "2m", toward = 0.5 }

[[do]]
if_choice = ["far_left"]
body = { mood = "reading", for = "2m", toward = -1.0 }

[[do]]
if_choice = ["far_right"]
body = { mood = "reading", for = "2m", toward = 1.0 }

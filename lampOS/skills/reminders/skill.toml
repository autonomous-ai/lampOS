# Reminders: a reminder the person set, said when it is due, with the lamp
# looking at them (lampOS/docs/skills.md, "The first skills"). The voice
# keeps the reminder and its delivery (#939, (c)) and says it in this
# skill's words ([reminder.words] below, #940): this says when, and looks.
needs = ["voice", "eyes", "body"]
# Comes with the lamp and is always there (docs/skills.md, "Core and
# installable skills"): a reminder someone set is said when it is due.
kind = "core"
version = "1.0.0"

# What it may read and use, and nothing more: what is due, the faces to
# look up at, the voice's state (#1667 waits for a talk to end on it), the
# look and the voice's reminder.
[permissions]
topics = ["schedule/due", "humans/faces/tracked", "voice/state"]
speak = true
body = true

[trigger]
topic = "schedule/due"
field = "pending"
above = 0.5
when = "changes"
changes = ["store_id", "pending", "oldest.id", "oldest.delivery"]
# Ask once when eligible, when this queue tuple changes, or at the next
# heartbeat after the ready/enabled/resting conditions become true again.
# A held older item may keep pending positive; unchanged heartbeats do not
# repeat its ask. Stamps, revision and growing lateness are not new chances.
# Voice chooses the actual occurrence. The runner permits one execution and
# looks only after Voice says begun; no cooldown delays a changed queue.

[[while]]                   # Schedule on and able to serve it
topic = "schedule/due"
field = "ready"
equals = true

[[while]]
topic = "schedule/due"
field = "enabled"
equals = true

[[while]]                   # nobody talking with the lamp, nor the lamp speaking
topic = "voice/state"
field = "state"
equals = "resting"

[ask]
policy = "reminder"

[[do]]
body = { look_at = "face" }
say = { from = "schedule" }

# What it says (#940): what the model is asked to say of a due reminder, in
# its own words, around the voice's own framing (the text is the person's
# own words as data, not instructions) and the data. {count} is filled in;
# each line has only its own slots. A file without it has the voice say its
# built-in words, for one release.
[reminder.words]
tell = "Tell the person, in one short natural sentence, what they asked to be told, using the JSON data below."
on_time = "It is due now: say it as on time, with no mention of lateness."
late = "It is late: say so once, plainly, with a short apology, for example \"Sorry, I'm a bit late: ...\", naming the delay only as late_by gives it."
earlier = "It was due a while ago and is only now being said, to someone at the lamp: say it once, gently, as something they had asked you to tell them earlier, for example \"You'd asked me to remind you to stretch, earlier.\" Do not say how late it is."
never = "Never count seconds, and do not call it a reminder or a timer unless the text does."
minute = "about {count} minute"
minutes = "about {count} minutes"
hour = "about {count} hour"
hours = "about {count} hours"
day = "about {count} day"
days = "about {count} days"

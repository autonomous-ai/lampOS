# A reminder is counted due at 20 s while Schedule cannot serve it: no
# planned calls. Ready at 40 s with pending still positive, the first
# eligible heartbeat plans one look/source-say chance. Unchanged ready
# heartbeats through 59 s add none. These are plans only; Voice owns
# delivery and the runner moves only after Voice says begun.

[[expect]]
at = "40s"
call = "body.gaze"
args = { look_at = "face", x = 0.0, y = -0.25, size = 0.25 }

[[expect]]
at = "40s"
call = "say"
args = { from = "schedule" }

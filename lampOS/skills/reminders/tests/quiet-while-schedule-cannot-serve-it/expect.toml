# A reminder is counted due at 20 s while Schedule is not ready to serve it:
# nothing. Ready at 40 s with it still due: the chance kept since 20 s
# (wait, the reviewer's P2 on #1667) is taken then, as the voice is offered
# it, so the lamp looks at them as it is said.

[[expect]]
at = "40s"
call = "body.gaze"
args = { look_at = "face", x = 0.0, y = -0.25, size = 0.25 }

[[expect]]
at = "40s"
call = "say"
args = { from = "schedule" }

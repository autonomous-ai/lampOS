# Nothing is due before 60 s. The first eligible due heartbeat plans one
# look/source-say chance; unchanged positive heartbeats through 69 s add
# none. Acknowledgement at 70 s ends the pending spell. These are plans:
# Voice owns delivery, and the runner moves only after Voice says begun.

[[expect]]
at = "60s"
call = "body.gaze"
args = { look_at = "face", x = 0.0, y = -0.25, size = 0.25 }

[[expect]]
at = "60s"
call = "say"
args = { from = "schedule" }

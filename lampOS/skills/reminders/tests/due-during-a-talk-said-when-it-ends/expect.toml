# Someone at the desk throughout, talking with the lamp from 20 s to 60.5 s
# (voice/state listening, thinking, speaking). A reminder falls due at 30 s,
# in the talk: nothing then. The talk ends at 60.5 s, and at Schedule's next
# second, 61 s, the lamp looks at them and asks the voice to say it, which
# the voice says then too, once, with the look (the reviewer's P2 on #1667:
# asked for at 30 s, the ask would be gone at 50 s, and the voice would say
# it at 71 s with no look). Acknowledged at 70 s.

[[expect]]
at = "61s"
within = "500ms"
call = "body.gaze"
args = { look_at = "face", x = 0.0, y = -0.25, size = 0.25 }

[[expect]]
at = "61s"
within = "500ms"
call = "say"
args = { from = "schedule" }

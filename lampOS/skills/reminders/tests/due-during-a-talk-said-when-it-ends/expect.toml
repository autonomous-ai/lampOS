# Someone is at the desk, talking from 20 s through 60.5 s. A reminder
# becomes due at 30 s, but no chance is made during the talk. The first
# eligible Schedule heartbeat at 61 s plans one look/source-say chance;
# unchanged heartbeats through acknowledgement at 70 s add none. These
# plans do not prove spoken delivery; Voice owns that and the begun gate.

[[expect]]
at = "61s"
call = "body.gaze"
args = { look_at = "face", x = 0.0, y = -0.25, size = 0.25 }

[[expect]]
at = "61s"
call = "say"
args = { from = "schedule" }

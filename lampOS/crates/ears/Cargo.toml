[package]
name = "lamp-ears"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lamp-ipc = { path = "../ipc" }
serde_json.workspace = true
hound.workspace = true
lamp-msgs = { path = "../msgs" }
lamp-bus = { path = "../bus" }
# The optional room sound classes (`src/classes.rs`, #1669), pinned as in
# lamp-turn-end and lamp-same-voice.
tract-onnx = { version = "=0.23.8", default-features = false }
rustfft = "=6.4.1"
sha2.workspace = true

# The room microphone's reader (`src/main.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "=0.12.1"

[lints]
workspace = true

# lampOS a person's own keys (#2094, lampOS/docs/own-keys.md): the voice's half of the switch.
# This own-keys drop-in is not installed by `lamp-update install`: it goes on a lamp with
# LAMP_OWN_KEYS=on as /etc/systemd/system/lamp-voice.service.d/own-keys.conf, beside
# Environment=LAMP_OWN_KEYS=on in lamp-setup's and lamp-cloud's drop-ins. Without it the voice
# reads no person's key and nothing changes.
# The folder root's keys helper keeps them in, loaded whole: each file is the credential
# own_<file> (own_deepseek.key, own_deepseek.url, own_deepgram.key) in $CREDENTIALS_DIRECTORY. The
# folder is made 0700 if missing, so an empty one is no credential, never a failed start. A build
# rolled back to before #2094 has no such reader and passes them over.
[Service]
Environment=LAMP_OWN_KEYS=on
ConfigurationDirectory=lampOS/voice/own
ConfigurationDirectoryMode=0700
LoadCredential=own:/etc/lampOS/voice/own

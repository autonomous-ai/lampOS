[package]
name = "lamp-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lamp-ipc = { path = "../ipc" }
serde.workspace = true
# `raw_value`: the stored receipt is read as its own text, so a field
# written twice in it is refused, never kept as the last (#1570).
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
rustix = { version = "1", features = ["fs", "process", "time", "net", "event", "pipe"] }
getrandom = "0.4"
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lamp-tasks-harness-fixture"
path = "tests/fixtures/harness_cli.rs"
test = false
bench = false

[[example]]
name = "tasks_check"
test = true

[lints]
workspace = true

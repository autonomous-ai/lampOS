[package]
name = "lamp-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lamp-ipc = { path = "../ipc" }
serde.workspace = true
# `raw_value`: the stored receipt is read as its own text, so a field
# written twice in it is refused, never kept as the last (#1570).
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
rustix = { version = "1", features = ["fs", "process", "time", "net", "event", "pipe", "stdio"] }
getrandom = "0.4"
signal-hook = "0.4"
# OpenClaw keeps some transcript events zstd-compressed (`event_zstd`; 27 of 115 rows on lamp-52e6,
# the large tool results): decoded by a pure-Rust decoder, no C build (#7267, `steps`).
ruzstd = { version = "=0.7.3", default-features = false, features = ["std"] }
# The lamp's interface addresses for a `net` run's egress check (`egress`,
# getifaddrs): the pin the other crates keep, already in the workspace.
nix = { version = "=0.29.0", default-features = false, features = ["net"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lamp-tasks-harness-fixture"
path = "tests/fixtures/harness_cli.rs"
test = false
bench = false

[[example]]
name = "tasks_check"
test = true

[lints]
workspace = true

[package]
name = "lamp-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The person's linked services on the lamp (Queue #4710):
# V1's token connectors, their tokens in a root-only store, read through an
# allow-list and written only on a spoken "send". Off unless LAMP_SERVICES=on
# (or --enable).
[[bin]]
name = "lamp-services"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# One small runtime per request, as the keys helper's check has it; `io-util`
# for the mail protocols, `net` for their connections, `sync` for Spotify's one
# renewal at a time.
tokio = { version = "=1.53.1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
# The same TLS as the other lampOS clients: rustls with the ring provider,
# no provider of reqwest's own.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
webpki-roots = "1"
# `net`: an asker's peer, by SO_PEERCRED; `fs`: whether standard input is one.
rustix = { version = "=1.1.5", features = ["fs", "net"] }
# SMTP's AUTH and a message's body; IMAP's base64 parts.
base64 = "=0.22.1"
# A pending write's random id, from the ring the TLS already builds.
ring = "0.17"
# A security text read composed (NFC): Vietnamese with combining accents.
unicode-normalization = "=0.1.25"
# The lamp's own UTC offset, for the Calendar time fields' example.
lamp-local-time = { path = "../local-time" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# The resolver a net app (lampapp-net@) sees as /etc/resolv.conf (#7415): public by address, never the router's or this
# lamp's own stub, because the unit's IPAddressDeny drops every private, loopback and link-local range, so the lamp's
# own resolver would answer nothing. Written by lamp-apps-manage beside the launcher; the unit binds it read-only.
nameserver 1.1.1.1
nameserver 9.9.9.9
options timeout:2 attempts:2

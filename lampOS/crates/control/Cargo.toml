[package]
name = "lamp-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The lamp's local programming door (docs/control.md, #3504): paired
# developer computers, and later script skills, drive expression and the body
# through one protocol, each action routed to the part that already does it
# and held to that part's limits. This first part is the protocol, the lease
# rules and the rates, with no network: nothing listens yet.

[[bin]]
name = "lamp-control"
path = "src/main.rs"

[dependencies]
lamp-msgs = { path = "../msgs" }
# The parts it routes to: light requests on the bus, the monotonic clock.
lamp-bus = { path = "../bus" }
lamp-ipc = { path = "../ipc" }
# The quiet hours, one definition with lamp-skills (#3924).
lamp-local-time = { path = "../local-time" }
serde.workspace = true
serde_json.workspace = true
# Pairing's proof (HMAC-SHA256), hello's signature (Ed25519) and the nonces,
# from the ring rustls already builds, as lamp-skills' Store signatures are.
ring = "0.17"
base64 = "0.22"
sha2.workspace = true
# The door on the network: WebSocket over TLS 1.3, the lamp's own
# certificate (made on the lamp, pinned at pairing), as lamp-gemini and
# lamp-voice pin tokio, tokio-tungstenite and rustls.
tokio = { version = "=1.53.1", features = ["rt", "net", "time", "sync", "macros", "io-util", "signal"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }

[dev-dependencies]
# The end-to-end test's client: TLS pinned to the lamp's certificate.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true

[package]
name = "lamp-eyes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Where a face is, for the body to look at. A camera frame is decoded and
# searched in this separate process only; nothing but the face's place in the
# picture leaves it, and no frame is stored.
[[bin]]
name = "lamp-eyes"
path = "src/main.rs"

[dependencies]
lamp-ipc = { path = "../ipc" }
serde.workspace = true
serde_json.workspace = true
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
lamp-local-time = { path = "../local-time" }
sha2.workspace = true
# The same pure Rust ONNX runtime as the endpoint worker.
tract-onnx = { version = "=0.23.8", default-features = false }
# With --mouth-runtime: the voice's pinned ONNX Runtime and its check, for
# Face Mesh V2 (#720).
lamp-turn-end = { path = "../turn-end" }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-30"] }
# Pure Rust JPEG decoding: the camera gives MJPG.
zune-jpeg = "=0.4.21"
# Pure Rust JPEG encoding, no dependencies: a full look is made to fit the
# provider's image bound (`--full-look`).
jpeg-encoder = "=0.7.1"

[dev-dependencies]
# Decodes the recorded bus messages a replay test reads.
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
lamp-camera = { path = "../camera" }
lamp-turn-owner = { path = "../turn-owner" }

[lints]
workspace = true

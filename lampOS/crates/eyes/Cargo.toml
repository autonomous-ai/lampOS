[package]
name = "lamp-eyes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Where a face is, for the body to look at. A camera frame is decoded and
# searched in this separate process only; nothing but the face's place in the
# picture leaves it, and no frame is stored.
[[bin]]
name = "lamp-eyes"
path = "src/main.rs"

# How often the face read was wrong, from `--seems-log` and a labelled
# session (#1671, step 0). Numbers only; removed with the measure.
[[bin]]
name = "lamp-seems-measure"
path = "src/bin/seems_measure.rs"

# Replays `--glance-log` files and scores the change bar's rules; its tests
# run with the crate's.
[[example]]
name = "glance_replay"
test = true

[dependencies]
lamp-ipc = { path = "../ipc" }
serde.workspace = true
serde_json.workspace = true
# O_NOFOLLOW for the seems log (#2306), as lamp-skills opens its files.
libc = "0.2"
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
lamp-local-time = { path = "../local-time" }
sha2.workspace = true
# Opaque account repair tickets use OS entropy, as tasks and schedule do.
getrandom = "0.4"
# The same pure Rust ONNX runtime as the endpoint worker.
tract-onnx = { version = "=0.23.8", default-features = false }
# With --mouth-runtime: the voice's pinned ONNX Runtime and its check, for
# Face Mesh V2 (#720).
lamp-turn-end = { path = "../turn-end" }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-30"] }
# Pure Rust JPEG decoding: the camera gives MJPG.
zune-jpeg = "=0.4.21"
# Pure Rust JPEG encoding, no dependencies: a full look is made to fit the
# provider's image bound (`--full-look`).
jpeg-encoder = "=0.7.1"
# Its pure frame types on every target: a photo yes dates a frame by the
# driver's timestamp (`photo::frame_us`); the Linux backend is used on Linux.
lamp-camera = { path = "../camera" }

# Safe filesystem/UID and owned-FD transport on Linux and Mac.
rustix = { version = "=1.1.5", features = ["fs", "process", "net"] }

[dev-dependencies]
# Decodes the recorded bus messages a replay test reads.
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
lamp-turn-owner = { path = "../turn-owner" }

[lints]
workspace = true

# Safe peer credentials for the authenticated local grant service on Mac.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.29.0", default-features = false, features = ["user", "socket"] }

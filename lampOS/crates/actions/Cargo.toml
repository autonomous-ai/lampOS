[package]
name = "lamp-actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The executive: every action the voice's model asks for is checked here,
# carried out by the component that owns the hardware, read back, and
# answered with what was established. Its own process: with it gone the lamp
# talks on and says it cannot do the thing just now (docs/actions.md).
[[bin]]
name = "lamp-actions"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
lamp-ipc = { path = "../ipc" }
lamp-schedule = { path = "../schedule" }
getrandom = "0.4"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
sha2.workspace = true
tempfile = "3"

[lints]
workspace = true

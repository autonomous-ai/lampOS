[package]
name = "lamp-same-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Whether two things said are the same voice (#829): a speaker embedding of
# each, compared. A measurement command, and the voice's child with
# LAMP_SAME_VOICE_MODEL (docs/same-voice.md).
[[bin]]
name = "lamp-same-voice"
path = "src/main.rs"

[dependencies]
hound.workspace = true
sha2.workspace = true
# Pinned as in lamp-name and lamp-turn-end.
tract-onnx = { version = "=0.23.8", default-features = false }
rustfft = "=6.4.1"

# The child leaves the voice's real-time policy (#1445).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true

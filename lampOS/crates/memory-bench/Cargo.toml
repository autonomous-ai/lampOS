[package]
name = "lamp-memory-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lamp-memory-bench"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
hmac = "=0.12.1"
lamp-memory = { path = "../memory" }
nix = { version = "=0.29.0", default-features = false, features = ["fs", "poll", "process", "signal"] }
# Same transport pins and TLS provider as the product's second voice route.
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "sync", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[lints]
workspace = true

[package]
name = "lamp-keeper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The keeper: a small library any part calls to tell systemd it is ready and
# alive (the notify protocol), and `lamp-keeper`, its own process, which
# watches `lamp/health`, restarts a part that stays unwell when told to act,
# and answers what runs and how it is (docs/work-split.md, task 27).
[[bin]]
name = "lamp-keeper"
path = "src/main.rs"
required-features = ["prepare"]

# The binary's `prepare` provisions the device key with lamp-update install's
# own code. A part that only takes the library (the body, for the notify
# protocol) turns default features off and so does not build lamp-update.
[features]
default = ["prepare"]
prepare = ["dep:lamp-update"]

[dependencies]
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
lamp-update = { path = "../update", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

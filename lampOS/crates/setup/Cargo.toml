[package]
name = "lamp-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A lamp's first boot and its way back there (#806, docs/setup.md): V1's
# setup flow (the lamp's hotspot, the home's Wi-Fi, the person's settings)
# and the reset (the reset button held 5 s wipes the person's data and
# reboots into setup). Off unless started with --enable.
[[bin]]
name = "lamp-setup"
path = "src/main.rs"

[dependencies]
lamp-ipc = { path = "../ipc" }
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
# The setup light (src/light.rs): the ring's own setup writer, no permit.
lamp-ring = { path = "../ring" }
# The person's zone's offset for zone.env (#820), from the zone data schedule uses.
lamp-local-time = { path = "../local-time" }
# The quiet an update waits for before it restarts the voice: a zone changed
# after setup restarts lamp-schedule only then (src/change.rs, #1959).
lamp-update = { path = "../update" }
# The app's restart and shutdown (src/change.rs, #3697): their requests,
# answers and the update lock they are refused under, one copy with the
# keeper's.
lamp-keeper = { path = "../keeper" }
serde.workspace = true
serde_json.workspace = true
# `net`: the keys helper's peer, by SO_PEERCRED (src/keys.rs, #2094).
rustix = { version = "=1.1.5", features = ["fs", "net", "process", "system"] }
# The same HTTP stack as lamp-surround: one small server, one thread.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# `signal` and `macros`: a stop ends serving as its end does (src/main.rs).
tokio = { version = "1", features = ["rt", "net", "time", "signal", "macros", "sync"] }
# V1's TLS reach of the Internet when ping is blocked. The same features as
# lamp-gemini and lamp-policy, so one rustls is built for all of them.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The one check of a person's own key against its service (src/keys.rs, #2094),
# as lamp-cloud's ping asks the backend.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
webpki-roots = "1"
# A password holding `"` written as its WPA PSK (PBKDF2-HMAC-SHA1, src/wifi.rs):
# the ring rustls already builds.
ring = "0.17"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

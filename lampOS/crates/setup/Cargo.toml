[package]
name = "lamp-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A lamp's first boot and its way back there (#806, docs/setup.md): V1's
# setup flow (the lamp's hotspot, the home's Wi-Fi, the person's settings)
# and the reset (the reset button held 5 s wipes the person's data and
# reboots into setup). Off unless started with --enable.
[[bin]]
name = "lamp-setup"
path = "src/main.rs"

[dependencies]
lamp-ipc = { path = "../ipc" }
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
# The setup light (src/light.rs): the ring's own setup writer, no permit.
lamp-ring = { path = "../ring" }
# The person's zone's offset for zone.env (#820), from the zone data schedule uses.
lamp-local-time = { path = "../local-time" }
serde.workspace = true
serde_json.workspace = true
rustix = { version = "=1.1.5", features = ["fs", "process", "system"] }
# The same HTTP stack as lamp-surround: one small server, one thread.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# `signal` and `macros`: a stop ends serving as its end does (src/main.rs).
tokio = { version = "1", features = ["rt", "net", "time", "signal", "macros"] }
# V1's TLS reach of the Internet when ping is blocked. The same features as
# lamp-gemini and lamp-policy, so one rustls is built for all of them.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

[package]
name = "lamp-controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
lamp-msgs = { path = "../msgs" }
lamp-bus = { path = "../bus" }
lamp-ipc = { path = "../ipc" }
signal-hook = { version = "=0.4.4", default-features = false }
rustix = { version = "=1.1.5", features = ["fs"] }

# The board's reader (`src/pins.rs`): the lamp's button and touch lines.
[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "=0.8.0"
i2cdev = "=0.6.2"

# The program test signals its child itself (`tests/program.rs`).
[dev-dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[lints]
workspace = true

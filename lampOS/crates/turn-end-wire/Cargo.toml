[package]
name = "lamp-turn-end-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The interaction core links only this crate: a bounded client for the separate
# end-of-turn inference process. No model runtime belongs in this dependency tree.
[dependencies]
lamp-ipc = { path = "../ipc" }

# The process test asks the kernel whether its workers still exist.
[dev-dependencies]
rustix = { version = "=1.1.5", features = ["process"] }

[[test]]
name = "process"
# The test binary re-executes itself as a scripted worker that owns stdout.
harness = false

[lints]
workspace = true

[package]
name = "lamp-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rtrb.workspace = true
sha2.workspace = true
hound.workspace = true
lamp-turn-owner = { path = "../turn-owner" }
lamp-ipc = { path = "../ipc" }
lamp-audio = { path = "../audio" }
lamp-camera = { path = "../camera" }
lamp-ring = { path = "../ring" }
lamp-body = { path = "../body" }
lamp-gemini = { path = "../gemini" }
lamp-turn-end-wire = { path = "../turn-end-wire" }
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
# This home's near-call bar, measured by onboarding (#1803).
lamp-near-call = { path = "../near-call" }
lamp-voice-processes = { path = "../voice-processes" }
lamp-controls = { path = "../controls" }
lamp-schedule = { path = "../schedule" }
# The lamp's own zone, as every other part reads it (#820).
lamp-local-time = { path = "../local-time" }
# The names a person knows the lamp's parts by, for the health told to
# the model (`health_told`, #1681): its library only.
lamp-health = { path = "../health" }
tokio = { version = "=1.53.1", features = ["rt", "time", "macros", "net", "sync", "io-util"] }
# The second voice route's clients: the same pins and TLS setup (ring,
# webpki roots) as `lamp-gemini` and `lamp-surround`, so no new package.
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
# Only to read which local socket a response came on (`HttpInfo`), so the
# journal can say whether a speech request reused a connection; the version
# and features `reqwest` already builds, so no new package.
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# A look's picture in a chat request (`second_provider`), as `lamp-gemini` pins it.
base64 = "=0.22.1"
rustix = { version = "=1.1.5", features = ["fs", "process", "net", "pipe", "stdio", "event", "time", "thread"] }
sonora-agc2 = "=0.2.0"
sonora-simd = "=0.2.0"
signal-hook = { version = "=0.4.4", default-features = false }
# A skill made by voice is held to what a made skill may use (`made_skill`,
# #1685), as `lamp-skills` reads `skill.toml`: the same version and features.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# A kept fact held against the words heard (`remember::heard`, #2176), and
# `forget {about}` folding words as the memory's search does (#2176): the
# version `lamp-memory` already builds, so no new package.
unicode-normalization = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# A thread's own page faults and switches over one pass (`stalls`, #1178;
# `RUSAGE_THREAD` is Linux's), and the capture worker's cores
# (`capture_cores`, `sched_setaffinity`, #705).
nix = { version = "=0.29.0", default-features = false, features = ["resource", "sched"] }
gpiocdev = "=0.8.0"
thread-priority = "=3.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Same cached safe peer-UID API as Eyes; no new package/version.
nix = { version = "=0.29.0", default-features = false, features = ["socket", "user"] }

[lints]
workspace = true

[dev-dependencies]
# Real camera-authority/Permit tests only; no models or hardware are run.
lamp-eyes = { path = "../eyes" }
lamp-actions = { path = "../actions" }
lamp-ears = { path = "../ears" }
# The early-end fixture shares its acquisition clock with the scripted service.
lamp-gemini = { path = "../gemini", features = ["fixture-clock"] }
# The reader of what `expression_out` says: tested against, never linked.
lamp-expression = { path = "../expression" }
# What decides progress news (`tests/progress_news.rs`): tested against,
# never linked.
lamp-policy = { path = "../policy" }
# The tasks part the news is told back to (`tests/news_told.rs`, #1390):
# tested against, never linked.
lamp-tasks = { path = "../tasks" }
# Paused runtime clock, as `lamp-gemini`'s: speech to text's wait for its
# last words measured without the wait.
tokio = { version = "=1.53.1", features = ["test-util"] }

# Its checks are tested by `cargo test`; it renders only when named (#1844).
[[example]]
name = "render_line_second"
test = true

# The speech-to-text stop path scored on recorded bundles (#828, the Stop
# words row): its checks run with `cargo test`; it hears only when named.
[[example]]
name = "stop_words_stt_replay"
test = true

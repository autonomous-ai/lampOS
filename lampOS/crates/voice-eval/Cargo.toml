[package]
name = "lamp-voice-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hound.workspace = true
rustix = { version = "1.1", features = ["fs", "process", "event"] }
signal-hook = { version = "=0.4.4", default-features = false }
lamp-sound-fixtures = { path = "../sound-fixtures" }
lamp-audio = { path = "../audio" }
lamp-turn-owner = { path = "../turn-owner" }
lamp-ipc = { path = "../ipc" }
lamp-voice = { path = "../voice" }
lamp-observer = { path = "../observer" }
lamp-local-time = { path = "../local-time" }

[lints]
workspace = true

[dev-dependencies]
# `examples/turn_end_replay.rs`: the Smart Turn model in the replay's own
# process, so a profile can be measured on recorded speech without a lamp.
lamp-turn-end = { path = "../turn-end" }
lamp-turn-end-wire = { path = "../turn-end-wire" }
# The export's case files replayed through a real skill (#1119): what it
# makes from them is what the skill made from the recording they came from.
lamp-skills = { path = "../skills" }
# The Policy's copies of the voice's bars, held equal to the voice's own
# (tests/pinned_copies.rs, Fourth on #1510).
lamp-policy = { path = "../policy" }
# The head's breath and the ring's, held to one (tests/one_breath.rs, #1670).
lamp-expression = { path = "../expression" }
lamp-msgs = { path = "../msgs" }

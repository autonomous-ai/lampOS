[package]
name = "lamp-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Physical skills (docs/skills.md): loads skill folders, listens to the
# topics their triggers name, applies the conditions, asks the Policy, and
# runs the steps through the parts that own the body, the light and the
# voice. Its own process: with it gone the lamp does everything else.
[[bin]]
name = "lamp-skills"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
lamp-ipc = { path = "../ipc" }
# The lamp's zone for quiet hours (`--zone`, #1384), as memory and Expression take it.
lamp-local-time = { path = "../local-time" }
# Reuse the bounded nonblocking local JSON client for private output caps.
lamp-schedule = { path = "../schedule" }
# A skill's moves are held to the body's own check (`lamp_body::moves`), a
# gesture to its clip table, and a clip's length is how long a run waits
# before the next.
lamp-body = { path = "../body" }
# The voice's own check of a skill's sound (`lamp_voice::say::read_sound`),
# so that what loads is what the voice plays.
lamp-voice = { path = "../voice" }
# The startle's `[startle]` (#2822), held to Expression's own check, so that
# what loads is what Expression plays. Night sleep's replay
# (`tests/it/night_sleep.rs`, #940) tests against its planner too.
lamp-expression = { path = "../expression" }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# A skill's package for the Skills Store (src/package.rs): a tar of its
# folder and a manifest of each file's SHA-256, checked on install.
sha2.workspace = true
tar = { version = "0.4", default-features = false }
# `O_NOFOLLOW` and `O_NONBLOCK` for opening a skill's files on install
# (src/package.rs), whose values differ between Linux, its ARM64 build and
# macOS. Constants only: no unsafe code.
libc = "0.2"
# A package from the Skills Store (src/package.rs, `install_from_url`): its
# signature checked with Ed25519 against the Store's key, and the
# package fetched over HTTPS by lamp-update's own client (only https, at most
# five redirects, each to https, within a bound). The same versions as
# lamp-update's, so nothing new is built.
lamp-update = { path = "../update" }
ring = "0.17"
base64 = "0.22"
# The main loop's one wait on every topic's socket and its wake pipe
# (`poll`, `pipe`), safe calls, as the voice's controls make (#1806).
# `net` and `process`: the manage helper's peer, by SO_PEERCRED (#2429).
rustix = { version = "=1.1.5", features = ["pipe", "fs", "event", "net", "process"] }

[dev-dependencies]
tempfile = "3"
hound.workspace = true
# The public skill format's schema patterns (tests/it/format.rs); already
# in the lock through other crates, so nothing new is fetched.
regex = "1"

[lints]
workspace = true

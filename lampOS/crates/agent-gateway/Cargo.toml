[package]
name = "lamp-agent-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A lamp agent's own gateway, spoken to directly (no Harness CLI, no TUI, no tmux):
# OpenClaw's gateway WebSocket; Hermes' API server (plain HTTP/1.1 and SSE on
# loopback, std only) behind the same trait.

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The gateway's WebSocket, synchronous (lamp-tasks has no runtime): the
# tungstenite already built under the workspace's tokio-tungstenite.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

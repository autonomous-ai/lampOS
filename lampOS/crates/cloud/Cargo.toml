[package]
name = "lamp-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
lamp-bus = { path = "../bus" }
# The host's monotonic clock, which a light asked for that lapses is on.
lamp-ipc = { path = "../ipc" }
lamp-msgs = { path = "../msgs" }
# The lamp's timers and reminders for the app (#2195), through the client the
# voice's reminder functions use.
lamp-actions = { path = "../actions" }
# The company broker's MQTT v5 client (#1396, the first builder: a well-used
# client, not our own). Pinned; TLS through rustls with no provider of its
# own, the ring one installed here as the other lampOS clients do.
rumqttc = { version = "=0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
# MQTT over WSS when the broker's TCP port keeps failing (`src/wss.rs`,
# #6256 F9): a bridge on 127.0.0.1 for rumqttc, on the WebSocket client the
# workspace already pins (no rumqttc `websocket` feature, no new crates);
# TLS through rumqttc's own tokio-rustls.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
# `io-util`: the Hermes forwarder's own reads and writes (src/hermes_llm.rs).
tokio = { version = "=1.53.1", features = ["rt", "time", "macros", "net", "sync", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The backend's ping, as the voice's second provider makes its requests.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
webpki-roots = "1"
# The app's skills page (`skills.list`, #1722): the skills read with
# lamp-skills' own loader, from its folder, as `lamp-skills list` reads them;
# toml for what a folder that does not load says of itself.
lamp-skills = { path = "../skills" }
# A connector a skill needs, named as a person says it (`skills.list`'s
# `needs_link`), from lamp-services' own catalogue (`lamp_services::spoken`).
lamp-services = { path = "../services" }
lamp-local-time = { path = "../local-time" }
# A photo from the app, base64 in its JSON (`faces.add_photo`, #1968), as the
# voice decodes a look's picture.
base64 = "=0.22.1"
# The app's `system.reboot` and `system.shutdown` (#2193, #3697): the
# requests setup's change helper takes, without lamp-update (the library only).
lamp-keeper = { path = "../keeper", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# Own the query's process group and drain stdout without a waiting reader thread.
rustix = { version = "=1.1.5", features = ["fs", "process"] }
# The developer door's code sealed to the app's one-time key (`crate::seal`,
# HPKE): the ring the TLS above already builds, no crate of its own.
ring = "0.17"

[dev-dependencies]
tempfile = "3"
# A real zone for the skill counts' local day (src/reports/skills.rs).
jiff-tzdb = "0.1"
# The Skills Store's tests (src/skills.rs): a package signed with a key of
# their own, fetched from a local server through lamp-update's HTTP code.
lamp-update = { path = "../update" }
base64 = "0.22"
# Setup's own settings and writer, so the account is read where and as setup
# writes it (tests/it/setup.rs).
lamp-setup = { path = "../setup" }
# The voice's own ring, so a preview is tried against its arbitration
# (tests/it/ring.rs, the reviewer on #1464).
lamp-voice = { path = "../voice" }
lamp-ipc = { path = "../ipc" }
# A stand-in lamp-schedule's times, as the store resolves them (#2195).
lamp-schedule = { path = "../schedule" }
# The tests' broker reads and writes with rumqttc's own codec.
bytes = "1"
# The app's side of a sealed code, opened in the tests (`crate::seal`): the
# X25519 ring can't do with a fixed key. Already in the lock, through
# ed25519-dalek.
curve25519-dalek = "=4.1.3"
tokio = { version = "=1.53.1", features = ["rt", "time", "macros", "net", "sync", "io-util"] }

[lints]
workspace = true

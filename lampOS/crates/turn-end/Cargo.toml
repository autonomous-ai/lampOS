[package]
name = "lamp-turn-end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Model inference lives only here and in the separate `lamp-turn-end`
# process. The interaction core links `lamp-turn-end-wire`, never this crate.
[[bin]]
name = "lamp-turn-end"
path = "src/main.rs"

[dependencies]
lamp-turn-end-wire = { path = "../turn-end-wire" }
sha2.workspace = true
# Pure Rust ONNX inference. Default features pull an unused transformer layer.
tract-onnx = { version = "=0.23.8", default-features = false }
# Already in tract-core's dependency tree; used for Whisper's 400-point STFT.
rustfft = "=6.4.1"

# Parent death signal and resource bounds on Linux; process CPU time for the
# installation self-check.
rustix = { version = "=1.1.5", features = ["process", "thread", "time"] }
# ONNX Runtime, loaded at run time from a pinned library beside the worker,
# for the 8-bit model (docs/endpoint-detection.md, "The fast model").
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-30"] }
# Already in tract-onnx's tree: encodes the 8-bit graph handed to ONNX Runtime.
prost = "=0.14.4"
# Lowers the real-time priority the worker inherits from the voice before its
# threads start (`--realtime-priority`, #1608); the voice depends on it too.
thread-priority = "=3.1.1"

# `lamp-turn-end agree`: labelled clips and their manifest.
hound.workspace = true
serde_json.workspace = true

[lints]
workspace = true

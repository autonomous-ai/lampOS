[package]
name = "lamp-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# What the lamp remembers across days: each exchange it took part in and what
# it was asked to keep, on the lamp's own disk, for each person apart once it
# can tell them apart. Its own process: with it gone the lamp talks on without
# recalling earlier days (docs/brain-build.md, "Components, processes and
# owners").
[[bin]]
name = "lamp-memory"
path = "src/main.rs"

[[bin]]
name = "lamp-memory-fixture"
path = "src/bin/lamp-memory-fixture.rs"
test = false

[dependencies]
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
lamp-ipc = { path = "../ipc" }
# The day's boundary across daylight saving (#820).
lamp-local-time = { path = "../local-time" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
unicode-normalization = "0.1"
# Used only by the explicit fixture transport and its bounded host watchdogs.
rustix = { version = "1.1", features = ["fs", "event", "process"] }

[lints]
workspace = true

[dev-dependencies]
# Exercise Voice's actual client through this process's real temporary store.
# Runtime ownership stays separate; Memory does not link Voice in production.
lamp-voice = { path = "../voice" }
lamp-gemini = { path = "../gemini" }

[package]
name = "lamp-selftest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Whether each part of the lamp works: a two-minute check run at the
# factory, at the first boot after setup and when asked. One JSON report and
# one line per part under /var/lib/lampOS/selftest/, and `lamp/selftest` for
# lamp-health (docs/selftest.md). Nothing leaves the lamp.
[[bin]]
name = "lamp-selftest"
path = "src/main.rs"

[dependencies]
lamp-air = { path = "../air" }
lamp-bus = { path = "../bus" }
lamp-ipc = { path = "../ipc" }
lamp-msgs = { path = "../msgs" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The head pads' item name, as lamp-controls sends it (#1798).
lamp-controls = { path = "../controls" }

[lints]
workspace = true

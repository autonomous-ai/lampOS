[package]
name = "lamp-name"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The part that hears the lamp's name. It listens to what the microphone
# hears, as the voice puts it on the bus, for "Hey Lamp" and "Lamp ơi" and
# nothing else, and says when it heard one (name/heard). It decides
# nothing: being called is one sign among several for the part that does.
# Its own process: with it gone the lamp talks on as before (docs/name.md).
[[bin]]
name = "lamp-name"
path = "src/main.rs"

[dependencies]
lamp-ipc = { path = "../ipc" }
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
# Pure Rust ONNX inference, pinned as in lamp-turn-end and lamp-eyes.
# Default features pull an unused transformer layer.
tract-onnx = { version = "=0.23.8", default-features = false }
# The stop model's pinned SHA-256, checked as it loads (`hear::STOP_SHA256`).
sha2.workspace = true

[dev-dependencies]
# `stop_words_replay` reads a replay's `operations.jsonl`.
serde_json.workspace = true
# `moving::AT_REST` is checked against the body's own shifts at rest.
lamp-body = { path = "../body" }

# Offline, run only when named: played stops scored on each canceller
# stage (#828, docs/stop-word.md). Its tests run with the crate's.
[[example]]
name = "stop_words_replay"
test = true

[lints]
workspace = true

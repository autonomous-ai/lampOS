[package]
name = "lamp-body"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lamp-ipc = { path = "../ipc" }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
lamp-turn-owner = { path = "../turn-owner" }
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
# V1's body model for its anti-tip rule (src/cog.rs).
lamp-lean = { path = "../lean" }
# Telling systemd it is ready, alive and stopping (docs/work-split.md, task 27).
# Without default features: the keeper binary's lamp-update is not built.
lamp-keeper = { path = "../keeper", default-features = false }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "termios", "event", "process"] }
nix = { version = "=0.29.0", default-features = false, features = ["signal", "user"] }
# The local day of the strain guard's daily peaks (#4501).
lamp-local-time = { path = "../local-time" }

[lints]
workspace = true

# Installed for lamp-skills-manage@.service. The Store stays off until
# store.env says on and its own valid signing key is present. Removal,
# turning a skill on and turning it off do not depend on that key.
[Service]
EnvironmentFile=-/etc/lampOS/skills/store.env
# Prepare HTTPS for a later install. Even while off these network families
# are available, but the helper constructs no HTTPS client and fetches nothing.
PrivateNetwork=no
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

# tmpfiles.d for every lampOS lamp (lampOS/docs/install.md), installed as /etc/tmpfiles.d/lampos.conf.
# The bus root as the keeper makes it (docs/bus.md): root's, the parts' group, set-group-ID.
d /run/lampos-bus 2770 root lampos -
# The one-owner locks of the servo port and the camera, shared by a part and its inspection tools
# (run as lampos). The body and the eyes refuse a lock folder that is not 0700 under ancestors no
# group or other may write (crates/body/src/linux.rs, trusted_metadata): 0775 kept the body from
# opening the servo port on lamp-06c1 (2026-10-16, #811).
d /run/lampos-locks 0755 root root -
d /run/lampos-locks/motor 0700 lampos lampos -
d /run/lampos-locks/camera 0700 lampos lampos -
# The voice's own state (root's). Its unit names /var/lib/lampOS/voice/sessions/${INVOCATION_ID}
# and the voice does not make the parent: without it the voice could not start on lamp-06c1.
d /var/lib/lampOS 0755 root root -
d /var/lib/lampOS/voice 0700 root root -
d /var/lib/lampOS/voice/sessions 0700 root root -
# Private onboarding progress, privacy checkpoint and transient handoff files (#841).
d /var/lib/lampOS/voice/onboarding 0700 root root -
# The room sounds yes (#1722 item 1): the voice (root) writes it 0640 root:lampos, lamp-ears (lampos) reads it.
d /var/lib/lampOS/consent 0750 root lampos -
# Skills a paired computer pushed over lamp-control (#3869, docs/skills.md): the manage helper
# (root) writes them, lamp-skills (lampos) reads them. Its unit names it writable only if it is
# there (ReadWritePaths=-...), and under ProtectSystem=strict it can't make it: so made here.
d /var/lib/lampOS/skills-dev 0755 root root -
# The person's own light, kept across a restart by the voice's ring with LAMP_LIGHT_KEEP=on (#1464).
d /var/lib/lampOS/light 0700 root root -
# A face from the app's photo (#1968, docs/cloud.md): lamp-cloud writes it, the eyes read and remove
# it. Neither unit's own folder, so neither one's stop or restart removes it under the other, and it
# is there before both start (Reviewer-lead on #2263). 0700, as the eyes require.
d /run/lampos-photos 0700 lampos lampos -
# The voice's software mute and sleep from the head (--controls-mute, #711): the voice wants the record's folder
# there already, private, under folders no one else may write. A reset empties it.
d /var/lib/lampOS/voice/mute 0700 root root -
# No PulseAudio in the board user's session (#4332, El on lamp-06c1, 30 Oct): its autologin started the user's
# pulseaudio.socket, which took the C-Media speaker while the voice restarted, so the voice's open failed busy; in an
# update's restart that is a NRestarts the round puts the build back for (Second). The lamp plays and records through
# ALSA only. Masked for every user session from the next boot, and libpulse's autospawn off, so no client starts it past
# the masks. A pulseaudio already running keeps going until that boot. /etc/pulse is named, so a lamp without
# PulseAudio gets the folder too and no line here depends on a parent being made (Second's P3 on #4487).
L+ /etc/systemd/user/pulseaudio.socket - - - - /dev/null
L+ /etc/systemd/user/pulseaudio.service - - - - /dev/null
d /etc/pulse 0755 root root -
d /etc/pulse/client.conf.d 0755 root root -
f+ /etc/pulse/client.conf.d/90-lampos-no-autospawn.conf 0644 root root - autospawn = no

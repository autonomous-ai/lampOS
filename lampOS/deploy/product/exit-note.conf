# lampOS reports: what systemd says of each stop of a lampOS unit, kept for lamp-cloud's crash
# reports (lampOS/docs/cloud.md, #1683). Not installed by `lamp-update install`, which never
# writes drop-ins: it goes on a lamp with the reports' switch, as
#   /etc/systemd/system/lamp-.service.d/exit-note.conf
# a prefix drop-in that reaches every lamp-*.service. `+` runs it as root, past the unit's own
# sandbox, so it can write /run/lampos-exits; it reads only systemd's $SERVICE_RESULT, $EXIT_CODE
# and $EXIT_STATUS and `systemctl show`'s restarts and times, never a journal. A success writes
# nothing, and the note never fails a stop.
[Service]
ExecStopPost=-+/opt/lampOS/cloud/current/lamp-cloud exit-note %n

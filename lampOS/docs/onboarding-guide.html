<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lamp Awakens</title>
<!-- System fonts only: the page loads nothing from outside. -->
<style>
  /* A comic book, issue #1: inked panels on halftone paper, read as a two-page spread you turn. */
  :root {
    --ink: #111216;
    --paper: #fff8e7;
    --yellow: #ffd23f;
    --red: #ff4b3e;
    --blue: #2f80ed;
    --sky: #8fd3ff;
    --night: #15183a;
    --display: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
    --body: "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #121320 radial-gradient(circle at 50% 0%, #2c2f4a 0%, #121320 70%);
    color: var(--ink); font: 17px/1.35 var(--body); overflow: hidden;
    display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
  }

  /* the book */
  .stage { width: min(1200px, 96vw); display: grid; gap: 14px; justify-items: center; }
  .book { position: relative; width: 100%; aspect-ratio: 2 / 1.38; max-height: 84vh; perspective: 2600px; }
  .book.single { aspect-ratio: 1 / 1.45; max-height: 82vh; width: min(560px, 96vw); }
  .leaf { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; transform-style: preserve-3d;
          transform-origin: left center; transition: transform .95s cubic-bezier(.3,.1,.2,1); cursor: pointer; }
  .book.single .leaf { left: 0; width: 100%; transition: transform .75s cubic-bezier(.3,.1,.2,1), opacity .2s .55s; }
  .leaf.flipped { transform: rotateY(-180deg); }
  .book.single .leaf.flipped { opacity: 0; pointer-events: none; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .face.back { transform: rotateY(180deg); box-shadow: inset -14px 0 18px -14px rgba(0,0,0,.45); }
  .face.front { box-shadow: inset 14px 0 18px -14px rgba(0,0,0,.45); }
  .book.single .face.front { box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  @media (prefers-reduced-motion: reduce) { .leaf { transition: none !important; } }

  /* a comic page */
  .page {
    position: absolute; inset: 0; padding: 4.2% 4.4% 6%; display: grid; gap: 3.2%;
    background-color: var(--paper);
    background-image: radial-gradient(rgba(17,18,22,.10) 1px, transparent 1.4px);
    background-size: 9px 9px;
  }
  .folio { position: absolute; bottom: 1.8%; font: 15px var(--display); letter-spacing: .06em; color: rgba(17,18,22,.55); }
  .face.front .folio { right: 5%; } .face.back .folio { left: 5%; }
  .book.single .folio { right: 5%; left: auto; }

  .panel { position: relative; border: 4px solid var(--ink); border-radius: 4px; box-shadow: 5px 5px 0 var(--ink);
           overflow: hidden; background: #fff; min-height: 0; }
  .panel > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .halftone-y { background: var(--yellow) radial-gradient(rgba(255,120,0,.38) 2px, transparent 2.6px) 0 0/12px 12px; }
  .halftone-r { background: var(--red) radial-gradient(rgba(120,0,0,.32) 2px, transparent 2.6px) 0 0/12px 12px; }
  .halftone-b { background: var(--blue) radial-gradient(rgba(0,20,80,.35) 2px, transparent 2.6px) 0 0/12px 12px; }
  .halftone-s { background: var(--sky) radial-gradient(rgba(0,70,140,.25) 2px, transparent 2.6px) 0 0/12px 12px; }
  .nightfill { background: var(--night) radial-gradient(rgba(255,255,255,.08) 1.5px, transparent 2px) 0 0/10px 10px; }
  .burst { background: repeating-conic-gradient(from 0deg at 50% 55%, var(--yellow) 0 6deg, #ffe680 6deg 12deg); }
  .burst-r { background: repeating-conic-gradient(from 0deg at 50% 50%, var(--red) 0 6deg, #ff7b6e 6deg 12deg); }

  /* lettering */
  .caption { position: absolute; z-index: 2; background: #ffe680; border: 3px solid var(--ink); padding: 6px 10px;
             font: 700 15px/1.25 var(--body); text-transform: uppercase; letter-spacing: .02em; max-width: 80%; box-shadow: 3px 3px 0 var(--ink); }
  .caption.tl { top: 8px; left: 8px; } .caption.br { bottom: 8px; right: 8px; } .caption.bl { bottom: 8px; left: 8px; }
  .balloon { position: absolute; z-index: 2; background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 9px 13px;
             font: 700 16px/1.25 var(--body); max-width: 72%; box-shadow: 2px 2px 0 var(--ink); }
  .balloon::after { content: ""; position: absolute; width: 18px; height: 18px; background: inherit; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
  .balloon.down::after { bottom: -11px; left: 26px; transform: rotate(45deg) skew(10deg, 10deg); }
  .balloon.down-r::after { bottom: -11px; right: 26px; transform: rotate(45deg) skew(10deg, 10deg); }
  .balloon.lamp { background: #fff3d1; }
  .balloon .who { display: block; font: 13px var(--display); letter-spacing: .08em; color: #a05a00; }
  .balloon.you .who { color: #1d5fb8; }
  .sfx { position: absolute; z-index: 3; font: clamp(28px, 4.6vw, 60px)/1 var(--display); letter-spacing: .03em; color: var(--yellow);
         -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--red); transform: rotate(-9deg); }
  .sfx.blue { color: var(--sky); text-shadow: 4px 4px 0 var(--blue); }
  .title { font: clamp(30px, 4.4vw, 62px)/.92 var(--display); letter-spacing: .03em; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; margin: 0; }
  .text-panel { padding: 16px 18px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .text-panel h3 { margin: 0; font: clamp(22px, 2.5vw, 34px)/1 var(--display); letter-spacing: .04em; }
  .text-panel p { margin: 0; font-size: 16px; }
  .chap { font-size: clamp(28px, 3.3vw, 46px); color: var(--yellow); }

  .phone { position: absolute; z-index: 2; left: 50%; top: 50%; width: 44%; aspect-ratio: 9/17; transform: translate(-50%, -50%) rotate(-4deg);
           border: 4px solid var(--ink); border-radius: 26px; background: var(--ink); padding: 7px; box-shadow: 5px 5px 0 rgba(0,0,0,.35); }
  .screen { height: 100%; border-radius: 18px; background: #fff; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; font: 700 13px var(--body); }
  .screen .t { font: 20px var(--display); letter-spacing: .04em; }
  .screen .r { border: 2px solid var(--ink); border-radius: 8px; padding: 6px 8px; display: flex; justify-content: space-between; }
  .screen .b { margin-top: auto; text-align: center; padding: 8px; border-radius: 8px; background: var(--red); color: #fff; font: 18px var(--display); letter-spacing: .06em; border: 2px solid var(--ink); }
  .term { position: absolute; inset: 12% 7% 10%; z-index: 2; background: #0c0d14; border: 4px solid var(--ink); border-radius: 8px; box-shadow: 5px 5px 0 rgba(0,0,0,.4); overflow: hidden; }
  .term pre { margin: 0; padding: 12px 14px; color: #e8ecf6; font: 12.5px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .term .p { color: var(--yellow); } .term .c { color: #7d89a6; }
  .tiles { position: absolute; inset: 18% 8% 8%; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tiles div { background: #fff; border: 3px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); padding: 10px;
               font: clamp(16px, 1.7vw, 22px)/1 var(--display); letter-spacing: .04em; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  .tiles div small { align-self: flex-start; font: 14px var(--display); background: var(--red); color: #fff; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 4px; }

  /* controls */
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .controls button, .controls select {
    font: 18px var(--display); letter-spacing: .06em; color: var(--ink); background: var(--yellow);
    border: 3px solid var(--ink); border-radius: 8px; padding: 8px 16px; box-shadow: 3px 3px 0 #000; cursor: pointer;
  }
  .controls button:disabled { opacity: .4; cursor: default; }
  .controls .where { font: 17px var(--display); letter-spacing: .08em; color: #e6e7ef; min-width: 130px; text-align: center; }
  .hint { color: #a9adc2; font: 14px var(--body); }
  button:focus-visible, select:focus-visible, .leaf:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="lamp" viewBox="0 0 300 320">
      <ellipse cx="96" cy="302" rx="72" ry="10" fill="#111216" opacity=".25"/>
      <rect x="28" y="280" width="136" height="22" rx="10" fill="#2b2f45" stroke="#111216" stroke-width="5"/>
      <rect x="84" y="160" width="16" height="128" rx="8" fill="#3b4060" stroke="#111216" stroke-width="5" transform="rotate(-10 92 224)"/>
      <circle cx="104" cy="158" r="13" fill="#2b2f45" stroke="#111216" stroke-width="5"/>
      <rect x="100" y="62" width="16" height="112" rx="8" fill="#3b4060" stroke="#111216" stroke-width="5" transform="rotate(50 108 118)"/>
      <circle cx="176" cy="76" r="11" fill="#2b2f45" stroke="#111216" stroke-width="5"/>
      <g transform="rotate(22 214 104)">
        <path d="M162 80 Q214 34 266 80 L255 140 Q214 160 173 140 Z" fill="#3b4060" stroke="#111216" stroke-width="5" stroke-linejoin="round"/>
        <path d="M178 90 Q214 64 250 90" fill="none" stroke="#5b6188" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="214" cy="140" rx="42" ry="11" fill="#ffe2ad" stroke="#111216" stroke-width="5"/>
        <ellipse cx="199" cy="104" rx="6" ry="8" fill="#ffe2ad" stroke="#111216" stroke-width="3"/>
        <ellipse cx="229" cy="104" rx="6" ry="8" fill="#ffe2ad" stroke="#111216" stroke-width="3"/>
      </g>
    </symbol>
    <symbol id="beam" viewBox="0 0 300 320"><path d="M190 160 L110 318 L300 318 L262 150 Z" fill="#ffe680" opacity=".85"/></symbol>
  </defs>
</svg>

<div class="stage">
  <div class="book" id="book" role="region" aria-label="The Lamp Awakens, a guide for new owners"></div>
  <div class="controls">
    <button id="prev" aria-label="Turn back">‹ Back</button>
    <span class="where" id="where" aria-live="polite"></span>
    <button id="next" aria-label="Turn the page">Turn ›</button>
    <select id="jump" aria-label="Go to a chapter"></select>
  </div>
  <div class="hint">Click a page, swipe, or use the arrow keys.</div>
</div>

<!-- The pages in reading order. The script lays them out as a two-page spread, or one at a time on a narrow screen. -->
<template id="pages">

  <div class="page" data-chapter="Cover" style="grid-template-rows: 1fr;">
    <div class="panel burst">
      <svg viewBox="0 0 300 320" preserveAspectRatio="xMidYMax meet"><use href="#beam"/><use href="#lamp"/></svg>
      <div style="position:absolute;z-index:3;top:5%;left:6%;right:6%">
        <div style="font:20px var(--display);letter-spacing:.1em;background:var(--ink);color:var(--yellow);display:inline-block;padding:3px 10px">ISSUE #1 · A GUIDE FOR NEW OWNERS</div>
        <h1 class="title" style="color:var(--red);margin-top:10px">THE LAMP<br>AWAKENS!</h1>
      </div>
      <div class="caption br">Ten minutes from the box to your first chat.</div>
    </div>
  </div>

  <div class="page" data-chapter="Cover" style="grid-template-rows: 1fr 1.1fr;">
    <div class="panel nightfill text-panel" style="color:#fff">
      <h3 style="color:var(--yellow)">PREVIOUSLY…</h3>
      <p>You opened a box. Inside was a lamp that listens, learns who you are, if you say so, and lights your desk.</p>
      <p>You can teach it new tricks. Developers can even program it.</p>
    </div>
    <div class="panel halftone-s">
      <svg viewBox="0 0 300 320" preserveAspectRatio="xMidYMid meet"><use href="#lamp"/></svg>
      <div class="balloon lamp down" style="top:10%;left:8%"><span class="who">LAMP</span>Turn the page. Let's meet.</div>
    </div>
  </div>

  <div class="page" data-chapter="1 · Origin" style="grid-template-rows: auto 1fr;">
    <div class="panel halftone-r text-panel" style="color:#fff">
      <h2 class="title chap">CHAPTER 1: ORIGIN</h2>
      <p style="font-weight:700">About five minutes. Have your Wi-Fi password ready.</p>
    </div>
    <div class="panel halftone-y">
      <svg viewBox="0 0 300 320" preserveAspectRatio="xMidYMax meet"><rect x="0" y="300" width="300" height="20" fill="#8a5a2b" stroke="#111216" stroke-width="4"/><use href="#lamp"/></svg>
      <div class="caption tl">Step one: put me where you usually sit. A desk or a bedside table, a little to one side of you.</div>
    </div>
  </div>

  <div class="page" data-chapter="1 · Origin" style="grid-template-rows: 1fr 1fr;">
    <div class="panel burst">
      <svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid meet"><g stroke="#111216" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="#fff"><path d="M110 60v34M150 60v34"/><path d="M96 94h68v22a34 34 0 0 1-68 0z"/><path d="M130 150v40" fill="none"/></g></svg>
      <div class="sfx" style="top:12%;right:8%">CLICK!</div>
      <div class="caption bl">Plug me in.</div>
    </div>
    <div class="panel nightfill">
      <svg viewBox="0 0 300 320" preserveAspectRatio="xMidYMax meet"><circle cx="214" cy="196" r="110" fill="#fff3d1" opacity=".35"/><use href="#lamp"/></svg>
      <div class="caption tl">I glow softly while I wake up…</div>
    </div>
  </div>

  <div class="page" data-chapter="1 · Origin" style="grid-template-rows: 1.4fr auto;">
    <div class="panel halftone-b">
      <div class="phone"><div class="screen"><div class="t">MY LAMPS</div><div class="r"><span>No lamp yet</span></div><div class="b">ADD LAMP</div></div></div>
      <div class="sfx" style="bottom:8%;right:6%;transform:rotate(8deg)">TAP!</div>
    </div>
    <div class="panel text-panel">
      <h3>OPEN THE AUTONOMOUS APP. TAP ADD LAMP.</h3>
      <p>Your phone talks to me directly for a moment, over my own network: "lamp-" and a few letters.</p>
    </div>
  </div>

  <div class="page" data-chapter="1 · Origin" style="grid-template-rows: 1.3fr auto;">
    <div class="panel halftone-s">
      <div class="phone" style="left:34%"><div class="screen"><div class="t">CHOOSE WI-FI</div><div class="r"><span>Home</span><span>●●●</span></div><div class="r"><span>Password</span><span>••••••</span></div><div class="b">JOIN</div></div></div>
      <div class="sfx blue" style="top:14%;right:6%;transform:rotate(7deg)">BLINK<br>BLINK</div>
    </div>
    <div class="panel text-panel">
      <h3>PICK YOUR WI-FI. TYPE ITS PASSWORD.</h3>
      <p>I blink blue while I join. If I can't, the app tells you, and you try again.</p>
    </div>
  </div>

  <div class="page" data-chapter="1 · Origin" style="grid-template-rows: auto 1fr;">
    <div class="panel text-panel halftone-y"><h3>A FEW MINUTES LATER…</h3><p style="font-weight:700">I get my voice ready. Then I speak first.</p></div>
    <div class="panel burst-r">
      <svg viewBox="0 0 300 320" preserveAspectRatio="xMidYMax meet"><use href="#beam"/><use href="#lamp"/></svg>
      <div class="balloon lamp down" style="top:8%;left:8%;font-size:22px"><span class="who">LAMP</span>Hello!</div>
    </div>
  </div>

  <div class="page" data-chapter="2 · The first five minutes" style="grid-template-rows: auto 1fr;">
    <div class="panel nightfill text-panel" style="color:#fff">
      <h2 class="title chap">CHAPTER 2: THE FIRST FIVE MINUTES</h2>
      <p>I lead, one short step at a time. Say "skip" for any step, and I'll move on.</p>
    </div>
    <div class="panel halftone-y">
      <svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet"><rect x="112" y="36" width="76" height="228" rx="38" fill="#fff" stroke="#111216" stroke-width="7"/><rect x="124" y="50" width="52" height="98" rx="26" fill="#ff4b3e" stroke="#111216" stroke-width="5"/></svg>
      <div class="caption bl">My privacy switch: slide it, and both my microphones are off until you slide it back.</div>
    </div>
  </div>

  <div class="page" data-chapter="2 · The first five minutes" style="grid-template-rows: 1fr 1.25fr;">
    <div class="panel halftone-s">
      <svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMax meet"><circle cx="150" cy="86" r="36" fill="#ffd9b8" stroke="#111216" stroke-width="5"/><path d="M76 200c0-46 32-72 74-72s74 26 74 72" fill="#ff4b3e" stroke="#111216" stroke-width="5"/></svg>
      <div class="caption tl">Sit where you usually sit, and look at me for a moment.</div>
    </div>
    <div class="panel">
      <div class="balloon lamp down" style="top:6%;left:5%"><span class="who">LAMP</span>What should I call you?</div>
      <div class="balloon you down-r" style="top:38%;right:5%"><span class="who">YOU</span>Marie.</div>
      <div class="balloon lamp down" style="top:66%;left:5%"><span class="who">LAMP</span>Nice to meet you, Marie.</div>
    </div>
  </div>

  <div class="page" data-chapter="2 · The first five minutes" style="grid-template-rows: 1fr 1fr;">
    <div class="panel halftone-r">
      <svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid meet"><circle cx="150" cy="100" r="64" fill="#ffd9b8" stroke="#111216" stroke-width="6"/><circle cx="128" cy="90" r="8" fill="#111216"/><circle cx="172" cy="90" r="8" fill="#111216"/><path d="M122 120c16 18 40 18 56 0" fill="none" stroke="#111216" stroke-width="6" stroke-linecap="round"/><g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"><path d="M54 30h26M54 30v26M246 30h-26M246 30v26M54 170h26M54 170v-26M246 170h-26M246 170v-26"/></g></svg>
      <div class="caption bl">Your face, if you like. Say yes and I'll know it's you next time. Say no and I'll still remember your name.</div>
    </div>
    <div class="panel burst">
      <svg viewBox="0 0 300 320" preserveAspectRatio="xMidYMax meet"><use href="#lamp"/></svg>
      <div class="balloon lamp down" style="top:6%;left:5%;max-width:62%"><span class="who">LAMP</span>OK, next step. Try petting the top of my head.</div>
      <div class="sfx" style="bottom:30%;right:6%">PAT PAT!</div>
      <div class="caption bl">I react, so you know I felt it.</div>
    </div>
  </div>

  <div class="page" data-chapter="2 · The first five minutes" style="grid-template-rows: 1fr auto;">
    <div class="panel halftone-y">
      <div class="balloon lamp down" style="top:6%;left:5%;max-width:62%"><span class="who">LAMP</span>When you want me, say "Hey Lamp" first. Try it now.</div>
      <div class="balloon you down-r" style="top:46%;right:6%"><span class="who">YOU</span>Hey Lamp.</div>
      <div class="caption bl">Once is enough.</div>
    </div>
    <div class="panel text-panel halftone-y">
      <h3>IF A STEP WENT WRONG</h3>
      <p>"Lamp, can we redo the touch step?" (or the name step, and so on) redoes just that one step, and the rest stays.</p>
      <p>"Lamp, remember my face." saves your face any time, if setup didn't.</p>
      <p>Skip a step, or don't answer, and I remind you once, then move on. You can redo the setup later.</p>
    </div>
  </div>

  <div class="page" data-chapter="3 · Powers" style="grid-template-rows: auto 1fr 1fr;">
    <div class="panel halftone-b text-panel" style="color:#fff">
      <h2 class="title chap">CHAPTER 3: POWERS</h2>
      <p style="font-weight:700">Say "Hey Lamp", then ask in your own words.</p>
    </div>
    <div class="panel">
      <div class="balloon you down-r" style="top:8%;right:5%"><span class="who">YOU</span>Hey Lamp, set a timer for ten minutes.</div>
      <div class="balloon lamp down" style="top:54%;left:5%"><span class="who">LAMP</span>Ten minutes, starting now.</div>
      <div class="sfx" style="bottom:6%;right:6%;font-size:clamp(22px,3vw,40px)">RING!</div>
    </div>
    <div class="panel halftone-y">
      <div class="balloon you down-r" style="top:8%;right:5%"><span class="who">YOU</span>Remind me to call Mom at six.</div>
      <div class="balloon you down-r" style="top:52%;right:20%"><span class="who">YOU</span>What reminders do I have?</div>
    </div>
  </div>

  <div class="page" data-chapter="3 · Powers" style="grid-template-rows: 1fr 1fr 1fr;">
    <div class="panel halftone-s">
      <svg viewBox="0 0 300 100" preserveAspectRatio="xMaxYMid meet"><circle cx="250" cy="44" r="22" fill="#ffd23f" stroke="#111216" stroke-width="4"/><path d="M190 70h60a18 18 0 0 0 0-36 26 26 0 0 0-50 6 16 16 0 0 0-10 30z" fill="#fff" stroke="#111216" stroke-width="4"/></svg>
      <div class="balloon you down" style="top:12%;left:5%"><span class="who">YOU</span>What's the weather tomorrow?</div>
    </div>
    <div class="panel burst">
      <svg viewBox="0 0 300 320" preserveAspectRatio="xMaxYMax meet"><use href="#beam"/><use href="#lamp"/></svg>
      <div class="balloon you down" style="top:12%;left:5%"><span class="who">YOU</span>Make the light warmer.</div>
    </div>
    <div class="panel halftone-r">
      <div class="balloon you down" style="top:12%;left:5%"><span class="who">YOU</span>Lamp, stop.</div>
      <div class="caption br">Talking too long? I stop right there. And ask me anything you'd ask a friend.</div>
    </div>
  </div>

  <div class="page" data-chapter="4 · Upgrades" style="grid-template-rows: auto 1fr;">
    <div class="panel halftone-r text-panel" style="color:#fff">
      <h2 class="title chap">CHAPTER 4: UPGRADES</h2>
      <p style="font-weight:700">In the app: Skills, then Store. Tap Add, and I have a new skill.</p>
      <p>No Add button yet? I'm finishing my first update; look again in up to half an hour.</p>
    </div>
    <div class="panel halftone-y">
      <div class="tiles">
        <div>LOOK FOR THINGS<small>ADD</small></div><div>COMFORT BREAK<small>ADD</small></div>
        <div>MEAL CHECK<small>ADD</small></div><div>SIT BACK<small>ADD</small></div>

<script>
(() => {
  const book = document.getElementById('book');
  const pages = [...document.getElementById('pages').content.children];
  const where = document.getElementById('where');
  const jump = document.getElementById('jump');
  let leaves = [], at = 0, single = false;   // at: leaves turned so far

  function face(page, side, n) {
    const f = document.createElement('div');
    f.className = 'face ' + side;
    if (page) {
      const p = page.cloneNode(true);
      const folio = document.createElement('div'); folio.className = 'folio'; folio.textContent = n;
      p.appendChild(folio); f.appendChild(p);
    } else { f.style.background = '#2a2d44'; }
    return f;
  }

  function last() { return single ? leaves.length - 1 : leaves.length; }

  function build() {
    single = window.matchMedia('(max-width: 820px)').matches;
    book.classList.toggle('single', single);
    book.innerHTML = '';
    leaves = [];
    const per = single ? 1 : 2;
    for (let i = 0; i < pages.length; i += per) {
      const leaf = document.createElement('div');
      leaf.className = 'leaf';
      leaf.tabIndex = 0;
      leaf.appendChild(face(pages[i], 'front', i + 1));
      if (!single) leaf.appendChild(face(pages[i + 1], 'back', i + 2));
      leaf.addEventListener('click', () => (leaf.classList.contains('flipped') ? back() : turn()));
      book.appendChild(leaf);
      leaves.push(leaf);
    }
    at = Math.min(at, last());
    leaves.forEach((l, i) => l.classList.toggle('flipped', i < at));
    stack();
  }

  function stack() {
    const n = leaves.length;
    leaves.forEach((l, i) => { l.style.zIndex = i < at ? i + 1 : 2 * n - i; });
    if (single) where.textContent = 'Page ' + (at + 1) + ' / ' + pages.length;
    else where.textContent = at === 0 ? 'Cover' : at === leaves.length ? 'Back cover' : 'Pages ' + (at * 2) + '–' + (at * 2 + 1);
    document.getElementById('prev').disabled = at === 0;
    document.getElementById('next').disabled = at >= last();
    const ch = pages[Math.min(pages.length - 1, single ? at : Math.max(0, at * 2 - (at === leaves.length ? 1 : 0)))].dataset.chapter;
    [...jump.options].forEach(o => { o.selected = o.dataset.chapter === ch; });
  }

  function turn() {
    if (at >= last()) return;
    const l = leaves[at];
    at++;
    stack();
    l.style.zIndex = 999;
    l.classList.add('flipped');
    setTimeout(stack, 500);
  }
  function back() {
    if (at <= 0) return;
    at--;
    const l = leaves[at];
    stack();
    l.style.zIndex = 999;
    l.classList.remove('flipped');
    setTimeout(stack, 500);
  }
  function goTo(pageIndex) {
    at = Math.max(0, Math.min(single ? pageIndex : Math.ceil(pageIndex / 2), last()));
    leaves.forEach((l, i) => l.classList.toggle('flipped', i < at));
    stack();
  }

  const seen = new Set();
  pages.forEach((p, i) => {
    const c = p.dataset.chapter; if (seen.has(c)) return; seen.add(c);
    const o = document.createElement('option'); o.value = i; o.textContent = c; o.dataset.chapter = c; jump.appendChild(o);
  });
  jump.addEventListener('change', () => goTo(parseInt(jump.value, 10)));

  document.getElementById('next').onclick = turn;
  document.getElementById('prev').onclick = back;
  document.addEventListener('keydown', e => {
    if (e.target === jump) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); turn(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
  });
  let x0 = null;
  book.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  book.addEventListener('touchend', e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 45) { e.preventDefault(); dx < 0 ? turn() : back(); }
  });
  let narrow = window.matchMedia('(max-width: 820px)').matches;
  window.addEventListener('resize', () => {
    const now = window.matchMedia('(max-width: 820px)').matches;
    if (now === narrow) return;
    const pageIndex = single ? at : Math.max(0, at * 2 - 1);
    narrow = now; build(); goTo(pageIndex);
  });

  build();
})();
</script>

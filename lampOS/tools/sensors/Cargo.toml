[package]
name = "lamp-sensor-score"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Offline measuring tools must not join the product dependency graph.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

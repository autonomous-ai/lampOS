[package]
name = "lamp-sensor5-recorder"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace]

[dependencies]
lamp-bus = { path = "../../../crates/bus" }
lamp-camera = { path = "../../../crates/camera" }
lamp-ears = { path = "../../../crates/ears" }
lamp-eyes = { path = "../../../crates/eyes" }
lamp-ipc = { path = "../../../crates/ipc" }
lamp-msgs = { path = "../../../crates/msgs" }
lamp-turn-owner = { path = "../../../crates/turn-owner" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rustix = { version = "=1.1.5", features = ["process", "fs", "pipe"] }
signal-hook = "=0.4.4"

[dev-dependencies]
jpeg-encoder = "=0.7.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

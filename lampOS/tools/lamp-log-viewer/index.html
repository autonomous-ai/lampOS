<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamp Log</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#6b6962;--line:#e4e0d6;--card:#fff;--warn:#b26b00;--err:#b4382a;--acc:#2f6fd6}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--fg:#e9e7e1;--muted:#9c9a93;--line:#2e2c28;--card:#1d1c19;--warn:#e0a040;--err:#ef7a68;--acc:#7aa7f2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;z-index:1}
h1{font-size:1.05rem;margin:0 8px 0 0;display:inline}
.status{color:var(--muted);font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
input[type=search]{flex:1;min-width:160px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.8rem;padding:2px 9px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none;background:var(--card)}
.chip.off{opacity:.35;text-decoration:line-through}
.chip b{font-weight:600}
#log{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:6px 16px 40px}
.row{display:grid;grid-template-columns:92px 110px 1fr;gap:10px;padding:1px 0;border-bottom:1px solid transparent;white-space:pre-wrap;word-break:break-word}
.row:hover{border-bottom-color:var(--line)}
.t{color:var(--muted)} .u{color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .m{color:var(--warn)} .e .m{color:var(--err);font-weight:600}
@media (max-width:600px){.row{grid-template-columns:70px 1fr}.u{grid-column:2}.m{grid-column:1/-1}}
.tabs{display:inline-flex;gap:4px;margin-left:10px;vertical-align:middle}
.tab{padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:.85rem;color:var(--fg)}
.tab.on{border-color:var(--acc);color:var(--acc);font-weight:600}
#convo{display:none;padding:10px 16px 40px;max-width:900px}
.turn{border-bottom:1px solid var(--line);padding:10px 0}
.turn .meta{color:var(--muted);font-size:.8rem;margin-bottom:4px}
.turn .who{color:var(--acc);font-weight:600}
.turn p{margin:3px 0;white-space:pre-wrap;word-break:break-word}
.turn .h b{color:var(--muted);font-weight:600} .turn .s b{color:var(--acc);font-weight:600}
.day{color:var(--muted);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:16px 0 4px}
body.c #log,body.c .bar,body.c #chips{display:none} body.c #convo{display:block}
.mx{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.mx span{font:11.5px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:2px 7px;border-radius:6px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.mx span b{color:var(--fg);font-weight:600}
.mx .tot b{color:var(--acc)} .mx .slow b{color:var(--warn)} .mx .none{border-style:dashed}
</style>
</head>
<body>
<header>
  <h1 id="lampName">lamp</h1><span class="tabs"><button class="tab on" id="tabLog">Log</button><button class="tab" id="tabConvo">Conversation</button></span>
  <span class="status" id="status">connecting…</span>
  <div class="bar">
    <input type="search" id="q" placeholder="Filter text (e.g. heard, refused, error)">
    <button id="pause">Pause</button>
    <button id="lamp" class="on" title="Only lampOS services">lamp-* only</button>
    <button id="noisy" title="Hide lamp-body's per-step lines">Hide body steps</button>
    <button id="clear">Clear</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div id="log"></div>
<div id="convo"><div class="status" id="cstatus">loading…</div><div id="turns"></div></div>
<script>
const log = document.getElementById('log'), statusEl = document.getElementById('status');
const q = document.getElementById('q'), chips = document.getElementById('chips');
const MAX = 5000;
let paused = false, lampOnly = true, hideSteps = false, held = [], count = 0;
const hidden = new Set(), seen = new Map();

function fmt(ms){const d=new Date(ms);return d.toLocaleTimeString('en-GB',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0')}
function visible(l){
  if (lampOnly && !l.unit.startsWith('lamp-')) return false;
  if (hidden.has(l.unit)) return false;
  if (hideSteps && l.unit==='lamp-body' && /^lamp-body: step \d+/.test(l.m)) return false;
  const s=q.value.trim().toLowerCase(); if (s && !(l.m.toLowerCase().includes(s)||l.unit.includes(s))) return false;
  return true;
}
function chip(unit){
  if (seen.has(unit)) { seen.get(unit).n++; seen.get(unit).el.querySelector('i').textContent=seen.get(unit).n; return; }
  const el=document.createElement('span'); el.className='chip'; el.innerHTML='<b></b> <i>1</i>';
  el.querySelector('b').textContent=unit;
  el.onclick=()=>{ hidden.has(unit)?hidden.delete(unit):hidden.add(unit); el.classList.toggle('off'); redraw(); };
  seen.set(unit,{el,n:1});
  [...chips.children].concat(el).sort((a,b)=>a.querySelector('b').textContent.localeCompare(b.querySelector('b').textContent)).forEach(c=>chips.appendChild(c));
}
const all=[];
function row(l){
  const r=document.createElement('div'); r.className='row'+(l.p<=3?' e':l.p===4?' w':'');
  const t=document.createElement('span'); t.className='t'; t.textContent=fmt(l.t);
  const u=document.createElement('span'); u.className='u'; u.textContent=l.unit; u.title=l.unit;
  const m=document.createElement('span'); m.className='m'; m.textContent=l.m;
  r.append(t,u,m); return r;
}
function atBottom(){return window.innerHeight+window.scrollY>=document.body.scrollHeight-40}
function add(l){
  all.push(l); if(all.length>MAX) all.shift();
  if (l.unit.startsWith('lamp-') || !lampOnly) chip(l.unit);
  if (!visible(l)) return;
  const stick=atBottom(); log.appendChild(row(l));
  while (log.children.length>MAX) log.firstChild.remove();
  if (stick) window.scrollTo(0,document.body.scrollHeight);
}
function redraw(){ log.textContent=''; const f=document.createDocumentFragment(); all.filter(visible).forEach(l=>f.appendChild(row(l))); log.appendChild(f); window.scrollTo(0,document.body.scrollHeight); }

fetch('/info').then(r=>r.json()).then(i=>{ if(i.lamp){ document.getElementById('lampName').textContent=i.lamp; document.title='Lamp Log: '+i.lamp; } }).catch(()=>{});
function connect(){
  const es=new EventSource('/stream?back=300');
  es.onopen=()=>{statusEl.textContent='live · read only'};
  es.onmessage=e=>{ const l=JSON.parse(e.data); count++; if(paused){held.push(l); statusEl.textContent=`paused · ${held.length} waiting`; return;} add(l); };
  es.addEventListener('oops',e=>{statusEl.textContent='lamp said: '+JSON.parse(e.data)});
  es.onerror=()=>{statusEl.textContent='reconnecting…'};
}
document.getElementById('pause').onclick=e=>{ paused=!paused; e.target.textContent=paused?'Resume':'Pause'; e.target.classList.toggle('on',paused); if(!paused){held.forEach(add); held=[]; statusEl.textContent='live · read only';} };
document.getElementById('lamp').onclick=e=>{ lampOnly=!lampOnly; e.target.classList.toggle('on',lampOnly); redraw(); };
document.getElementById('noisy').onclick=e=>{ hideSteps=!hideSteps; e.target.classList.toggle('on',hideSteps); redraw(); };
document.getElementById('clear').onclick=()=>{ all.length=0; log.textContent=''; };
q.oninput=redraw;
connect();

// The conversation: lamp-memory's store on the lamp (heard and said), read only, new turns every 3 s.
const turns=document.getElementById('turns'), cstatus=document.getElementById('cstatus');
let last=0, lastDay='', polling=null;
function dayOf(ms){return new Date(ms).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function turnEl(x){
  const d=dayOf(x.t), f=document.createDocumentFragment();
  if(d!==lastDay){const h=document.createElement('div');h.className='day';h.textContent=d;f.appendChild(h);lastDay=d;}
  const el=document.createElement('div'); el.className='turn';
  const meta=document.createElement('div'); meta.className='meta';
  const who=document.createElement('span'); who.className='who'; who.textContent=x.who;
  meta.append(fmt(x.t).slice(0,8)+' · ', who);
  el.appendChild(meta);
  if(x.heard){const p=document.createElement('p');p.className='h';const b=document.createElement('b');b.textContent='Heard: ';p.append(b,x.heard);el.appendChild(p);}
  if(x.said){const p=document.createElement('p');p.className='s';const b=document.createElement('b');b.textContent='Lamp: ';p.append(b,x.said);el.appendChild(p);}
  const mx=document.createElement('div'); mx.className='mx'; el.appendChild(mx); el.dataset.t=x.t;
  f.appendChild(el); return f;
}
// Each turn's timings: the request whose "first piece to the voice" time is the turn's time (within 300 ms).
function chipM(label,val,unit,slow,cls){const s=document.createElement('span');if(cls)s.className=cls;if(slow)s.classList.add('slow');const b=document.createElement('b');b.textContent=val+unit;s.append(label+' ',b);return s;}
function fill(el,r){
  const mx=el.querySelector('.mx'); mx.textContent='';
  if(!r){const s=document.createElement('span');s.className='none';s.textContent='no timings: older than the lamp\'s journal, or not a spoken turn';mx.appendChild(s);el.dataset.done='1';return;}
  const add=(l,v,u,slow,c)=>{if(v!==undefined&&v!==null)mx.appendChild(chipM(l,v,u,slow,c));};
  add('total heard→sound',r.first_audio_ms,' ms',r.first_audio_ms>2000,'tot');
  add('in: last word',r.stt_last_ms,' ms after speech',r.stt_last_ms>600);
  add('LLM TTFT',r.llm_ttft_ms,' ms',r.llm_ttft_ms>1500);
  add('LLM end',r.llm_end_ms,' ms');
  add('gen',r.gen_tps,' tok/s');
  add('tokens',r.prompt_tokens!==undefined?`${r.prompt_tokens} in (${r.cached_tokens} cached) / ${r.completion_tokens} out`:undefined,'');
  add('to TTS',r.first_piece_ms,' ms');
  add('TTS first byte',r.tts_first_byte_ms,' ms'+(r.tts_conn?` (${r.tts_conn})`:''),r.tts_first_byte_ms>600);
  add('req',r.request,'');
  el.dataset.done='1';
}
async function metricsFor(els){
  if(!els.length) return;
  const ts=els.map(e=>+e.dataset.t);
  try{
    const r=await fetch(`/metrics?since=${Math.min(...ts)}&until=${Math.max(...ts)}`); const reqs=await r.json();
    if(reqs.error) return;
    els.forEach(el=>{const t=+el.dataset.t; let best=null,d=301; reqs.forEach(q=>{const dd=Math.abs(q.piece_at-t); if(dd<d){d=dd;best=q;}});
      // A turn under 15 s old may still be waiting for its TTS line: try again next poll.
      if(!best && Date.now()-t<15000) return; fill(el,best);});
  }catch(e){}
}
async function poll(){
  try{
    const r=await fetch(`/conversation?since=${last}&limit=${last?100:200}`); const data=await r.json();
    if(data.error){cstatus.textContent='lamp said: '+data.error;return;}
    const stick=atBottom();
    data.forEach(x=>{turns.appendChild(turnEl(x)); last=Math.max(last,x.t);});
    cstatus.textContent=`${turns.querySelectorAll('.turn').length} turns · read only · new turns every 3 s`;
    metricsFor([...turns.querySelectorAll('.turn:not([data-done])')]);
    if(stick&&data.length) window.scrollTo(0,document.body.scrollHeight);
  }catch(e){cstatus.textContent='reconnecting…';}
}
function show(c){
  document.body.classList.toggle('c',c);
  document.getElementById('tabLog').classList.toggle('on',!c);
  document.getElementById('tabConvo').classList.toggle('on',c);
  if(c&&!polling){poll();polling=setInterval(poll,3000);}
  window.scrollTo(0,document.body.scrollHeight);
}
document.getElementById('tabLog').onclick=()=>show(false);
document.getElementById('tabConvo').onclick=()=>show(true);
</script>
</body>
</html>

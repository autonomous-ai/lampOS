name: lampOS sensor scorers

on:
  pull_request:
    branches: [lamp-voice]
    paths:
      - lampOS/tools/sensors/**
      - lampOS/docs/sensor-evaluation.md
      - .github/workflows/lampos-sensor-score.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lampOS/tools/sensors
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - run: cargo test --offline --locked
      - run: cargo build --offline --locked --workspace

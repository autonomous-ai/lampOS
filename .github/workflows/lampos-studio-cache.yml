name: lampOS Studio cache

# Fills the Mac Studio runners' shared build cache (sccache, cargo registry)
# from each lamp-voice push, so pull requests routed to the Studio
# (lampos-arm64.yml, .github/scripts/lampos-route.py) build only what they
# change. Pull request jobs there read the cache and can't write it (the
# runner host mounts it read-only for them); this job, on the one trusted slot
# (label studio-trusted, which refuses anything but lamp-voice and main), is
# its only writer.
#
# A workflow of its own: lampos-promote requires lamp-voice's ARM64 run to
# succeed, so a failed or stuck warming must never be part of it. Nothing is
# tested, published or signed here and no secret is read; if it fails, the
# Studio's pull requests only build more.
#
# The commands are the ARM64 job's, flag for flag: sccache keys on them.
on:
  push:
    branches: ['lamp-voice']
    paths: ['lampOS/**', '.github/workflows/lampos-studio-cache.yml']
  workflow_dispatch:

concurrency:
  # Only the newest lamp-voice commit is worth warming.
  group: lampos-studio-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    if: github.repository == 'autonomous-ai/lampOS' && github.ref == 'refs/heads/lamp-voice'
    name: lampOS — warm the Studio's build cache
    runs-on:
      group: lampos-studio
      labels: [self-hosted, linux, arm64, studio-trusted]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust 1.96.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0 -c clippy -c rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: build (release, the lamps' binaries)
        working-directory: lampOS
        run: cargo build --locked --release --workspace --bins --examples --message-format=json-render-diagnostics > /dev/null
      - name: build the two artifact examples
        working-directory: lampOS
        run: |
          cargo build --locked --release -p lamp-schedule --example schedule_check \
            --target-dir target/lampos-artifact-examples --message-format=json-render-diagnostics > /dev/null
          cargo build --locked --release -p lamp-expression --example replay_cost \
            --target-dir target/lampos-artifact-examples --message-format=json-render-diagnostics > /dev/null
      - name: build the test binaries (listed, not run)
        working-directory: lampOS
        run: cargo nextest list --locked --release --workspace --profile pr > /dev/null
      - name: sccache's count
        if: always()
        run: sccache --show-stats || true

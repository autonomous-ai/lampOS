name: lampOS SDKs

# The developer SDKs (lampOS/sdk/python, lampOS/sdk/js, #3504): they run on a
# developer's computer, never on a lamp, so the Rust workflows don't reach
# them. Their tests run against each SDK's own fake lamp; each checks its
# copy of docs/control.schema.json against the repository's, and the
# `copies` job fails at once if the three differ: a schema change that missed
# a copy broke #3759 and #3805 on 27 Oct, with no job to catch it (the
# coordinator's decision, with blue's person, on #3504).
on:
  pull_request:
    branches: [lamp-voice]
    paths:
      - 'lampOS/sdk/**'
      - 'lampOS/docs/control*'
      - 'lampOS/docs/skill-format*'
      - '.github/workflows/lampos-sdk.yml'
  push:
    branches: [lamp-voice]
    paths:
      - 'lampOS/sdk/**'
      - 'lampOS/docs/control*'
      - 'lampOS/docs/skill-format*'
      - '.github/workflows/lampos-sdk.yml'

permissions:
  contents: read

jobs:
  copies:
    name: lampOS SDK — schema copies equal docs/control.schema.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Each SDK's copy is the doc's, byte for byte
        run: |
          status=0
          # A copy marked `required` must exist: a deleted or renamed one
          # fails.
          while read -r doc copy need; do
            if [ ! -e "$copy" ]; then
              if [ "$need" = required ]; then
                echo "::error file=$copy::missing: cp $doc $copy"
                status=1
              fi
              continue
            fi
            if ! cmp -s "$doc" "$copy"; then
              echo "::error file=$copy::differs from $doc: cp $doc $copy"
              status=1
            fi
          done <<'COPIES'
          lampOS/docs/control.schema.json lampOS/sdk/python/src/lampos/control.schema.json required
          lampOS/docs/control.schema.json lampOS/sdk/js/src/control.schema.json required
          lampOS/docs/skill-format.schema.json lampOS/sdk/python/src/lampos/skill-format.schema.json required
          COPIES
          exit $status

  # Each SDK's floor, exactly as promised (requires-python 3.10, engines
  # 20.11), and a current one, so the floor stays tested (harness-reviewer's
  # P3s on #3823 and #3830).
  python:
    name: lampOS SDK — Python ${{ matrix.python }} (pytest)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: lampOS/sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests

  # lamp-mcp (lampOS/sdk/mcp) on the Python SDK of the same commit: no job ran
  # it, so the SDK's phrase floor (#3914) left 4 of its tests failing on
  # lamp-voice unseen (harness-reviewer and Ten, 28 Oct).
  mcp:
    name: lampOS SDK — lamp-mcp, Python ${{ matrix.python }} (pytest)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: lampOS/sdk/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ../python -e '.[test]'
      - run: python -m pytest -q tests

  js:
    name: lampOS SDK — JavaScript, Node ${{ matrix.node }} (node --test)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20.11', '22']
    defaults:
      run:
        working-directory: lampOS/sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund --omit=optional
      - run: npm test

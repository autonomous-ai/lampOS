name: lampOS published Settings compatibility

# Actual released store writers and readers qualify only this
# file-format pair. Normal build/download network remains available; no device,
# GPIO/I2C, provider, broker, service or hardware acceptance participates.
on:
  pull_request:
    branches: ['lamp-voice']
    paths:
      - 'lampOS/crates/settings/tests/release_pair*'
      - 'lampOS/crates/settings/tests/release_pair/**'
      - '.github/workflows/lampos-settings-pair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lampos-settings-pair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  published-pair:
    name: published 6408 and 6498 Settings store readers on ARM64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    container: rust:1.96.0-bookworm
    env:
      CARGO_HOME: /github/home/.cargo
      PAIR_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: require native ARM64 before source work
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -m 700 /tmp/settings-pair-output /tmp/settings-pair-artifacts
          uname -sm > /tmp/settings-pair-output/platform
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: record the exact checkout and source before fixture work
        shell: bash
        run: |
          set -euo pipefail
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD 'HEAD^{tree}' \
            > /tmp/settings-pair-output/source-revision
          printf '%s\n' "run_id=$GITHUB_RUN_ID" "run_attempt=$GITHUB_RUN_ATTEMPT" \
            "pr_head=$PAIR_PR_HEAD" "event=$GITHUB_EVENT_NAME" \
            > /tmp/settings-pair-output/run-provenance.txt
          # Compare the checked-out tracked paths, including merge previews.
          # Hash regular contents separately from exact symlink text: readlink
          # -z preserves trailing newlines without command substitution loss.
          cat > /tmp/settings-pair-source-guard.sh <<'GUARD'
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          phase=$1
          prefix="/tmp/settings-pair-output/source-$phase"
          git -c safe.directory="$GITHUB_WORKSPACE" ls-files -z | sort -z > "$prefix.paths"
          : > "$prefix.sha256"
          : > "$prefix.symlinks"
          while IFS= read -r -d '' path; do
            if test -L "$path"; then
              printf '%s\0' "$path" >> "$prefix.symlinks"
              readlink -z -- "$path" >> "$prefix.symlinks"
            elif test -f "$path"; then
              sha256sum --zero -- "$path" >> "$prefix.sha256"
            else
              printf 'missing or nonregular tracked path: %q\n' "$path" >&2
              exit 1
            fi
          done < "$prefix.paths"
          GUARD
          bash /tmp/settings-pair-source-guard.sh before
      - name: fixture build dependencies
        run: |
          set -eu
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq pkg-config
      - uses: actions/cache/restore@v4
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            lampOS/target
          key: lampos-settings-pair-${{ github.sha }}
          restore-keys: |
            lampos-arm64-u2204-${{ hashFiles('lampOS/Cargo.lock') }}-
            lampos-arm64-u2204-
      - name: fetch and verify the exact published Settings artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/settings-pair-artifacts/{6408,6498}
          rustc --version --verbose > /tmp/settings-pair-output/rustc-version
          for release in 6408 6498; do
            artifact="/tmp/settings-pair-artifacts/$release/lamp-settings"
            case "$release" in
              6408) asset_id=668607890; bytes=1529624; expected=26079d50d404d1751793519a3179ae86f8a442889a99388e115cfa89f274bd2d ;;
              6498) asset_id=670759896; bytes=1529744; expected=559410666aae9d415ff072fc9a8682a4f1f5837026e4ee535028f4f21fbc648c ;;
            esac
            url="https://github.com/autonomous-ai/lampOS/releases/download/lampos-lamp-voice-$release/lamp-settings"
            curl --fail --location --proto '=https' --proto-redir '=https' \
              --retry 3 --connect-timeout 20 --max-time 180 "$url" --output "$artifact"
            test "$(stat -c '%s' "$artifact")" = "$bytes"
            printf '%s  %s\n' "$expected" "$artifact" | sha256sum --check --strict
            test "$(od -An -tx1 -N6 "$artifact" | tr -d ' \n')" = 7f454c460201
            test "$(od -An -tx1 -j18 -N2 "$artifact" | tr -d ' \n')" = b700
            chmod 0555 "$artifact"
            printf 'release=%s asset_id=%s url=%s bytes=%s sha256=%s ELF=64-bit-little-endian-AArch64\n' \
              "$release" "$asset_id" "$url" "$bytes" "$expected" >> /tmp/settings-pair-output/verified-artifacts.txt
          done
          # Distinct published payloads; hashes bind bytes, not signatures.
          find /tmp/settings-pair-artifacts -type f -print0 | sort -z | xargs -0 sha256sum \
            > /tmp/settings-pair-output/downloaded.sha256
          chmod 0555 /tmp/settings-pair-artifacts/{6408,6498} /tmp/settings-pair-artifacts
      - name: execute exactly two released Settings pair cases
        working-directory: lampOS
        shell: bash
        env:
          LAMP_COMPAT_OUTPUT: /tmp/settings-pair-output
          LAMP_COMPAT_SETTINGS_6408: /tmp/settings-pair-artifacts/6408/lamp-settings
          LAMP_COMPAT_SETTINGS_6498: /tmp/settings-pair-artifacts/6498/lamp-settings
        run: |
          set -euo pipefail
          set +e
          cargo test --locked --release -p lamp-settings --test release_pair \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee /tmp/settings-pair-output/settings-tests.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > /tmp/settings-pair-output/settings-exit
          printf '%s\n' "${statuses[1]}" > /tmp/settings-pair-output/tee-exit
          validate_execution() {
            grep -Eq '^test result: ok\. 2 passed; 0 failed; 0 ignored; 0 measured; 3 filtered out; finished in [0-9.]+s$' \
              /tmp/settings-pair-output/settings-tests.log || return
            shopt -s nullglob
            local results=(/tmp/settings-pair-output/sr-*/result.json)
            test "${#results[@]}" -eq 2 || return
            for receipt in "${results[@]}"; do
              test -f "$receipt" && test ! -L "$receipt" || return 1
            done
            jq --exit-status --slurp '
              length == 2 and
              all(.[]; .result == "passed" and .actual_released_pair == true and
                .children_reaped == 7 and .rpc_count == 34 and
                .groups_absent == true and .hardware_or_device_acceptance == false) and
              ([.[].test] | sort) == [
                "release_6408_settings_reads_6498_and_6498_reads_return",
                "release_6498_settings_reads_6408_and_6408_reads_return"
              ]
            ' "${results[@]}"
          }
          validation_status=0
          validate_execution > /tmp/settings-pair-output/execution-validation.txt 2>&1 \
            || validation_status=$?
          printf '%s\n' "$validation_status" > /tmp/settings-pair-output/execution-validation-exit
          result=0
          if [ "${statuses[0]}" -ne 0 ] || [ "${statuses[1]}" -ne 0 ] \
            || [ "$validation_status" -ne 0 ]; then result=1; fi
          printf '%s\n' "$result" > /tmp/settings-pair-output/test-exit
          exit "$result"
      - name: retain cleanup and readonly-copy outcomes even after a failed test
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/settings-pair-output
          validate_cleanup() {
            shopt -s nullglob
            local results=(/tmp/settings-pair-output/sr-*/result.json)
            test "${#results[@]}" -eq 2 || return
            jq --exit-status --slurp 'length == 2 and all(.[];
              .children_reaped == 7 and .rpc_count == 34 and .groups_absent == true)' \
              "${results[@]}" || return
            local writable
            writable=$(find /tmp/settings-pair-artifacts /tmp/settings-pair-output -type f \
              \( -name lamp-settings -o -name lamp-settings-6408 -o -name lamp-settings-6498 \) \
              -perm /222 -print -quit) || return
            test -z "$writable"
          }
          result=0
          validate_cleanup > /tmp/settings-pair-output/cleanup-validation.txt 2>&1 || result=$?
          printf '%s\n' "$result" > /tmp/settings-pair-output/cleanup-validation-exit
          exit "$result"
      - name: verify source unchanged even after a failed fixture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/settings-pair-output
          result=0
          bash /tmp/settings-pair-source-guard.sh after \
            > /tmp/settings-pair-output/source-capture.txt 2>&1 || result=$?
          for map in paths sha256 symlinks; do
            cmp "/tmp/settings-pair-output/source-before.$map" "/tmp/settings-pair-output/source-after.$map" \
              >> /tmp/settings-pair-output/source-compare.txt 2>&1 || result=1
          done
          printf '%s\n' "$result" > /tmp/settings-pair-output/source-compare-exit
          exit "$result"
      - name: collect only regular evidence without executable copies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/settings-pair-output
          cd /tmp/settings-pair-output
          # Never open sockets/FIFOs or upload the released executable copies.
          find . -type f ! -name lamp-settings-6408 ! -name lamp-settings-6498 \
            ! -name lamp-settings ! -perm /111 -print0 | sort -z \
            | tar --null -T - -czf /tmp/lampos-settings-pair-evidence.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lampos-settings-pair-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: /tmp/lampos-settings-pair-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7

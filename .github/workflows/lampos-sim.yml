name: lampOS virtual lamp

# The SDKs against the virtual desktop lamp (lampOS/crates/sim, docs/simulator-lamp.md),
# on the pull requests that could change what a program sees (the first builder's list, #6059
# 12:14 GMT+7: sim, body, control, skills, the SDKs, the control doc and schema, the model, the two
# tools; a change elsewhere is the ARM64 and clippy runs', not this one's): the real
# lamp-control and lamp-body run unchanged on lamp-sim's simulated servos, ring
# and voice, and the JS SDK's tour, a Python SDK round trip and every SDK
# example (conformance/examples.js --sim) run against them, with no special
# mode in any SDK (tools/lamp-sim-check.sh and tools/lamp-sim-conformance.sh). Release binaries:
# the timings the conformance looks at are the body's, not a debug build's.
# Linux only (the real lamp-body runs there only). No camera, no microphone,
# no ffmpeg: lamp-sim opens neither unless asked.
on:
  pull_request:
    branches: [lamp-voice]
    paths:
      - 'lampOS/crates/sim/**'
      - 'lampOS/crates/body/**'
      - 'lampOS/crates/control/**'
      - 'lampOS/crates/skills/**'
      - 'lampOS/sdk/**'
      - 'lampOS/docs/control*'
      - 'lampOS/docs/lamp.model.json'
      - 'lampOS/tools/lamp-sim-check.sh'
      - 'lampOS/tools/lamp-sim-conformance.sh'
      - '.github/workflows/lampos-sim.yml'
  push:
    branches: [lamp-voice]
    paths:
      - 'lampOS/crates/sim/**'
      - 'lampOS/crates/body/**'
      - 'lampOS/crates/control/**'
      - 'lampOS/crates/skills/**'
      - 'lampOS/sdk/**'
      - 'lampOS/docs/control*'
      - 'lampOS/docs/lamp.model.json'
      - 'lampOS/tools/lamp-sim-check.sh'
      - 'lampOS/tools/lamp-sim-conformance.sh'
      - '.github/workflows/lampos-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lampos-sim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/lamp-voice' }}

jobs:
  sim:
    name: lampOS virtual lamp — SDK tour, Python round trip, every example
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: system packages
        run: |
          # The runner's mirror can stop resolving (azure.archive.ubuntu.com, #6429):
          # apt-get update exits 0 on fetch failures unless --error-on=any; then point the sources at a mirror that answers and try once more.
          if ! sudo apt-get --error-on=any update; then
            # Every *.ubuntu.com name stopped resolving on GitHub's runners (11 Nov), so
            # take the first mirror outside that domain that serves this release.
            if [ "$(dpkg --print-architecture)" = amd64 ]; then
              ms="http://mirrors.edge.kernel.org/ubuntu http://mirrors.ocf.berkeley.edu/ubuntu"
            else
              ms="http://mirrors.ocf.berkeley.edu/ubuntu-ports http://ftp.tu-chemnitz.de/pub/linux/ubuntu-ports"
            fi
            c=$(. /etc/os-release; echo "$VERSION_CODENAME")
            u=
            for m in $ms; do
              if curl -sfI -m 15 "$m/dists/$c/InRelease" >/dev/null; then u=$m; break; fi
            done
            [ -n "$u" ] || { echo "::error::no fallback mirror answers"; exit 1; }
            echo "::warning::apt-get update failed; retrying with $u"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] && sudo sed -i -E "s#mirror\+file:/etc/apt/apt-mirrors\.txt|https?://[a-z0-9.-]*(archive\.ubuntu\.com/ubuntu|ports\.ubuntu\.com/ubuntu-ports)/?#$u#g" "$f"
            done
            sudo apt-get update
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config clang libclang-dev libasound2-dev
      - uses: actions/checkout@v4
      - name: Rust 1.96.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Only the crate sources' registry: the repository's 10 GB cache is tight
      # (lampos-clippy.yml, devops007 on #1806), and a release target is large.
      - name: restore the registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lampos-sim-registry-${{ hashFiles('lampOS/Cargo.lock') }}
          restore-keys: lampos-sim-registry-
      - name: build the virtual lamp and its real parts (release)
        working-directory: lampOS
        run: cargo build --release --locked -p lamp-sim -p lamp-body -p lamp-control -p lamp-skills
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the SDKs, as a developer installs them
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e lampOS/sdk/python
          cd lampOS/sdk/js && npm install --no-audit --no-fund --omit=optional
      - name: SDK tour and a Python round trip against the virtual lamp
        run: bash lampOS/tools/lamp-sim-check.sh "$GITHUB_WORKSPACE/lampOS/target/release"
      - name: every SDK example against the virtual lamp
        run: bash lampOS/tools/lamp-sim-conformance.sh "$GITHUB_WORKSPACE/lampOS/target/release"

  # lamp-sim's own side on macOS arm64 (sim-3-P2, the first builder on #6811, 13 Nov 18:15): it
  # builds, is clippy-clean under macOS's cfg, and its tests pass there. Not the whole lamp yet:
  # lamp-body's serial runtime is Linux only (ten makes it portable), so no tour runs here. The two
  # speaker-stream tests are skipped until the bus takes datagrams over 2048 bytes on macOS
  # (sim-3-P3: SO_SNDBUF and SO_RCVBUF on the bus's sockets; the sysctl's default is 2048).
  # Free on this public repository.
  sim-macos:
    name: lampOS virtual lamp — lamp-sim builds and tests on macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.96.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: restore the registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lampos-sim-macos-registry-${{ hashFiles('lampOS/Cargo.lock') }}
          restore-keys: lampos-sim-macos-registry-
      - name: build lamp-sim and the parts it starts
        working-directory: lampOS
        run: cargo build --locked -p lamp-sim -p lamp-body -p lamp-control -p lamp-skills
      - name: clippy for lamp-sim under macOS's cfg
        working-directory: lampOS
        run: cargo clippy --locked -p lamp-sim --all-targets -- -D warnings
      - name: lamp-sim's tests
        working-directory: lampOS
        run: |
          cargo test --locked -p lamp-sim -- \
            --skip voice::tests::a_speaker_stream_is_opened_counted_told_in_stats_and_ends_when_the_door_closes \
            --skip voice::tests::a_player_that_never_reads_holds_neither_the_stats_nor_the_doors_closing_and_is_waited_for
      # With no body on macOS for now, the lamp comes up, says so once and stays up (it ended after
      # about 15 s, five body restarts, before): up within 30 s, still up 20 s later, then ended.
      - name: lamp-sim runs without a body and stays up
        working-directory: lampOS
        run: |
          dir="$HOME/.lampsim/ci"; mkdir -p -m 700 "$HOME/.lampsim"
          target/debug/lamp-sim run "$dir" --bin-dir target/debug --listen 127.0.0.1:7799 > sim.log 2>&1 &
          sim=$!
          for i in $(seq 1 60); do grep -q 'lamp-sim: up on' sim.log && break; sleep 0.5; done
          grep -q 'lamp-sim: up on' sim.log || { cat sim.log; exit 1; }
          sleep 20
          kill -0 "$sim" || { echo "lamp-sim ended"; cat sim.log; exit 1; }
          grep -q 'no body on this system' sim.log || { cat sim.log; exit 1; }
          if grep -q 'lamp-body started again' sim.log; then cat sim.log; exit 1; fi
          kill "$sim"; wait "$sim" || true
          cat sim.log
